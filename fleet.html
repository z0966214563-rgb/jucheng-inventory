<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#15181C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鉅誠車輛">
<title>鉅誠驗屋 · 車輛管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 車輛系統既有元件（先放前面，下面的新設計系統會蓋過基本元件） ===== */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--tc);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;padding-bottom:78px}
body.norole{padding-bottom:0}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:11px 14px 9px;
  border-bottom:3px solid var(--amber);display:flex;align-items:center;gap:10px}
header.top h1{margin:0;font-size:14.5px;font-weight:900;letter-spacing:.05em}
header.top .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#98A0AA;margin-top:2px}
header.top .sw{margin-left:auto;background:none;border:1px solid #4A525C;color:#C7CCD2;border-radius:3px;
  padding:6px 9px;font-family:var(--tc);font-size:11.5px;cursor:pointer;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 26px}
.wide{max-width:860px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);display:grid;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;color:#8E96A0;padding:10px 2px 11px;font-family:var(--tc);
  font-size:11px;font-weight:700;cursor:pointer;border-top:3px solid transparent}
nav.tabs button .ic{display:block;font-size:15px;margin-bottom:1px}
nav.tabs button[aria-selected="true"]{color:#fff;border-top-color:var(--amber)}

.card{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:12px}
.card .hd{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card .hd h2{margin:0;font-size:14px;font-weight:900;letter-spacing:.04em}
.card .bd{padding:14px}
.foot{padding:11px 14px;border-top:1px solid var(--line2);background:#FBFCFD}
.note{background:#FFF7E6;border:1px solid #F0D9A0;border-radius:3px;padding:10px 12px;font-size:12.5px;color:#6B5417;margin-bottom:12px}
.err{color:var(--alert);font-size:12.5px;font-weight:700;margin-top:7px}

label.f{display:block;margin-bottom:13px}
label.f .lbl{display:block;margin-bottom:6px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font-family:var(--tc);
  font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:17px;font-weight:600;min-width:52px;height:48px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer;color:var(--ink);padding:0 10px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--tc);font-weight:700;
  font-size:15px;padding:13px 18px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241A00}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.tiny{padding:5px 9px;font-size:11.5px;font-weight:500}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.block{display:flex;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.gate{max-width:420px;margin:0 auto;padding:34px 18px}
.gate h2{font-size:19px;font-weight:900;margin:0 0 4px}
.gate p{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.role{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);
  border-radius:3px;padding:16px;margin-bottom:11px;cursor:pointer;font-family:var(--tc);color:var(--ink)}
.role.amber{border-left-color:var(--amber)}
.role b{display:block;font-size:16.5px;font-weight:900;margin-bottom:3px}
.role span{font-size:13px;color:var(--muted)}

/* 車輛卡 */
.plate-cell{font-family:var(--mono);font-size:14px;letter-spacing:.5px;white-space:nowrap;color:var(--ink)}
.plate-cell.empty{color:var(--muted)}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:3px;background:#fff;padding:12px;border-left:4px solid var(--ok)}
.vcard.warn{border-left-color:var(--amber);background:var(--warn-bg)}
.vcard.bad{border-left-color:var(--alert);background:var(--alert-bg)}
.vcard .id{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.vcard .odo{font-family:var(--mono);font-size:13px;margin-top:6px}
.vcard .st{font-size:12.5px;font-weight:700;margin-top:5px}
.vcard .bar{height:6px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:7px}
.vcard .bar i{display:block;height:100%;background:var(--ok)}
.vcard.warn .bar i{background:var(--amber)}
.vcard.bad .bar i{background:var(--alert)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tw{overflow-x:auto}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#F7F8FA;white-space:nowrap}
th.n{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-size:14px}
tr:nth-of-type(even) td{background:#FBFCFD}
tr.warn td,tr.warn:nth-of-type(even) td{background:var(--warn-bg)}
tr.bad td,tr.bad:nth-of-type(even) td{background:var(--alert-bg)}
tr.edit td{background:#FFFBF0!important;padding:16px 12px}
.c-act{text-align:right;white-space:nowrap}
.c-act .btn{margin-left:4px}

.stats{display:flex;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line2);padding:18px 16px 20px}
.stats>div{flex:1 1 132px;padding:16px;border:1px solid var(--line2);border-radius:3px;background:#FBFCFD}
.stats .fig{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.1;margin-top:10px}

/* 拍照 */
.shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;padding:12px}
.shotbox{border:1px dashed var(--line);border-radius:3px;background:#F7F8FA;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;position:relative}
.shotbox.has{border-style:solid;border-color:var(--ok)}
.shotbox img{width:100%;height:100%;object-fit:cover}
.shotbox .cam{font-size:24px;color:var(--muted);line-height:1}
.shotbox .ct{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;text-align:center;padding:0 6px}
.shotbox .redo{position:absolute;right:0;bottom:0;background:rgba(21,24,28,.82);color:#fff;
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 5px}
.thumbs{display:flex;gap:5px;flex-wrap:wrap;padding:10px 14px}
.thumbs figure{margin:0;width:78px}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:2px;border:1px solid var(--line);display:block;cursor:pointer}
.thumbs figcaption{font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px;line-height:1.2}

.odoin{display:flex;align-items:center;gap:8px}
.odoin input{font-family:var(--mono);font-size:32px;font-weight:600;text-align:center;height:62px;
  border-width:2px;border-color:var(--ink)}
.odoin .unit{font-family:var(--mono);font-size:15px;color:var(--muted)}

.rechd{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;
  border-bottom:1px solid var(--line2);padding:12px 14px;cursor:pointer;font-family:var(--tc);color:var(--ink)}
.rechd .caret{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,12,15,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.lbbox{background:#fff;border-radius:3px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.lbbox img{width:100%;display:block;background:#000}
.lbinfo{padding:12px 14px}
.lbbar{display:flex;gap:8px;padding:0 14px 14px;justify-content:space-between}

.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:99;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:3px;font-size:14px;font-weight:700;border-left:4px solid var(--amber);max-width:88%}
.hide{display:none!important}
.big-alert{background:var(--alert-bg);border:1px solid var(--alert);border-left-width:4px;border-radius:3px;
  padding:14px;margin-bottom:12px}
.big-alert b{font-size:15px}

/* 保養明細 */
.ihd,.iline{display:grid;grid-template-columns:1fr 62px 78px 82px 44px;gap:8px;align-items:center}
.ihd{padding:7px 0;border-bottom:1px solid var(--line2)}
.ihd span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ihd span:nth-child(2),.ihd span:nth-child(3),.ihd span:nth-child(4){text-align:right}
.iline{padding:8px 0;border-bottom:1px solid var(--line2)}
.iline input{width:100%;border:1px solid var(--line);border-radius:3px;padding:7px 8px;
  font-family:var(--tc);font-size:14px}
.iline input.num{font-family:var(--mono);text-align:right}
.iline.ro>div:nth-child(2),.iline.ro>div:nth-child(3){text-align:right;font-size:14px}
.iline .sub3{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;
  font-weight:600;text-align:right}
.itot{display:flex;align-items:center;gap:10px;padding:11px 0 0;border-top:1px solid var(--line)}
.itot b{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:700}
.shootbox{display:block;border:1px dashed var(--line);border-radius:4px;padding:20px 14px;
  text-align:center;cursor:pointer;background:#FBFCFD}
.shootbox:hover{background:#F5F7F9}
.shootbox .h2b{font-size:15.5px;font-weight:600}
.rcpt img{width:100%;max-height:230px;object-fit:contain;border:1px solid var(--line);
  border-radius:4px;background:#F7F8FA}
.rcpt .ract{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sline{display:flex;align-items:center;gap:8px;cursor:pointer}
.sline span:first-child{flex:1;min-width:0;line-height:1.5}
.caret2{font-size:11px;color:var(--muted);flex:none}
.openrow td{background:#FAFBFC}
td.sdet{background:#FBFCFD;padding:12px 14px}
.rcptimg{max-width:100%;max-height:260px;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
@media (max-width:560px){
  .ihd,.iline{grid-template-columns:1fr 50px 66px 70px 38px;gap:6px}
  .iline input{padding:6px;font-size:13px}
}

/* 區域切換 */
.regsw{display:flex;gap:6px;margin-left:auto;margin-right:9px}
.regsw button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  border-radius:999px;padding:0 13px;min-height:36px;font-family:var(--tc);font-size:13px;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center}
.regsw button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.regsw button[disabled]{opacity:.3;cursor:not-allowed}
.swshort{display:none}
@media (max-width:560px){ .regsw{gap:5px;margin-right:7px} .regsw button{padding:0 10px;font-size:12px} }
@media (max-width:380px){
  header.top{padding-left:10px;padding-right:10px}
  header.top .sw{padding:6px 8px}
  .swlong{display:none} .swshort{display:inline}
  .regsw{margin-right:5px;gap:4px}
  .regsw button{padding:0 7px;font-size:11.5px}
}
/* 設定頁：每位管理者的可管區域 */
.rgrant{display:flex;gap:4px;flex-wrap:wrap}
.rgrant button{border:1px solid var(--line2);background:#fff;color:var(--muted);
  border-radius:999px;padding:3px 9px;font-family:var(--tc);font-size:11.5px;cursor:pointer;white-space:nowrap}
.rgrant button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.rgrant button[disabled]{opacity:.35;cursor:not-allowed}

/* 用現代模式渲染，但版面緊密度維持跟原本一樣 */
table{line-height:normal}
.foot{line-height:1}
label.f>.lbl{display:block;line-height:1.5}

/* 出車登記：把「組別」跟「車別」分清楚 */
.pick{margin:14px 0 4px}
.pickT{font-family:var(--tc);font-size:13.5px;color:var(--muted);margin-bottom:7px}
.pickT b{color:var(--ink);font-size:15px;font-weight:800}
.chips.crewchips .chip.crew{min-width:auto;padding:0 16px;height:46px;border-radius:999px;
  font-family:var(--tc);font-size:15px;font-weight:700}
.chips.crewchips .chip.crew[aria-pressed="true"]{background:var(--amber,#F5A623);
  border-color:var(--amber,#F5A623);color:#1a1a1a}
.chips.vehchips .chip.veh{min-width:auto;padding:0 14px;height:46px;border-radius:8px;
  display:inline-flex;align-items:baseline;gap:3px;font-family:var(--mono);font-size:19px;font-weight:800}
.chips.vehchips .chip.veh i{font-style:normal;font-family:var(--tc);font-size:11.5px;font-weight:400;opacity:.65}
.confirm{margin-top:14px;padding:11px 13px;border:1px dashed var(--line);border-radius:6px;
  background:var(--bg2);font-family:var(--tc);font-size:15px;text-align:center}
.confirm b{font-family:var(--mono);font-size:18px}
.confirm .ar{color:var(--muted);margin:0 10px;font-size:13px}
.confirm .miss{color:var(--muted);font-size:13.5px}
/* ---- 出車紀錄：一行三欄 ---- */
.r3{display:grid;grid-template-columns:auto 1fr auto 12px;align-items:center;gap:12px}
.veh{font-size:13px;font-weight:700;color:#3C434C;white-space:nowrap;min-width:62px}
.veh b{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);margin-right:2px}
.veh .pl{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);
  letter-spacing:.01em;margin-left:7px}
@media(max-width:400px){ .veh .pl{display:block;margin-left:0;margin-top:1px} }

/* 編輯一筆出車紀錄 */
.tedit{padding:13px 14px;border-top:1px solid var(--line2);background:#FBFCFD}
.tedit .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.tedit label{display:block}
.tedit .lbl{display:block;margin-bottom:5px}
.tedit select,.tedit input{width:100%;font-family:var(--tc);font-size:15px;padding:9px 10px;
  border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
.tedit .row{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}

/* 各車餘額卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px;padding:14px}
.ccard{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:3px;
  background:#fff;padding:12px 13px}
.ccard.warn{border-left-color:var(--alert);background:var(--alert-bg)}
.ccard.none{border-left-color:var(--line);background:#FBFCFD}
.ccard .top{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.ccard .id{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
.ccard .pl{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.ccard .amt{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1.1}
.ccard.warn .amt{color:var(--alert)}
.ccard.none .amt{font-size:16px;color:var(--muted);font-weight:600}
.ccard .last{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
.per{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crewc{font-size:12.5px;color:#3C434C;white-space:nowrap}
.crewc b{font-size:14.5px;font-weight:700;color:var(--ink)}
.crewc.none{color:var(--amber-d);background:var(--warn-bg);border:1px solid #F0D9A0;
  border-radius:3px;padding:2px 7px;font-weight:700}
.sl{font-size:13.5px;line-height:1.9;display:flex;gap:10px}
.sl-k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  white-space:nowrap;padding-top:4px;flex:none;width:64px}
.sl.miss{color:var(--amber-d);font-weight:700}
.sl.miss .sl-k{color:var(--amber-d)}
.facts{display:flex;flex-wrap:wrap;border-top:1px solid var(--line2);background:#FBFCFD}
.facts>span{flex:1;min-width:92px;padding:9px 12px;font-family:var(--mono);font-size:13px;
  border-right:1px solid var(--line2)}
.facts>span:last-child{border-right:0}
.facts i{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--muted);
  font-style:normal;margin-bottom:2px}
.recfoot{padding:10px 14px;border-top:1px solid var(--line2);display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;justify-content:space-between}
.stamp{font-family:var(--mono);font-size:13px}
.stamp i{font-style:normal;font-size:9.5px;letter-spacing:.1em;color:var(--muted);
  display:block;margin-bottom:1px}
.sortbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 11px;padding:0 2px}
.sb-k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#4A515A;margin-right:2px}

/* ---- 篩選列（出車日期、悠遊卡紀錄共用）---- */
.mvf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;
  border-bottom:1px solid var(--line2);background:#FBFCFD}
.mvchip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 13px;font-family:var(--tc);font-size:13.5px;cursor:pointer;color:var(--ink);line-height:1}
.mvchip.sm{padding:6px 12px;font-size:13px}
.mvchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mvchip .c{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.mvchip[aria-pressed="true"] .c{color:#C7CCD2}
.mvchip.warnc{border-color:var(--amber);color:var(--amber-d);font-weight:700}
.mvchip.warnc[aria-pressed="true"]{background:var(--amber-d);color:#fff;border-color:var(--amber-d)}
.mvdate{border:1px solid var(--line);border-radius:3px;padding:7px 9px;
  font-family:var(--mono);font-size:13px;width:auto}
.mvsearch{flex:1;min-width:140px;border:1px solid var(--line);border-radius:3px;padding:8px 11px;
  font-family:var(--tc);font-size:14px}
.mvsum{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:11px 14px;
  border-bottom:1px solid var(--line2)}
.mvsum div{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.mvsum b{font-size:16px;color:var(--ink);font-weight:700;margin-right:2px}

/* ---- 車號＋車牌 ---- */
.bcell{white-space:nowrap}
.bc{font-family:var(--mono);font-size:16px;font-weight:700;margin-right:7px}
.bc2{font-family:var(--mono);font-size:14.5px;font-weight:700;margin-right:6px}
.bp{font-family:var(--mono);font-size:12px;color:var(--muted)}
.badtag{background:var(--warn-bg);color:var(--amber-d);border-radius:2px;padding:0 5px;font-weight:700}
.shotbox.need{border-color:var(--amber);background:var(--warn-bg)}
.dcell{white-space:nowrap}
@media(max-width:420px){ .tw td,.tw th{padding-left:8px;padding-right:8px} }

/* 悠遊卡 */
.calcbox{margin:2px 0 14px;padding:11px 13px;border:1px solid var(--line2);border-radius:6px;
  background:var(--bg2);font-family:var(--mono);font-size:14px;line-height:1.6}
.calcbox.bad{border-color:var(--alert);background:#fff7f6}
.calcbox b{font-size:16px}
.warnbox{border-color:var(--alert);border-width:2px}
.lowlist{display:flex;flex-wrap:wrap;gap:8px}
.lowlist div{display:flex;align-items:baseline;gap:7px;border:1px solid var(--alert);border-radius:6px;
  padding:7px 11px;font-family:var(--mono)}
.lowlist span{color:var(--alert);font-weight:800}

/* 設定頁：可收合區塊 */
.card.sect{overflow:hidden}
.secHd{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  padding:15px 16px;cursor:pointer;text-align:left;font-family:inherit}
.card.sect.open .secHd{border-bottom:1px solid var(--line2)}
.secTitle{font-family:var(--tc);font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
.secM{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secC{color:var(--muted);font-size:11px;flex:none}
.secHd:active{background:var(--bg2)}
.locgrid{display:flex;flex-wrap:wrap;gap:7px}
.lchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  background:#fff;border-radius:8px;padding:0 12px;min-height:38px;cursor:pointer;
  font-family:var(--tc);font-size:14px;font-weight:700;color:var(--ink)}
.lchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.locbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;
  padding-top:11px;border-top:1px dashed var(--line2)}

.upg{min-height:70vh;display:flex;flex-direction:column;align-items:center;
     justify-content:center;text-align:center;padding:0 28px;gap:14px}
.upgT{font-size:21px;font-weight:800;letter-spacing:.04em}
.upgS{font-size:15px;line-height:1.85;color:var(--mut,#667085)}
.upgS b{color:var(--ink,#15181c)}

/* ===================================================================
   設計系統 v2
   白卡片 ＋ 大圓角 ＋ 柔和底色，不用框線分隔，改用留白與層次
   深靛藍為主色，狀態色（綠／琥珀／紅）各自分明
   =================================================================== */
:root{
  /* 中性 */
  --ink:#1A1F2B;          /* 主要文字 */
  --ink2:#454D5E;         /* 次要文字 */
  --muted:#5E6676;        /* 說明文字：白底上對比 5.9:1，戶外也看得清楚 */
  --faint:#8A92A2;        /* placeholder、次要圖示 */
  --paper:#D5DCE8;        /* 頁面底色：要明顯比卡片暗，邊界才看得出來 */
  --card:#FFFFFF;
  --sunk:#EDF0F6;         /* 卡片裡再凹一層 */
  --line:#B9C3D6;         /* 卡片與按鈕的邊框，要看得見 */
  --line2:#DCE2EC;        /* 卡片內部的分隔線 */

  /* 主色 */
  --brand:#1E2B4D;        /* 深靛藍：標題列、主要按鈕 */
  --brand2:#33477A;
  --brandsoft:#DEE6F7;
  --brandline:#9FB1D8;
  --link:#1B4FC4;         /* 可點的東西 */

  /* 狀態：顏色要認得出來，不要都糊成一片 */
  --ok:#0A7A52;    --ok-bg:#D6F0E4;   --ok-line:#86CBAE;
  --warn:#9E5A00;  --warn-bg:#FDEBCB; --warn-line:#E8B765;
  --bad:#C22D20;   --bad-bg:#FBDDD8;  --bad-line:#EC9A8F;
  --blue:#1B4FC4;  --blue-bg:#DBE5FB; --blue-line:#9FB7EE;
  --purple:#6B3FA0;--purple-bg:#EBE0F7;--purple-line:#BFA3E0;
  --amber:#E89510; --amber-d:#9E5A00; --amber-bg:#FDEBCB;
  --alert:#C22D20; --alert-bg:#FBDDD8;

  /* 形狀與陰影 */
  --r:14px; --r2:10px; --r3:7px;
  --sh:0 1px 2px rgba(20,30,56,.07), 0 3px 10px rgba(20,30,56,.07);
  --sh2:0 3px 8px rgba(20,30,56,.10), 0 14px 34px rgba(20,30,56,.14);

  --tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --mono:var(--tc);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--tc);background:var(--paper);color:var(--ink);
  font-size:15.5px;line-height:1.6;padding-bottom:86px;
  -webkit-font-smoothing:antialiased}
body.norole{padding-bottom:0}
button,input,select,textarea{font-family:inherit}

/* 數字一律等寬，對帳才對得齊 */
.num,.fig,.n{font-variant-numeric:tabular-nums}

/* 小標籤：不再用大寫等寬，改成好讀的淡字 */
.lbl{font-size:12.5px;color:var(--muted);letter-spacing:0;text-transform:none;line-height:1.6}

/* ---------- 版面 ---------- */
.wrap{max-width:600px;margin:0 auto;padding:16px 15px 28px}
.wide{max-width:900px}

/* ---------- 標題列 ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:13px 15px;display:flex;align-items:center;gap:10px;border-bottom:0}
header.top h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.01em}
header.top .sub{font-size:12px;color:#A9B4CE;margin-top:1px;font-weight:400}
header.top .htitle{flex:1;min-width:0}
header.top h1,header.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regsel{flex:none;max-width:128px;background:rgba(255,255,255,.12);color:#fff;
  border:1px solid rgba(255,255,255,.22);border-radius:var(--r3);height:36px;
  padding:0 8px 0 11px;font-size:13.5px;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;padding-right:24px}
.regsel option{color:var(--ink);background:#fff}
.hmenu,.hback{flex:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:var(--r3);width:36px;height:36px;font-size:17px;line-height:1;cursor:pointer}
.hmenu:active,.hback:active{background:rgba(255,255,255,.2)}
.hmpanel{position:absolute;top:calc(100% + 6px);right:12px;z-index:60;background:#fff;
  border-radius:var(--r2);box-shadow:var(--sh2);min-width:184px;overflow:hidden;padding:5px}
.hmpanel button{display:block;width:100%;text-align:left;background:none;border:0;
  border-radius:var(--r3);padding:11px 13px;font-size:14.5px;color:var(--ink);cursor:pointer}
.hmpanel button:hover,.hmpanel button:active{background:var(--sunk)}

/* ---------- 底部頁籤 ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
  display:grid;border-top:1px solid var(--line2);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 16px rgba(26,31,43,.06)}
nav.tabs.hide{display:none}
nav.tabs button{border:0;background:none;padding:9px 2px 8px;cursor:pointer;
  font-size:10.5px;font-weight:600;color:var(--faint);line-height:1.3;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:18px;line-height:1;position:relative;display:inline-block}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
nav.tabs button[aria-selected="true"] .ic{transform:translateY(-1px)}
.nbadge{position:absolute;top:-5px;right:-10px;background:var(--bad);color:#fff;font-style:normal;
  font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;line-height:1}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:9px;padding:15px 16px 0}
.card>.hd h2{margin:0;font-size:16px;font-weight:700;letter-spacing:.01em}
.card>.bd{padding:15px 16px}
.card>.bd.nopad{padding:0}
.card>.hd+.bd{padding-top:12px}
.card .foot{padding:11px 16px;background:var(--sunk);font-size:12.5px;color:var(--muted)}

/* ---------- 按鈕 ---------- */
.btn{appearance:none;border:1.5px solid var(--brand);border-radius:var(--r2);
  background:var(--brand);color:#fff;
  font-size:15px;font-weight:600;padding:12px 17px;cursor:pointer;line-height:1.3;
  transition:transform .06s ease, filter .12s ease}
.btn:active{transform:scale(.985);filter:brightness(1.12)}
.btn:disabled{background:#AEB7C8;border-color:#AEB7C8;color:#fff;cursor:not-allowed;transform:none}
.btn.block{display:block;width:100%}
.btn.ghost{background:#fff;color:var(--brand);border-color:var(--line)}
.btn.ghost:active{background:var(--brandsoft)}
.btn.ghost:disabled{color:var(--faint);border-color:var(--line2);background:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber-d);color:#3A2600}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:10px 13px;font-size:14px;border-radius:var(--r3)}
.btn.tiny{padding:7px 11px;font-size:12.5px;border-radius:var(--r3);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- 輸入 ---------- */
.f{display:block;margin-bottom:14px}
.f>.lbl{display:block;margin-bottom:6px;font-size:13px;color:var(--ink2);font-weight:600}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
  width:100%;border:1.5px solid var(--line);border-radius:var(--r2);background:#fff;
  padding:11px 13px;font-size:15.5px;color:var(--ink);outline:0;
  transition:border-color .12s, box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);
  box-shadow:0 0 0 3px rgba(51,71,122,.18)}
input::placeholder{color:var(--faint)}
input.num,input[type=number]{text-align:center;font-weight:700}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2379808F' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:32px}
label.ck{display:flex;align-items:center;gap:9px;font-size:14.5px;cursor:pointer;margin-bottom:12px}
label.ck input{width:19px;height:19px;flex:none;accent-color:var(--brand)}

/* ---------- 分段控制 ---------- */
.iseg,.seg{display:flex;gap:3px;background:var(--sunk);border:1.5px solid var(--line);
  border-radius:var(--r2);padding:3px}
.iseg button,.seg button{flex:1;border:0;background:none;border-radius:var(--r3);
  padding:10px 6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.iseg button[aria-pressed="true"],.seg button[aria-pressed="true"]{
  background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(26,31,43,.10)}

/* ---------- 標籤 / 狀態點 ---------- */
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;
  margin-left:6px;vertical-align:middle;border:0}
.tag.m{background:var(--brandsoft);color:var(--brand)}
.tag.i{background:#EFEBF8;color:#5B4B8A}
.tag.v{background:var(--amber-bg);color:var(--amber-d)}
.tag.c{background:#EEF0F5;color:var(--muted)}
.ipill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.ipill.ok{background:var(--ok-bg);color:var(--ok)}
.ipill.bad{background:var(--bad-bg);color:var(--bad)}
.ipill.warn{background:var(--warn-bg);color:var(--warn)}
.ipill.grey{background:#EEF0F5;color:var(--muted)}

/* ---------- 數字磚 ---------- */
.stats,.numrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:0}
.stats>div,.numrow>div{background:var(--sunk);border:0;border-radius:var(--r2);
  padding:13px 10px;text-align:center}
.stats .lbl,.numrow i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-bottom:4px}
.stats .fig,.numrow b{display:block;font-size:26px;font-weight:700;color:var(--ink);line-height:1.1;
  font-variant-numeric:tabular-nums}

/* ---------- 清單列 ---------- */
.list{border-radius:var(--r);overflow:hidden}
.row2{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--line2);padding:13px 16px;font-family:inherit}
.row2:last-child{border-bottom:0}
.row2:active{background:var(--sunk)}
.row2 .bd2{flex:1;min-width:0}
.row2 .t{display:block;font-size:15px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .go{flex:none;color:var(--faint);font-size:19px}
.row2 .q{flex:none;text-align:right}
.row2 .q b{display:block;font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.row2 .q i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}

/* ---------- 表格（還是需要表格的地方）---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 10px;
  background:var(--sunk);border:0;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line2);vertical-align:middle}
tr.warn td{background:var(--bad-bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 空狀態 ---------- */
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:700;margin-bottom:5px}
.emptyic{font-size:30px;line-height:1;margin-bottom:11px;opacity:.5}

/* ---------- 提示框 ---------- */
.warnbox{background:var(--warn-bg);border-radius:var(--r2);padding:12px 14px;
  font-size:13.5px;line-height:1.7;color:#6B4200}
.err{background:var(--bad-bg);border-radius:var(--r2);padding:12px 14px;
  font-size:13.5px;line-height:1.7;color:#8A2820}
.note{background:var(--brandsoft);border-radius:var(--r2);padding:12px 14px;
  font-size:13.5px;line-height:1.7;color:var(--brand)}
.krule{font-size:13px;color:var(--muted);background:var(--sunk);border:0;
  border-radius:var(--r2);padding:10px 13px;margin:-4px 0 14px}

/* ---------- 浮出視窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(18,22,31,.5);z-index:90;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:540px;z-index:91;
  background:#fff;border-radius:20px 20px 0 0;box-shadow:var(--sh2);
  padding-bottom:env(safe-area-inset-bottom)}
.sheet .shd{padding:20px 20px 8px;font-size:17px;font-weight:700}
.sheet .sbd{padding:0 20px 6px;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.sheet .sft{display:flex;gap:10px;padding:16px 20px 20px}
.sheet .sft .btn{flex:1}
@media(min-width:560px){.sheet{bottom:auto;top:10vh;border-radius:var(--r)}}

/* ---------- 吐司 ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:95;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r2);
  font-size:14px;max-width:88%;text-align:center;box-shadow:var(--sh2)}

/* ---------- 搜尋與篩選 ---------- */
.mvf{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:0 16px 13px}
.mvchip{display:inline-flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:20px;
  padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.mvchip:hover{background:var(--sunk)}
.mvchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.mvchip[aria-pressed="true"] .c{color:#B9C6E4}
.mvsearch{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:var(--r2);
  padding:10px 13px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:20px;
  padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---- 次分頁 ---- */
.subbar{display:flex;gap:4px;background:#fff;border:1.5px solid var(--line);
  border-radius:var(--r2);padding:4px;margin:0 auto 14px;max-width:600px;box-shadow:var(--sh)}
.subbar button{flex:1;border:0;background:none;border-radius:var(--r3);padding:10px 6px;
  font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.subbar button[aria-pressed="true"]{background:var(--brandsoft);color:var(--brand)}
.sbb{position:absolute;top:4px;right:6px;background:var(--bad);color:#fff;font-style:normal;
  font-size:10px;font-weight:700;min-width:15px;height:15px;border-radius:8px;padding:0 4px;
  display:inline-flex;align-items:center;justify-content:center;line-height:1}

/* ---- 全螢幕子頁 ---- */
.pgtop{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.pgback{flex:none;background:#fff;border:0;box-shadow:var(--sh);border-radius:var(--r2);
  width:38px;height:38px;font-size:18px;color:var(--ink);cursor:pointer}
.pgback:active{background:var(--sunk)}
.pgt{flex:1;min-width:0}
.pgt b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgt span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- 開關 ---- */
.sw{flex:none;position:relative;width:44px;height:26px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:background .15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;
  border-radius:50%;box-shadow:0 1px 3px rgba(26,31,43,.25);transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{transform:translateX(18px)}
.prow.voff{background:var(--sunk)}
.prow.voff>span:first-child{color:var(--faint)}

/* ===================================================================
   電腦版：版面置中、頁籤一樣留在下面，只是不要被拉成一條
   =================================================================== */
@media (min-width:900px){
  body{padding-bottom:92px}
  body.norole{padding-bottom:0}

  /* 底部頁籤：白底橫跨整列，但按鈕本身置中成一組 */
  nav.tabs{display:flex!important;justify-content:center;gap:6px;
    grid-template-columns:none!important;
    padding:9px 16px calc(9px + env(safe-area-inset-bottom));
    border-top:1.5px solid var(--line);box-shadow:0 -2px 18px rgba(20,30,56,.08)}
  nav.tabs button{flex:0 0 auto;min-width:132px;flex-direction:row;justify-content:center;gap:9px;
    padding:11px 18px;border-radius:var(--r2);font-size:14.5px;font-weight:600;color:var(--ink2)}
  nav.tabs button .ic{font-size:17px}

async function uploadPhoto(path,dataUrl,opt){
  opt=opt||{};
  const blob=await (await fetch(dataUrl)).blob();
  const tries=opt.tries||UP_TRIES;
  let last=null;
  for(let i=0;i<tries;i++){
    if(!upOnline()){ last=new Error("目前沒有網路"); await upSleep(1500); continue; }
    try{ return await uploadOnce(path,blob); }
    catch(e){

    while(bgQueue.length){
      if(!upOnline()){ await upSleep(5000); continue; }   // 沒訊號就安靜等，不狂重試

  return {interval:x.interval_km,warnKm:x.warn_km,urgentKm:x.urgent_km,
          keepTrips:x.keep_trips,photoItems:x.photo_items||[]};
}
function applyConfig(cfg){
  S=blankState();
  S.settings=mapSettings(cfg.settings||{});
  S.crews=cfg.crews||[];
  S.vehicles=(cfg.vehicles||[]).map(v=>({code:v.code,odo:v.odo,next:v.next,
    interval:v.interval,lastSvc:0,card:v.card}));
}
function applyState(st,urls){
  const N=blankState();
  N.settings=mapSettings(st.settings||{});
  N.crews=st.crews||[];
  N.cards=(st.cards||[]).map(c=>({id:c.id,vehicle:c.code,kind:c.kind,amount:c.amount,
    balance:c.balance,expected:c.expected,diff:c.diff,person:c.person,note:c.note||"",
    photo:(urls||{})[c.photo]||null,photo2:(urls||{})[c.photo2]||null,date:c.date,time:c.time}));
  N.cardDels=(st.cardDels||[]).map(d=>({...d, photo:(urls||{})[d.photo]||null,
    photo2:(urls||{})[d.photo2]||null}));
  N.vehicles=(st.vehicles||[]).map(v=>({id:v.id,code:v.code,plate:v.plate||"",odo:v.odo,
    lastSvc:v.lastSvc,next:v.next,interval:v.interval,used:v.used,card:v.card}));
  const U=urls||{};
  N.trips=(st.trips||[]).map(t=>{
    const ph={};
    (t.photos||[]).forEach(p=>{ if(U[p.path]) ph[p.label]=U[p.path]; });
    return {id:t.id,vehicle:t.code,person:t.person,crew:t.crew||"",odo:t.odo,prev:t.prev,
            date:t.date,time:t.time,pruned:t.pruned,photos:ph,
            ts:new Date(t.created_at).getTime()};
  });
  N.services=(st.services||[]).map(x=>({id:x.id,vehicle:x.code,date:x.date,odo:x.odo,
    next:x.next,note:x.note,person:x.person,
    items:(x.items||[]).map(i=>({name:i.name||"",qty:Number(i.qty)||0,price:Number(i.price)||0})),
    total:Number(x.total)||0, receipt:x.receipt||null, receipt2:x.receipt2||null,
    receiptUrl:(urls||{})[x.receipt]||null, receiptUrl2:(urls||{})[x.receipt2]||null}));
  N.admins=(st.operators||[]).map(o=>({id:o.id,name:o.name,regions:o.regions||[],
    canInv:o.can_inv!==false, canFleet:o.can_fleet!==false}));
  // 把自己的權限旗標補到 me 上，按鈕才知道能不能按
  if(me){ const self=N.admins.find(a=>a.id===me.id);
    if(self){ me.canInv=self.canInv; me.canFleet=self.canFleet; } }
  N.anyOp=true;
  if(Array.isArray(st.my_regions)&&st.my_regions.length) myRegions=st.my_regions;
  (st.regions||[]).forEach(r=>{ const x=REGIONS.find(y=>y.code===r.code); if(x) x.name=r.name; });
  S=N;
}
async function reload(){
  const st=await rpc("fleet_state",{p_token:token,p_region:REG,p_days:365});
  if(!st||typeof st!=="object") throw new Error("讀取資料失敗，請重試");
  const paths=[];
  (st.trips||[]).forEach(t=>(t.photos||[]).forEach(p=>paths.push(p.path)));
  (st.services||[]).forEach(x=>{ if(x.receipt) paths.push(x.receipt); if(x.receipt2) paths.push(x.receipt2); });
  (st.cards||[]).forEach(c=>{ if(c.photo) paths.push(c.photo); if(c.photo2) paths.push(c.photo2); });
  (st.cardDels||[]).forEach(d=>{ if(d.photo) paths.push(d.photo); if(d.photo2) paths.push(d.photo2); });
  applyState(st,await signUrls(paths));
}
async function guard(fn,okMsg){
  try{ await fn(); if(okMsg)toast(okMsg); }
  catch(e){ toast(e.message||"操作失敗"); }
}

function cRngDates(){
  const t=today(), d=new Date(t+"T00:00:00");
  const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  const back=n=>{ const x=new Date(d); x.setDate(x.getDate()-n); return fmt(x); };
  switch(cRng.preset){
    case "week":  { const w=(d.getDay()+6)%7; return {from:back(w), to:t}; }
    case "month": return {from:t.slice(0,8)+"01", to:t};
    case "q":     return {from:back(90),  to:t};
    case "half":  return {from:back(182), to:t};
    case "last":  { const x=new Date(d.getFullYear(), d.getMonth(), 0);
                    return {from:fmt(new Date(d.getFullYear(), d.getMonth()-1, 1)), to:fmt(x)}; }
    default:      return {from:cRng.from||"1900-01-01", to:cRng.to||"2999-12-31"};
  }
}

/* ===================== 保養狀態判定 ===================== */
const intervalOf=v=>v.interval||S.settings.interval;
function statusOf(v){
  const remain=(v.next||0)-(v.odo||0);
  let level="ok", text=`距離保養還有 ${km(remain)} 公里`;
  if(remain<=0){ level="bad"; text=`已超過保養里程 ${km(-remain)} 公里`; }
  else if(remain<=S.settings.urgentKm){ level="bad"; text=`剩 ${km(remain)} 公里，請盡快安排保養`; }
  else if(remain<=S.settings.warnKm){ level="warn"; text=`剩 ${km(remain)} 公里，該安排保養了`; }
  const span=intervalOf(v);
  const pct=Math.max(0,Math.min(100,Math.round(((span-remain)/span)*100)));
  return {remain,level,text,pct};
}
const alerts=()=>VEH().filter(v=>statusOf(v).level!=="ok").slice().sort(byCode);
// 車別排序：英數在前（A、B、C…），中文等其他字元排後面
const byCode=(a,b)=>{
  const A=String(a.code), B=String(b.code);
  const ascii=t=>/^[0-9A-Za-z]/.test(t)?0:1;
  return (ascii(A)-ascii(B)) || A.localeCompare(B,"zh-Hant",{numeric:true});
};

  const a=(S.admins||[]).find(x=>x.id===login.id);
  if(!a)return toast("請選擇管理者");
  busy=true; render();
  try{
    const res=await rpc("op_login",{p_id:login.id,p_pin:login.pin});
    const row=Array.isArray(res)?res[0]:res;
    token=row.token; me={id:row.operator_id,name:row.name};
    myRegions=Array.isArray(row.regions)?row.regions:[REG];
    await reload();
    role="admin"; tab="fleet"; gate="pick"; login={id:"",pin:""};
    window.scrollTo(0,0);
  }catch(e){ toast(e.message||"登入失敗"); }
  busy=false; render();
}
async function addAdmin(){
  const n=(setup.name||"").trim();
  if(!n)return toast("請填姓名");
  if(!/^[0-9]{4}$/.test(setup.pin))return toast("PIN 請設 4 位數字");
  if(setup.pin!==setup.pin2)return toast("兩次輸入的 PIN 不一致");
  await guard(async()=>{
    if(token){ await rpc("op_add",{p_token:token,p_region:REG,p_name:n,p_pin:setup.pin}); await reload(); }
    else { await rpc("op_bootstrap",{p_name:n,p_pin:setup.pin,p_region:REG});
           S.admins=(await rpc("op_names_f",{p_region:REG})).map(o=>({id:o.id,name:o.name}));
           gate="pickAdmin"; }
    setup={name:"",pin:"",pin2:""}; render();
  },"已建立管理者");
}
async function delAdmin(id){
  if(me&&me.id===id)return toast("不能刪除目前使用中的自己");
  if(!confirm("刪除這位管理者？"))return;
  await guard(async()=>{ await rpc("op_delete",{p_token:token,p_id:id});
    await reload(); render(); },"已刪除");
}
async function toggleGrant(id,region,on){
  if(me&&me.id===id&&!on) return toast("不能收回自己的權限");
  if(!on&&!confirm(`收回「${region}」的管理權限？`)) return;
  await guard(async()=>{
    await rpc("op_grant",{p_token:token,p_id:id,p_region:region,p_on:on});
    await reload(); render();
  }, on?`已加開 ${region}`:`已收回 ${region}`);
}
async function toggleApp(id, app, on){
  const a=(S.admins||[]).find(x=>x.id===id);
  const what=app==="inv"?"設備盤點系統":"車輛管理系統";
  if(!on && !confirm(`要收回「${a?a.name:""}」的${what}管理權限嗎？\n收回後他不會出現在該系統的登入名單，也不能做任何管理動作。`))return;
  await guard(async()=>{
    await rpc("op_set_app",{p_token:token,p_id:id,p_app:app,p_on:on});
    await reload(); render();
  }, on?`已開放${what}`:`已收回${what}`);
}
async function resetPin(id){
  const a=S.admins.find(x=>x.id===id); if(!a)return;
  const v=prompt(`重設「${a.name}」的 PIN 碼（4 位數字）`);
  if(v===null)return;
  if(!/^[0-9]{4}$/.test(v))return toast("PIN 請設 4 位數字");
  await guard(async()=>{ await rpc("op_set_pin",{p_token:token,p_id:id,p_pin:v}); },"已重設 PIN");
}
function switchRole(){ hdrMenu=false; editV=null;
  if(draft&&draft.odo&&!confirm("目前的出車登記尚未送出，離開會遺失。要切換身分嗎？"))return;

function pickV(c){ draft.vehicle=draft.vehicle===c?"":c; render(); }
function pickCrew(c){ draft.crew=draft.crew===c?"":c; render(); }
function startTrip(){
  const n=document.getElementById("pname"); if(n)draft.person=n.value.trim();
  if(!draft.person)return toast("請先填姓名");
  if(CREWS().length&&!draft.crew)return toast("請選擇你是哪一組");
  if(!draft.vehicle)return toast("請選擇今天開哪一台車");
  draft.started=true; window.scrollTo(0,0); render();
}
/* ===================== 悠遊卡 ===================== */
const cardOf=c=>{const v=VEH().find(x=>x.code===c);return v?v.card:null;};
function cardCalc(){
  const prev=cardOf(card.vehicle);
  const amt=parseInt(card.amount,10);
  if(prev==null||!amt||amt<=0) return null;
  const exp=card.kind==="topup"?prev+amt:prev-amt;
  const bal=card.balance===""?null:parseInt(card.balance,10);
  return {prev,exp,bal,diff:(bal==null||isNaN(bal))?null:bal-exp};
}
function setCard(k,v){ card[k]=v; render(); }
function shootCard(inp,n){ if(!inp.files[0])return;
  shrink(inp.files[0],d=>{ if((n||1)===2) card.photo2=d; else card.photo=d; render(); }); }
function dropCardPhoto(n){
  if((n||1)===2){ card.photo2=null; }
  else { card.photo=card.photo2||null; card.photo2=null; }   // 刪第一張時第二張遞補
  render();
}

function cardSlot(n){
  const img=n===2?card.photo2:card.photo;

  return `<label class="shotbox ${img?"has":""}${need?" need":""}" style="width:100%;height:150px">

async function submitCard(){
  if(busy)return;
  if(!card.vehicle)return toast("請選擇哪一台車");
  const amt=parseInt(card.amount,10);
  if(!amt||amt<=0)return toast("請填金額");
  if(!card.person.trim())return toast("請填登錄人姓名");
  if(card.kind==="topup"){
    if(card.balance==="")return toast("儲值請填寫儲值後的餘額");
    if(!card.photo)     return toast("儲值請拍收據照片");
  }
  if(cardOf(card.vehicle)==null&&card.balance==="")
    return toast("這台車還沒有餘額基準，第一次請把發票上的餘額填進去");
  busy=true; setProgress("上傳中…"); render();
  try{
    const stamp=Date.now();
    const dir=`${slugOf(REG)}/card/${pathSafe(card.vehicle)}`;
    const jobs=[];
    if(card.photo)  jobs.push({path:`${dir}/${stamp}.jpg`,  data:card.photo});
    if(card.photo2) jobs.push({path:`${dir}/${stamp}-2.jpg`,data:card.photo2});
    if(jobs.length){
      const fails=await uploadMany(jobs,null,2);
      if(fails.length) throw new Error(`照片沒傳成功（${fails[0].err||""}），內容都留著，請再按一次`);
    }
    const path =jobs[0]?jobs[0].path:null;
    const path2=jobs[1]?jobs[1].path:null;
    setProgress("寫入紀錄…");
    const r=await rpc("fleet_card_submit",{p:{region:REG,code:card.vehicle,kind:card.kind,
      amount:amt,balance:card.balance===""?null:String(parseInt(card.balance,10)),
      person:card.person.trim(),photo:path,photo2:path2,time:nowHM()}});
    cardResult={code:card.vehicle,kind:card.kind,amount:amt,
      balance:r.balance,diff:r.diff,low:r.low,low_at:r.low_at};
    const keep=card.person;
    card=newCard(); card.person=keep;
    if(role==="card"){ applyConfig(await rpc("fleet_config",{p_region:REG})); }
    else { await reload(); }
    setProgress(null); busy=false; window.scrollTo(0,0); render();
    toast("已登記");
  }catch(e){
    setProgress(null); busy=false; render();
    toast("送出失敗："+(e.message||""));
  }
}

function shrink(f,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();
  img.onload=()=>{const m=640,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.6));};
  img.src=fr.result;};fr.readAsDataURL(f);}
function tripBase(){
  return `${slugOf(REG)}/${pathSafe((draft&&draft.vehicle)||"_")}/${(draft&&draft.uid)||"x"}`;
}
function shoot(t,inp){ if(!inp.files[0])return;
  shrink(inp.files[0],d=>{ draft.photos[t]=d;
    if(!draft.up) draft.up={};
    delete draft.up[t];
    bgPush("trip:"+t,`${tripBase()}/${pathSafe(t)}.jpg`,d,
      pth=>{ if(draft){ (draft.up||(draft.up={}))[t]=pth; render(); } });
    render(); }); }
// 這趟總共要傳幾張、好了幾張
function tripUp(){
  const items=(S.settings&&S.settings.photoItems)||[];
  let need=0,done=0;
  items.forEach(t=>{ if(draft&&draft.photos[t]){ need++; if(draft.up&&draft.up[t]) done++; } });
  return {need,done};
}
function resetDraft(){ if(confirm("清空目前的登記？")){draft=newDraft();render();} }
async function submitTrip(){
  if(busy)return;
  const v=vehOf(draft.vehicle); if(!v)return;
  const odo=parseInt(String(draft.odo).replace(/\D/g,""))||0;
  if(odo<=0)return toast("請輸入里程");
  if(odo<(v.odo||0))return toast("里程不能小於上次登記");
  for(const t of S.settings.photoItems){ if(!draft.photos[t])return toast(`「${t}」還沒拍`); }

  busy=true; render();
  try{
    const slot=await rpc("fleet_next_slot",{p_region:REG,p_code:v.code});
    const base=tripBase();          // 三個區都有 A 車，路徑用這趟的唯一代號分開
    const up=draft.up||{};
    const photos=[], jobs=[];
    for(const t of S.settings.photoItems){
      let path=up[t];
      if(!path){ path=`${base}/${pathSafe(t)}.jpg`; jobs.push({key:"trip:"+t,path,data:draft.photos[t],label:t}); }
      photos.push({label:t,path});
    }
    if(jobs.length){
      jobs.forEach(j=>bgDrop(j.key));          // 別跟背景佇列搶著傳同一張
      let n=0; const total=jobs.length;
      setProgress(`上傳照片 0/${total}`);
      const fails=await uploadMany(jobs,()=>{ n++; setProgress(`上傳照片 ${n}/${total}`); });
      jobs.forEach(j=>{ if(j.ok) (draft.up||(draft.up={}))[j.label]=j.path; });
      if(fails.length) throw new Error(
        `還有 ${fails.length} 張照片沒傳成功（${fails[0].err||""}）。`+
        `里程和照片都留著，網路好一點再按一次送出就好，已經傳好的不會重傳。`);
    }
    setProgress("寫入登記…");
    const r=await rpc("fleet_submit",{p:{region:REG,code:v.code,person:draft.person,crew:draft.crew||"",odo,
      time:nowHM(),slot,photos}});
    v.odo=odo;
    bgClear(); draft=null; setProgress(null); busy=false; render();
    if(r&&r.level!=="ok"){
      toast(r.remain<=0?`已登記。${v.code} 車已超過保養里程 ${km(-r.remain)} 公里`
                       :`已登記。${v.code} 車距離保養剩 ${km(r.remain)} 公里`);
    } else toast(`${v.code} 車已登記 ${km(odo)} 公里`);
  }catch(e){
    setProgress(null); busy=false; render();
    toast("送出失敗："+(e.message||""));
  }
}
function setProgress(m){ progressMsg=m;
  const el=document.getElementById("prog"); if(el) el.textContent=m||"";

async function saveVeh(code){
  const v=vehOf(code); if(!v)return;
  const g=id=>document.getElementById(id);
  await guard(async()=>{
    await rpc("fleet_vehicle_update",{p_token:token,p_id:v.id,
      p_plate:(g("e_plate").value||"").trim(),
      p_odo:Math.max(0,parseInt(g("e_odo").value)||0),
      p_next:Math.max(0,parseInt(g("e_next").value)||0),
      p_interval:parseInt(g("e_int").value)||0});
    editV=null; await reload(); render();
  },`${code} 車已更新`);
}
async function addVeh(){
  const c=(nVeh.code||"").trim().toUpperCase();
  if(!c)return toast("請填車輛代號");
  if(VEH().some(v=>v.code===c))return toast(`${c} 車已經存在`);
  await guard(async()=>{
    await rpc("fleet_vehicle_add",{p_token:token,p_region:REG,p_code:c,
      p_plate:(nVeh.plate||"").trim(),
      p_odo:Math.max(0,parseInt(nVeh.odo)||0),
      p_next:Math.max(0,parseInt(nVeh.next)||0)});
    nVeh={code:"",plate:"",odo:0,next:0}; await reload(); render();
  },`已新增 ${c} 車`);
}
async function delVeh(code){
  const v=vehOf(code); if(!v)return;
  if(!confirm(`刪除 ${code} 車？`))return;
  await guard(async()=>{ await rpc("fleet_vehicle_delete",{p_token:token,p_id:v.id});
    await reload(); render(); },`已刪除 ${code} 車`);
}

function svcSummary(x){

function shrinkFile(f,cb){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const m=1400, sc=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=img.width*sc; c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.75)); };
    img.src=fr.result; };
  fr.readAsDataURL(f);
}
async function readReceipt(n){
  n=n||1;
  const img=n===2?svc.receipt2:svc.receipt;
  if(!img) return toast("請先拍保養單或選照片");
  if(svc.reading) return;
  svc.reading=n; render();
  try{
    const res=await fetch(`${SB_URL}/functions/v1/read-receipt`,{
      method:"POST",
      headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({token,image:img})});
    const txt=await res.text();
    let j={}; try{ j=JSON.parse(txt); }catch(e){}
    if(!res.ok){
      if(res.status===404) throw new Error("還沒有安裝辨識功能，可以先手動填明細");
      throw new Error((j.error||txt.slice(0,120)||`辨識失敗（${res.status}）`)
        +(j.detail?`\n${String(j.detail).slice(0,120)}`:""));
    }
    const items=(j.items||[]).map(i=>({name:i.name||"",qty:Number(i.qty)||0,price:Number(i.price)||0}));
    if(!items.length){ toast("這張單沒讀到明細，請手動填"); }
    else{
      // 第一張：取代明細（重讀一次不會變兩倍）。第二張：加在後面
      svc.items = n===2 ? (svc.items||[]).concat(items) : items;
      if(j.note&&!String(svc.note||"").trim()) svc.note=j.note;
      toast(`第 ${n} 張辨識到 ${items.length} 項，目前合計 ${money(sumItems(svc.items))}，請核對後再送出`);
    }
  }catch(e){ toast("辨識失敗："+(e.message||"")); }
  svc.reading=null; render();
}
function pickReceipt(inp,n){
  if(!inp.files||!inp.files[0])return;
  shrinkFile(inp.files[0],d=>{ if((n||1)===2) svc.receipt2=d; else svc.receipt=d; render(); });
}
function dropReceipt(n){
  if((n||1)===2){ svc.receipt2=null; }
  else { svc.receipt=svc.receipt2||null; svc.receipt2=null; }   // 刪第一張時第二張遞補
  render();
}

function rcptSlot(n){
  const img = n===2?svc.receipt2:svc.receipt;

  if(!img) return `<label class="shootbox">

let svcView="new", svVeh=null, svSort="time";
async function addSvc(){
  const v=vehOf(svc.vehicle); if(!v)return toast("請選擇車輛");
  const odo=parseInt(svc.odo)||0;
  if(odo<=0)return toast("請填本次保養里程");
  const next=parseInt(svc.next)||0;
  await guard(async()=>{
    const stamp=Date.now();
    const dir=`${slugOf(REG)}/svc/${pathSafe(v.code)}`;
    const jobs=[];
    if(svc.receipt)  jobs.push({path:`${dir}/${stamp}.jpg`,  data:svc.receipt});
    if(svc.receipt2) jobs.push({path:`${dir}/${stamp}-2.jpg`,data:svc.receipt2});
    if(jobs.length){
      const fails=await uploadMany(jobs,null,2);
      if(fails.length) throw new Error(`照片沒傳成功（${fails[0].err||""}），內容都留著，請再按一次`);
    }
    const path =jobs[0]?jobs[0].path:null;
    const path2=jobs[1]?jobs[1].path:null;
    const items=cleanItems(svc.items);
    await rpc("fleet_service_add",{p_token:token,p_region:REG,p_code:v.code,p_odo:odo,
      p_next:next,p_note:svc.note.trim(),p_items:items,p_receipt:path,p_receipt2:path2});
    const code=v.code;
    svc=blankSvc(code);
    await reload();
    // 登記完直接切到紀錄，展開剛剛那一筆，確認明細與保養單
    const just=S.services.find(x=>x.vehicle===code);
    svcView="log"; openSvc=just?just.id:null; window.scrollTo(0,0); render();
    const nv=vehOf(code);
    toast(`${code} 車已登記保養，下次 ${km(nv?nv.next:next)} 公里`);
  });
}

  return `<div class="wrap wide">

      <div><i>出車</i><b>${vIn.length}<s>/${VEH().length}</s></b></div>
      ${cAll.length?`<div><i>組別有登記</i><b>${cIn.length}<s>/${cAll.length}</s></b></div>`:""}
      <div><i>登記筆數</i><b>${dayAll.length}</b></div>
    </div>

    <div class="card"><div class="hd"><h2>${isT?"今天各車":D.slice(5).replace("-","/")+" 各車"}</h2>
      ${cOut.length?`<span class="lbl" style="margin-left:auto">沒登記的組：${cOut.map(esc).join("、")}</span>`:""}</div>
      <div class="bd"><div class="vgrid">${tiles}</div>
        <div class="lbl" style="margin-top:10px">點一台車可以看它的歷史出車紀錄。沒出車的不一定有問題，可能那天沒排班。</div></div></div>

    ${tVeh?`<div class="card"><div class="hd"><h2>${esc(tVeh)} 車歷史出車 <small class="lbl">${day.length} 筆</small></h2>
      <button class="btn ghost tiny" style="margin-left:auto;white-space:nowrap" onclick="pickTVeh('${esc(tVeh)}')">回到當天</button></div>
      ${day.length?`<div class="bd nopad" style="margin-top:12px">${recs}</div>`

const TABS={driver:[["trip","▣","出車登記"]], card:[["card","◎","悠遊卡"]],
  admin:[["fleet","▤","車輛"],["service","⚑","保養"],["trips","▦","出車紀錄"],
         ["card","◎","悠遊卡"],["set","⚙","設定"]]};
/* ===================================================================
   打字中重畫不換掉輸入框：
   以前每次重畫整個畫面都換新，打字打到一半（尤其中文注音停下來選字時）
   遇到搜尋延遲重畫、照片上傳狀態更新，輸入框被換掉，鍵盤收起來、組字中斷。
   現在：正在打字的那個輸入框原封不動留著，只換掉它周圍的內容。
   =================================================================== */
function setApp(app,html){
  const a=document.activeElement;
  const typing=a&&a!==document.body&&app.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)
    &&!/^(checkbox|radio|file|button|submit|date|month|time|range|color)$/i.test(a.type||"");
  if(!typing){ app.innerHTML=html; return; }
  const path=[]; let n=a;
  while(n&&n!==app){ path.unshift(Array.prototype.indexOf.call(n.parentNode.childNodes,n)); n=n.parentNode; }
  const tmp=document.createElement(app.tagName); tmp.innerHTML=html;
  // 新畫面裡同一個位置，必須也是同一種輸入框，才沿用
  let m=tmp, okPath=true, l=app;
  for(const i of path){ m=m&&m.childNodes[i]; l=l&&l.childNodes[i];
    if(!m||!l||m.nodeType!==1||m.tagName!==l.tagName){ okPath=false; break; } }
  const same=x=>x.getAttribute("oninput")||x.getAttribute("onchange")||x.getAttribute("name")||"";
  if(!okPath||(m.id||"")!==(a.id||"")||same(m)!==same(a)){ app.innerHTML=html; return; }
  const sync=(el,src,skip)=>{
    for(const at of Array.from(el.attributes)) if(!src.hasAttribute(at.name)&&!(skip&&skip.includes(at.name))) el.removeAttribute(at.name);
    for(const at of Array.from(src.attributes)) if(!(skip&&skip.includes(at.name))&&el.getAttribute(at.name)!==at.value) el.setAttribute(at.name,at.value);
  };
  let live=app, nw=tmp;
  for(let d=0;d<path.length;d++){
    const i=path[d], keep=live.childNodes[i], kids=Array.from(nw.childNodes), nk=kids[i];
    while(keep.previousSibling) live.removeChild(keep.previousSibling);
    while(keep.nextSibling) live.removeChild(keep.nextSibling);
    for(let j=0;j<i;j++) live.insertBefore(kids[j],keep);
    for(let j=i+1;j<kids.length;j++) live.appendChild(kids[j]);
    if(d<path.length-1) sync(keep,nk); else sync(keep,nk,["value"]);
    live=keep; nw=nk;
  }
}

  if(t.length>1){ nv.className="tabs"; nv.style.gridTemplateColumns=`repeat(${t.length},1fr)`;
    nv.innerHTML=t.map(([k,i,l])=>{
      const n=k==="fleet"?al:0;
      return `<button aria-selected="${tab===k}" onclick="go('${k}')"><span class="ic">${i}${
        n?`<i class="nbadge">${n>9?"9+":n}</i>`:""}</span>${l}</button>`;}).join("");
    document.body.classList.remove("norole");
  } else { nv.className="tabs hide"; document.body.classList.add("norole"); }
  setApp(app, role==="driver" ? viewTrip()
    : role==="card" ? viewCardEntry()
    : tab==="service" ? viewService() : tab==="trips" ? viewTrips()
    : tab==="card" ? viewCardAdmin()
    : tab==="cardnew" ? viewCardEntry()
    : tab==="set" ? viewSettings() : viewFleet());
}
function go(k){ tab=k; openRec=null; lightbox=null; editV=null; hdrMenu=false; addOpen=false;
  tVeh=null; svVeh=null; openSvc=null;
  window.scrollTo(0,0); render(); }
boot();
</script>
