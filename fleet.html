<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#15181C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鉅誠車輛">
<title>鉅誠驗屋 · 車輛管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15181C; --paper:#E9EBEE; --card:#FFF; --line:#D3D7DC; --line2:#E6E9ED;
  --amber:#FFB020; --amber-d:#8A5A00; --ok:#2C7A5C; --ok-bg:#E8F3EE;
  --alert:#CE3524; --alert-bg:#FBEAE7; --warn-bg:#FFF4E0; --muted:#6C737D;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--tc);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;padding-bottom:78px}
body.norole{padding-bottom:0}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:11px 14px 9px;
  border-bottom:3px solid var(--amber);display:flex;align-items:center;gap:10px}
header.top h1{margin:0;font-size:14.5px;font-weight:900;letter-spacing:.05em}
header.top .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#98A0AA;margin-top:2px}
header.top .sw{margin-left:auto;background:none;border:1px solid #4A525C;color:#C7CCD2;border-radius:3px;
  padding:6px 9px;font-family:var(--tc);font-size:11.5px;cursor:pointer;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 26px}
.wide{max-width:860px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);display:grid;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;color:#8E96A0;padding:10px 2px 11px;font-family:var(--tc);
  font-size:11px;font-weight:700;cursor:pointer;border-top:3px solid transparent}
nav.tabs button .ic{display:block;font-size:15px;margin-bottom:1px}
nav.tabs button[aria-selected="true"]{color:#fff;border-top-color:var(--amber)}

.card{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:12px}
.card .hd{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card .hd h2{margin:0;font-size:14px;font-weight:900;letter-spacing:.04em}
.card .bd{padding:14px}
.foot{padding:11px 14px;border-top:1px solid var(--line2);background:#FBFCFD}
.note{background:#FFF7E6;border:1px solid #F0D9A0;border-radius:3px;padding:10px 12px;font-size:12.5px;color:#6B5417;margin-bottom:12px}
.err{color:var(--alert);font-size:12.5px;font-weight:700;margin-top:7px}

label.f{display:block;margin-bottom:13px}
label.f .lbl{display:block;margin-bottom:6px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;font-family:var(--tc);
  font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:17px;font-weight:600;min-width:52px;height:48px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer;color:var(--ink);padding:0 10px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--tc);font-weight:700;
  font-size:15px;padding:13px 18px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241A00}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.tiny{padding:5px 9px;font-size:11.5px;font-weight:500}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.block{display:flex;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.gate{max-width:420px;margin:0 auto;padding:34px 18px}
.gate h2{font-size:19px;font-weight:900;margin:0 0 4px}
.gate p{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.role{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);
  border-radius:3px;padding:16px;margin-bottom:11px;cursor:pointer;font-family:var(--tc);color:var(--ink)}
.role.amber{border-left-color:var(--amber)}
.role b{display:block;font-size:16.5px;font-weight:900;margin-bottom:3px}
.role span{font-size:13px;color:var(--muted)}

/* 車輛卡 */
.plate-cell{font-family:var(--mono);font-size:14px;letter-spacing:.5px;white-space:nowrap;color:var(--ink)}
.plate-cell.empty{color:var(--muted)}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:3px;background:#fff;padding:12px;border-left:4px solid var(--ok)}
.vcard.warn{border-left-color:var(--amber);background:var(--warn-bg)}
.vcard.bad{border-left-color:var(--alert);background:var(--alert-bg)}
.vcard .id{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.vcard .odo{font-family:var(--mono);font-size:13px;margin-top:6px}
.vcard .st{font-size:12.5px;font-weight:700;margin-top:5px}
.vcard .bar{height:6px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:7px}
.vcard .bar i{display:block;height:100%;background:var(--ok)}
.vcard.warn .bar i{background:var(--amber)}
.vcard.bad .bar i{background:var(--alert)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tw{overflow-x:auto}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#F7F8FA;white-space:nowrap}
th.n{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-size:14px}
tr:nth-of-type(even) td{background:#FBFCFD}
tr.warn td,tr.warn:nth-of-type(even) td{background:var(--warn-bg)}
tr.bad td,tr.bad:nth-of-type(even) td{background:var(--alert-bg)}
tr.edit td{background:#FFFBF0!important;padding:16px 12px}
.c-act{text-align:right;white-space:nowrap}
.c-act .btn{margin-left:4px}

.stats{display:flex;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line2);padding:18px 16px 20px}
.stats>div{flex:1 1 132px;padding:16px;border:1px solid var(--line2);border-radius:3px;background:#FBFCFD}
.stats .fig{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.1;margin-top:10px}

/* 拍照 */
.shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;padding:12px}
.shotbox{border:1px dashed var(--line);border-radius:3px;background:#F7F8FA;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;position:relative}
.shotbox.has{border-style:solid;border-color:var(--ok)}
.shotbox img{width:100%;height:100%;object-fit:cover}
.shotbox .cam{font-size:24px;color:var(--muted);line-height:1}
.shotbox .ct{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;text-align:center;padding:0 6px}
.shotbox .redo{position:absolute;right:0;bottom:0;background:rgba(21,24,28,.82);color:#fff;
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 5px}
.thumbs{display:flex;gap:5px;flex-wrap:wrap;padding:10px 14px}
.thumbs figure{margin:0;width:78px}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:2px;border:1px solid var(--line);display:block;cursor:pointer}
.thumbs figcaption{font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px;line-height:1.2}

.odoin{display:flex;align-items:center;gap:8px}
.odoin input{font-family:var(--mono);font-size:32px;font-weight:600;text-align:center;height:62px;
  border-width:2px;border-color:var(--ink)}
.odoin .unit{font-family:var(--mono);font-size:15px;color:var(--muted)}

.rechd{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;
  border-bottom:1px solid var(--line2);padding:12px 14px;cursor:pointer;font-family:var(--tc);color:var(--ink)}
.rechd .caret{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,12,15,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.lbbox{background:#fff;border-radius:3px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.lbbox img{width:100%;display:block;background:#000}
.lbinfo{padding:12px 14px}
.lbbar{display:flex;gap:8px;padding:0 14px 14px;justify-content:space-between}

.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:99;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:3px;font-size:14px;font-weight:700;border-left:4px solid var(--amber);max-width:88%}
.hide{display:none!important}
.big-alert{background:var(--alert-bg);border:1px solid var(--alert);border-left-width:4px;border-radius:3px;
  padding:14px;margin-bottom:12px}
.big-alert b{font-size:15px}

/* 保養明細 */
.ihd,.iline{display:grid;grid-template-columns:1fr 62px 78px 82px 44px;gap:8px;align-items:center}
.ihd{padding:7px 0;border-bottom:1px solid var(--line2)}
.ihd span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ihd span:nth-child(2),.ihd span:nth-child(3),.ihd span:nth-child(4){text-align:right}
.iline{padding:8px 0;border-bottom:1px solid var(--line2)}
.iline input{width:100%;border:1px solid var(--line);border-radius:3px;padding:7px 8px;
  font-family:var(--tc);font-size:14px}
.iline input.num{font-family:var(--mono);text-align:right}
.iline.ro>div:nth-child(2),.iline.ro>div:nth-child(3){text-align:right;font-size:14px}
.iline .sub3{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;
  font-weight:600;text-align:right}
.itot{display:flex;align-items:center;gap:10px;padding:11px 0 0;border-top:1px solid var(--line)}
.itot b{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:700}
.shootbox{display:block;border:1px dashed var(--line);border-radius:4px;padding:20px 14px;
  text-align:center;cursor:pointer;background:#FBFCFD}
.shootbox:hover{background:#F5F7F9}
.shootbox .h2b{font-size:15.5px;font-weight:600}
.rcpt img{width:100%;max-height:230px;object-fit:contain;border:1px solid var(--line);
  border-radius:4px;background:#F7F8FA}
.rcpt .ract{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sline{display:flex;align-items:center;gap:8px;cursor:pointer}
.sline span:first-child{flex:1;min-width:0;line-height:1.5}
.caret2{font-size:11px;color:var(--muted);flex:none}
.openrow td{background:#FAFBFC}
td.sdet{background:#FBFCFD;padding:12px 14px}
.rcptimg{max-width:100%;max-height:260px;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
@media (max-width:560px){
  .ihd,.iline{grid-template-columns:1fr 50px 66px 70px 38px;gap:6px}
  .iline input{padding:6px;font-size:13px}
}

/* 區域切換 */
.regsw{display:flex;gap:6px;margin-left:auto;margin-right:9px}
.regsw button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  border-radius:999px;padding:0 13px;min-height:36px;font-family:var(--tc);font-size:13px;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center}
.regsw button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.regsw button[disabled]{opacity:.3;cursor:not-allowed}
.swshort{display:none}
@media (max-width:560px){ .regsw{gap:5px;margin-right:7px} .regsw button{padding:0 10px;font-size:12px} }
@media (max-width:380px){
  header.top{padding-left:10px;padding-right:10px}
  header.top .sw{padding:6px 8px}
  .swlong{display:none} .swshort{display:inline}
  .regsw{margin-right:5px;gap:4px}
  .regsw button{padding:0 7px;font-size:11.5px}
}
/* 設定頁：每位管理者的可管區域 */
.rgrant{display:flex;gap:4px;flex-wrap:wrap}
.rgrant button{border:1px solid var(--line2);background:#fff;color:var(--muted);
  border-radius:999px;padding:3px 9px;font-family:var(--tc);font-size:11.5px;cursor:pointer;white-space:nowrap}
.rgrant button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.rgrant button[disabled]{opacity:.35;cursor:not-allowed}

/* 用現代模式渲染，但版面緊密度維持跟原本一樣 */
table{line-height:normal}
.foot{line-height:1}
label.f>.lbl{display:block;line-height:1.5}

/* 出車登記：把「組別」跟「車別」分清楚 */
.pick{margin:14px 0 4px}
.pickT{font-family:var(--tc);font-size:13.5px;color:var(--muted);margin-bottom:7px}
.pickT b{color:var(--ink);font-size:15px;font-weight:800}
.chips.crewchips .chip.crew{min-width:auto;padding:0 16px;height:46px;border-radius:999px;
  font-family:var(--tc);font-size:15px;font-weight:700}
.chips.crewchips .chip.crew[aria-pressed="true"]{background:var(--amber,#F5A623);
  border-color:var(--amber,#F5A623);color:#1a1a1a}
.chips.vehchips .chip.veh{min-width:auto;padding:0 14px;height:46px;border-radius:8px;
  display:inline-flex;align-items:baseline;gap:3px;font-family:var(--mono);font-size:19px;font-weight:800}
.chips.vehchips .chip.veh i{font-style:normal;font-family:var(--tc);font-size:11.5px;font-weight:400;opacity:.65}
.confirm{margin-top:14px;padding:11px 13px;border:1px dashed var(--line);border-radius:6px;
  background:var(--bg2);font-family:var(--tc);font-size:15px;text-align:center}
.confirm b{font-family:var(--mono);font-size:18px}
.confirm .ar{color:var(--muted);margin:0 10px;font-size:13px}
.confirm .miss{color:var(--muted);font-size:13.5px}
.crewtag{display:inline-block;background:var(--ink);color:#fff;border-radius:4px;
  padding:1px 7px;font-family:var(--tc);font-size:11.5px;font-weight:700;margin-right:6px;vertical-align:1px}

/* ---- 出車紀錄：一行三欄 ---- */
.r3{display:grid;grid-template-columns:64px 1fr auto 12px;align-items:center;gap:10px}
.veh{font-size:13px;font-weight:700;color:#3C434C;white-space:nowrap}
.veh b{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);margin-right:2px}
.per{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crewc{font-size:12.5px;color:#3C434C;white-space:nowrap}
.crewc b{font-size:14.5px;font-weight:700;color:var(--ink)}
.crewc.none{color:var(--amber-d);background:var(--warn-bg);border:1px solid #F0D9A0;
  border-radius:3px;padding:2px 7px;font-weight:700}
.sl{font-size:13.5px;line-height:1.9;display:flex;gap:10px}
.sl-k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  white-space:nowrap;padding-top:4px;flex:none;width:64px}
.sl.miss{color:var(--amber-d);font-weight:700}
.sl.miss .sl-k{color:var(--amber-d)}
.facts{display:flex;flex-wrap:wrap;border-top:1px solid var(--line2);background:#FBFCFD}
.facts>span{flex:1;min-width:92px;padding:9px 12px;font-family:var(--mono);font-size:13px;
  border-right:1px solid var(--line2)}
.facts>span:last-child{border-right:0}
.facts i{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--muted);
  font-style:normal;margin-bottom:2px}
.recfoot{padding:10px 14px;border-top:1px solid var(--line2);display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;justify-content:space-between}
.stamp{font-family:var(--mono);font-size:13px}
.stamp i{font-style:normal;font-size:9.5px;letter-spacing:.1em;color:var(--muted);
  display:block;margin-bottom:1px}
.sortbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 11px;padding:0 2px}
.sb-k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#4A515A;margin-right:2px}

/* ---- 篩選列（出車日期、悠遊卡紀錄共用）---- */
.mvf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;
  border-bottom:1px solid var(--line2);background:#FBFCFD}
.mvchip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 13px;font-family:var(--tc);font-size:13.5px;cursor:pointer;color:var(--ink);line-height:1}
.mvchip.sm{padding:6px 12px;font-size:13px}
.mvchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mvchip .c{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.mvchip[aria-pressed="true"] .c{color:#C7CCD2}
.mvchip.warnc{border-color:var(--amber);color:var(--amber-d);font-weight:700}
.mvchip.warnc[aria-pressed="true"]{background:var(--amber-d);color:#fff;border-color:var(--amber-d)}
.mvdate{border:1px solid var(--line);border-radius:3px;padding:7px 9px;
  font-family:var(--mono);font-size:13px;width:auto}
.mvsearch{flex:1;min-width:140px;border:1px solid var(--line);border-radius:3px;padding:8px 11px;
  font-family:var(--tc);font-size:14px}
.mvsum{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:11px 14px;
  border-bottom:1px solid var(--line2)}
.mvsum div{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.mvsum b{font-size:16px;color:var(--ink);font-weight:700;margin-right:2px}

/* ---- 車號＋車牌 ---- */
.bcell{white-space:nowrap}
.bc{font-family:var(--mono);font-size:16px;font-weight:700;margin-right:7px}
.bc2{font-family:var(--mono);font-size:14.5px;font-weight:700;margin-right:6px}
.bp{font-family:var(--mono);font-size:12px;color:var(--muted)}
.badtag{background:var(--warn-bg);color:var(--amber-d);border-radius:2px;padding:0 5px;font-weight:700}
.dcell{white-space:nowrap}
@media(max-width:420px){ .tw td,.tw th{padding-left:8px;padding-right:8px} }

/* 悠遊卡 */
.calcbox{margin:2px 0 14px;padding:11px 13px;border:1px solid var(--line2);border-radius:6px;
  background:var(--bg2);font-family:var(--mono);font-size:14px;line-height:1.6}
.calcbox.bad{border-color:var(--alert);background:#fff7f6}
.calcbox b{font-size:16px}
.warnbox{border-color:var(--alert);border-width:2px}
.lowlist{display:flex;flex-wrap:wrap;gap:8px}
.lowlist div{display:flex;align-items:baseline;gap:7px;border:1px solid var(--alert);border-radius:6px;
  padding:7px 11px;font-family:var(--mono)}
.lowlist span{color:var(--alert);font-weight:800}

/* 設定頁：可收合區塊 */
.card.sect{overflow:hidden}
.secHd{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
  padding:15px 16px;cursor:pointer;text-align:left;font-family:inherit}
.card.sect.open .secHd{border-bottom:1px solid var(--line2)}

const intervalOf=v=>v.interval||S.settings.interval;
function statusOf(v){
  const remain=(v.next||0)-(v.odo||0);
  let level="ok", text=`距離保養還有 ${km(remain)} 公里`;
  if(remain<=0){ level="bad"; text=`已超過保養里程 ${km(-remain)} 公里`; }
  else if(remain<=S.settings.urgentKm){ level="bad"; text=`剩 ${km(remain)} 公里，請盡快安排保養`; }
  else if(remain<=S.settings.warnKm){ level="warn"; text=`剩 ${km(remain)} 公里，該安排保養了`; }
  const span=intervalOf(v);
  const pct=Math.max(0,Math.min(100,Math.round(((span-remain)/span)*100)));
  return {remain,level,text,pct};
}
const alerts=()=>VEH().filter(v=>statusOf(v).level!=="ok").slice().sort(byCode);

const byCode=(a,b)=>{
  const A=String(a.code), B=String(b.code);
  const ascii=t=>/^[0-9A-Za-z]/.test(t)?0:1;
  return (ascii(A)-ascii(B)) || A.localeCompare(B,"zh-Hant",{numeric:true});
};

    else { await rpc("op_bootstrap",{p_name:n,p_pin:setup.pin,p_region:REG});

const cardOf=c=>{const v=VEH().find(x=>x.code===c);return v?v.card:null;};
function cardCalc(){
  const prev=cardOf(card.vehicle);
  const amt=parseInt(card.amount,10);
  if(prev==null||!amt||amt<=0) return null;
  const exp=card.kind==="topup"?prev+amt:prev-amt;
  const bal=card.balance===""?null:parseInt(card.balance,10);
  return {prev,exp,bal,diff:(bal==null||isNaN(bal))?null:bal-exp};
}

function cardCalcBox(){

  const bad=c.diff!=null&&c.diff!==0;
  return `<div class="calcbox ${bad?"bad":""}">
    <div>$${cash(c.prev)} ${card.kind==="topup"?"＋":"−"} $${cash(Math.abs(parseInt(card.amount,10)||0))}
      ＝ <b>$${cash(c.exp)}</b><span class="lbl">　試算</span></div>
    ${c.bal!=null&&!isNaN(c.bal)?`<div style="margin-top:5px">發票上是 <b>$${cash(c.bal)}</b>　${
      bad?`<span style="color:var(--alert);font-weight:700">差 ${c.diff>0?"+":""}${c.diff} 元</span>`

}
function calcOnly(){ const el=document.getElementById("calcbox"); if(el) el.innerHTML=cardCalcBox(); }

async function submitCard(){
  if(busy)return;
  if(!card.vehicle)return toast("請選擇哪一台車");
  const amt=parseInt(card.amount,10);
  if(!amt||amt<=0)return toast("請填金額");
  if(!card.person.trim())return toast("請填登錄人姓名");
  if(cardOf(card.vehicle)==null&&card.balance==="")
    return toast("這台車還沒有餘額基準，第一次請把發票上的餘額填進去");
  busy=true; setProgress("上傳中…"); render();
  try{
    let path=null;
    if(card.photo){
      path=`${slugOf(REG)}/card/${pathSafe(card.vehicle)}/${Date.now()}.jpg`;
      await uploadPhoto(path,card.photo);
    }
    setProgress("寫入紀錄…");
    const r=await rpc("fleet_card_submit",{p:{region:REG,code:card.vehicle,kind:card.kind,
      amount:amt,balance:card.balance===""?null:String(parseInt(card.balance,10)),
      person:card.person.trim(),photo:path,time:nowHM()}});
    cardResult={code:card.vehicle,kind:card.kind,amount:amt,
      balance:r.balance,diff:r.diff,low:r.low,low_at:r.low_at};
    const keep=card.person;
    card=newCard(); card.person=keep;
    if(role==="card"){ applyConfig(await rpc("fleet_config",{p_region:REG})); }
    else { await reload(); }
    setProgress(null); busy=false; window.scrollTo(0,0); render();
    toast("已登記");
  }catch(e){
    setProgress(null); busy=false; render();
    toast("送出失敗："+(e.message||""));
  }
}

function shrink(f,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();
  img.onload=()=>{const m=640,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.6));};
  img.src=fr.result;};fr.readAsDataURL(f);}
function shoot(t,inp){ if(!inp.files[0])return; shrink(inp.files[0],d=>{draft.photos[t]=d;render();}); }
function resetDraft(){ if(confirm("清空目前的登記？")){draft=newDraft();render();} }
async function submitTrip(){
  if(busy)return;
  const v=vehOf(draft.vehicle); if(!v)return;
  const odo=parseInt(String(draft.odo).replace(/\D/g,""))||0;
  if(odo<=0)return toast("請輸入里程");
  if(odo<(v.odo||0))return toast("里程不能小於上次登記");
  for(const t of S.settings.photoItems){ if(!draft.photos[t])return toast(`「${t}」還沒拍`); }

  busy=true; render();
  try{
    const slot=await rpc("fleet_next_slot",{p_region:REG,p_code:v.code});
    const base=`${slugOf(REG)}/${pathSafe(v.code)}/${slot}`;   // 三個區都有 A 車，路徑要分開
    const photos=[]; let n=0;
    for(const t of S.settings.photoItems){
      const path=`${base}/${pathSafe(t)}.jpg`;
      setProgress(`上傳照片 ${++n}/${S.settings.photoItems.length}`);
      await uploadPhoto(path,draft.photos[t]);
      photos.push({label:t,path});
    }
    setProgress("寫入登記…");
    const r=await rpc("fleet_submit",{p:{region:REG,code:v.code,person:draft.person,crew:draft.crew||"",odo,
      time:nowHM(),slot,photos}});
    v.odo=odo;
    draft=null; setProgress(null); busy=false; render();
    if(r&&r.level!=="ok"){
      toast(r.remain<=0?`已登記。${v.code} 車已超過保養里程 ${km(-r.remain)} 公里`
                       :`已登記。${v.code} 車距離保養剩 ${km(r.remain)} 公里`);
    } else toast(`${v.code} 車已登記 ${km(odo)} 公里`);
  }catch(e){
    setProgress(null); busy=false; render();
    toast("送出失敗："+(e.message||""));
  }
}
function setProgress(m){ progressMsg=m;
  const el=document.getElementById("prog"); if(el) el.textContent=m||"";
  if(!el) render(); }

async function saveVeh(code){

  await guard(async()=>{
    await rpc("fleet_vehicle_update",{p_token:token,p_id:v.id,
      p_plate:(g("e_plate").value||"").trim(),
      p_odo:Math.max(0,parseInt(g("e_odo").value)||0),
      p_next:Math.max(0,parseInt(g("e_next").value)||0),
      p_interval:parseInt(g("e_int").value)||0});

async function addVeh(){
  const c=(nVeh.code||"").trim().toUpperCase();

      p_plate:(nVeh.plate||"").trim(),
      p_odo:Math.max(0,parseInt(nVeh.odo)||0),
      p_next:Math.max(0,parseInt(nVeh.next)||0)});

const money=n=>"$"+(Number(n)||0).toLocaleString("en-US");
const lineSub=i=>Math.round((Number(i.qty)||0)*(Number(i.price)||0));
const sumItems=a=>(a||[]).reduce((t,i)=>t+lineSub(i),0);
const cleanItems=a=>(a||[]).filter(i=>String(i.name||"").trim())

function shrinkFile(f,cb){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const m=1400, sc=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=img.width*sc; c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.75)); };
    img.src=fr.result; };
  fr.readAsDataURL(f);
}
async function readReceipt(){
  if(!svc.receipt) return toast("請先拍保養單或選照片");
  if(svc.reading) return;
  svc.reading=true; render();
  try{
    const res=await fetch(`${SB_URL}/functions/v1/read-receipt`,{
      method:"POST",
      headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({token,image:svc.receipt})});
    const txt=await res.text();
    let j={}; try{ j=JSON.parse(txt); }catch(e){}
    if(!res.ok){
      if(res.status===404) throw new Error("還沒有安裝辨識功能，可以先手動填明細");
      throw new Error((j.error||txt.slice(0,120)||`辨識失敗（${res.status}）`)
        +(j.detail?`\n${String(j.detail).slice(0,120)}`:""));
    }
    const items=(j.items||[]).map(i=>({name:i.name||"",qty:Number(i.qty)||0,price:Number(i.price)||0}));
    if(!items.length){ toast("這張單沒讀到明細，請手動填"); }
    else{
      svc.items=items;
      if(j.note&&!String(svc.note||"").trim()) svc.note=j.note;
      toast(`辨識到 ${items.length} 項，合計 ${money(sumItems(items))}，請核對後再送出`);
    }
  }catch(e){ toast("辨識失敗："+(e.message||"")); }
  svc.reading=false; render();
}
function pickReceipt(inp){
  if(!inp.files||!inp.files[0])return;
  shrinkFile(inp.files[0],d=>{ svc.receipt=d; render(); });
}
function dropReceipt(){ svc.receipt=null; render(); }

async function addSvc(){
  const v=vehOf(svc.vehicle); if(!v)return toast("請選擇車輛");
  const odo=parseInt(svc.odo)||0;
  if(odo<=0)return toast("請填本次保養里程");
  const next=parseInt(svc.next)||0;
  await guard(async()=>{
    let path=null;
    if(svc.receipt){
      path=`${slugOf(REG)}/svc/${pathSafe(v.code)}/${Date.now()}.jpg`;
      await uploadPhoto(path,svc.receipt);
    }
    const items=cleanItems(svc.items);
    await rpc("fleet_service_add",{p_token:token,p_region:REG,p_code:v.code,p_odo:odo,
      p_next:next,p_note:svc.note.trim(),p_items:items,p_receipt:path});
    const code=v.code;
    svc=blankSvc(code);
    await reload(); render();
    const nv=vehOf(code);
    toast(`${code} 車已登記保養，下次 ${km(nv?nv.next:next)} 公里`);
  });
}
async function delSvc(id){
  if(!confirm("刪除這筆保養紀錄？車輛的下次保養里程不會自動還原。"))return;
  await guard(async()=>{ await rpc("fleet_service_delete",{p_token:token,p_id:id});
    await reload(); render(); },"已刪除");
}

/* ===================== 管理端：出車紀錄 ===================== */
function viewTrips(){
  const D   = tDate || today();
  const isT = D === today();
  const yest= dayBefore(D);
  const day = S.trips.filter(t=>t.date===D);

  // 排序：依車號（預設）／依時間／依組別
  const sorted = day.slice();
  if(tSort==="code")      sorted.sort((a,b)=>String(a.vehicle).localeCompare(String(b.vehicle),"en"));
  else if(tSort==="crew") sorted.sort((a,b)=>{
        const A=a.crew||"￿", B=b.crew||"￿";       // 未填組別排最後
        return A===B ? String(a.vehicle).localeCompare(String(b.vehicle),"en")
                     : A.localeCompare(B,"zh-Hant"); });
  else                    sorted.sort((a,b)=>(b.ts||0)-(a.ts||0));   // 依時間，新的在上

  const recs = sorted.map(t=>{
    const open = openRec===t.id;
    const pics = Object.keys(t.photos||{});
    const crew = t.crew
      ? `<span class="crewc"><b>${esc(t.crew)}</b> 組</span>`
      : `<span class="crewc none">未填組別</span>`;
    const head = `<button class="rechd r3" onclick="openRec=openRec==='${t.id}'?null:'${t.id}';render()">
      <span class="veh"><b>${esc(t.vehicle)}</b> 車</span>
      <span class="per">${esc(t.person)}</span>
      ${crew}
      <span class="caret">${open?"▲":"▼"}</span></button>`;
    if(!open) return `<div class="card">${head}</div>`;
    return `<div class="card">${head}
      <div class="facts">
        <span><i>里程</i>${km(t.odo)} km</span>
        ${t.prev?`<span><i>今天增加</i>+${km(t.odo-t.prev)} km</span>`:""}
        <span><i>照片</i>${pics.length?pics.length+" 張":"已清除"}</span></div>
      ${pics.length?`<div class="thumbs">${pics.map((k,i)=>`<figure>
        <img src="${t.photos[k]}" onclick="lightbox={id:'${t.id}',i:${i}};render()">
        <figcaption>${k}</figcaption></figure>`).join("")}</div>`
        :`<div class="lbl" style="padding:10px 14px">超過 ${keepDays} 天的照片已自動清除</div>`}
      <div class="recfoot">
        <span class="stamp"><i>紀錄時間</i>${t.date} ${t.time}</span>
        <button class="btn ghost tiny" onclick="delTrip('${t.id}')">刪除這筆登記</button>
      </div></div>`;
  }).join("");

  // 車輛：這一天誰登記了、誰沒有
  const vIn  = [...new Set(day.map(t=>t.vehicle))].sort((a,b)=>String(a).localeCompare(String(b),"en"));
  const vOut = VEH().filter(v=>!vIn.includes(v.code)).slice().sort(byCode).map(v=>v.code);
  // 組別：同上
  const cAll = CREWS();
  const cIn  = cAll.filter(c=>day.some(t=>t.crew===c));
  const cOut = cAll.filter(c=>!cIn.includes(c));

  const line=(k,n,arr,miss)=>`<div class="sl${miss?" miss":""}">
    <span class="sl-k">${k} ${n}</span><span>${arr.length?arr.join("、"):"—"}</span></div>`;

  return `<div class="wrap wide">
    <div class="card"><div class="hd"><h2>${isT?"今日出車":"當日出車"}</h2>
      <span class="lbl" style="margin-left:auto">${D}</span></div>
      <div class="mvf">
        <button class="mvchip sm" aria-pressed="${isT}" onclick="setTDate('${today()}')">今天</button>
        <button class="mvchip sm" aria-pressed="${D===yest}" onclick="setTDate('${yest}')">前一天</button>
        <input type="date" class="mvdate" value="${D}" onchange="setTDate(this.value)">
      </div>
      <div class="bd">
        ${line("已登記", vIn.length, vIn, false)}
        ${line("未登記", vOut.length, vOut, vOut.length>0)}
      </div></div>

    <div class="sortbar"><span class="sb-k">排序</span>
      ${SORTS.map(([k,t])=>`<button class="mvchip sm" aria-pressed="${tSort===k}"
        onclick="setTSort('${k}')">${t}</button>`).join("")}</div>

    ${day.length?recs:`<div class="card"><div class="empty">${
      isT?"今天還沒有人登記出車。":D+" 沒有出車紀錄。"}</div></div>`}

    ${cAll.length?`<div class="card"><div class="hd"><h2>${isT?"今日組別":"當日組別"}</h2>
      <span class="lbl" style="margin-left:auto">${D}</span></div>
      <div class="bd">
        ${line("已登記", cIn.length, cIn, false)}
        ${line("未登記", cOut.length, cOut, cOut.length>0)}
      </div></div>`:""}

    ${lightbox?lbHTML():""}
  </div>`;
}

async function delTrip(id){
  if(!confirm("刪除這筆出車登記？若刪的是最新一筆，車輛里程會回到前一筆。"))return;
  await guard(async()=>{ await rpc("fleet_trip_delete",{p_token:token,p_id:id});
    openRec=null; await reload(); render(); },"已刪除");
}
function lbHTML(){
  const t=S.trips.find(x=>x.id===lightbox.id); if(!t)return "";
  const keys=Object.keys(t.photos||{}); const k=keys[lightbox.i]; if(!k)return "";
  return `<div class="lb" onclick="lightbox=null;render()">
    <div class="lbbox" onclick="event.stopPropagation()">
      <img src="${t.photos[k]}">
      <div class="lbinfo"><div style="font-weight:900;font-size:15px">${k}</div>
        <div class="lbl" style="margin-top:3px">${t.vehicle} 車 · ${t.date} ${t.time} · ${t.person} · ${km(t.odo)} km</div></div>
      <div class="lbbar">
        <button class="btn ghost sm" onclick="lbStep(-1)">← 上一張</button>
        <button class="btn ghost sm" onclick="lightbox=null;render()">關閉</button>
        <button class="btn ghost sm" onclick="lbStep(1)">下一張 →</button></div>
    </div></div>`;
}
function lbStep(d){
  const t=S.trips.find(x=>x.id===lightbox.id); if(!t)return;
  const n=Object.keys(t.photos||{}).length; if(!n)return;
  lightbox.i=(lightbox.i+d+n)%n; render();
}

async function saveSettings(o){
  await guard(async()=>{
    await rpc("fleet_settings_update",{p_token:token,p_region:REG,
      p_interval:o.interval!==undefined?Math.max(1000,parseInt(o.interval)||10000):null,
      p_warn:o.warn!==undefined?Math.max(0,parseInt(o.warn)||0):null,
      p_urgent:o.urgent!==undefined?Math.max(0,parseInt(o.urgent)||0):null,
      p_items:o.items||null});
    await reload(); render();
  });
}
async function addItem(){
  const t=(nItem||"").trim();
  if(!t)return toast("請填項目名稱");
  if(S.settings.photoItems.includes(t))return toast("已經有這個項目了");
  const items=S.settings.photoItems.concat([t]);
  nItem=""; await saveSettings({items}); toast(`已新增：${t}`);
}
async function delItem(i){
  if(S.settings.photoItems.length<=1)return toast("至少要保留一個拍照項目");
  const t=S.settings.photoItems[i];
  if(!confirm(`刪除拍照項目「${t}」？`))return;
  const items=S.settings.photoItems.filter((_,k)=>k!==i);
  await saveSettings({items});
}
async function moveItem(i,d){
  const a=S.settings.photoItems.slice(), j=i+d;
  if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  await saveSettings({items:a});
}

/* ===================== 導覽 ===================== */
const TABS={driver:[["trip","▣","出車登記"]], card:[["card","◎","悠遊卡"]],
  admin:[["fleet","▤","車輛"],["service","⚑","保養"],["trips","▦","出車紀錄"],
         ["card","◎","悠遊卡"],["set","⚙","設定"]]};
function render(){
  if(UPGRADING) return;
  const app=document.getElementById("app"), hdr=document.getElementById("hdr"), nv=document.getElementById("nav");
  document.body.classList.toggle("norole",!role);
  if(!role){ hdr.innerHTML=`<div><h1>鉅誠驗屋 · 車輛管理</h1><div class="sub">${REG?regName(REG):"請先選擇區域"}</div></div>`;
    nv.className="tabs hide"; app.innerHTML=viewGate(); return; }
  const al=alerts().length;
  hdr.innerHTML=`<div><h1>${role==="driver"?"出車登記":`車輛管理${me?" · "+me.name:""}`}</h1>
    <div class="sub">${VEH().length} 台車${al?` / ${al} 台待保養`:""}</div></div>
    <div class="regsw">${REGIONS.map(r=>{
      const can=(role==="driver"||role==="card")?true:(myRegions.length?myRegions.includes(r.code):r.code===REG);
      return `<button aria-pressed="${REG===r.code}" ${can?"":"disabled"}
        title="${can?"":"你沒有這一區的權限"}" onclick="hdrRegion('${r.code}')">${esc(r.name||r.code)}</button>`;}).join("")}</div>
    <button class="sw" onclick="switchRole()"><span class="swlong">切換身分</span><span class="swshort">切換</span></button>`;
  const t=TABS[role];
  if(t.length>1){ nv.className="tabs"; nv.style.gridTemplateColumns=`repeat(${t.length},1fr)`;
    nv.innerHTML=t.map(([k,i,l])=>`<button aria-selected="${tab===k}" onclick="go('${k}')"><span class="ic">${i}</span>${l}</button>`).join("");
    document.body.classList.remove("norole");
  } else { nv.className="tabs hide"; document.body.classList.add("norole"); }
  app.innerHTML = role==="driver" ? viewTrip()
    : role==="card" ? viewCardEntry()
    : tab==="service" ? viewService() : tab==="trips" ? viewTrips()
    : tab==="card" ? viewCardAdmin()
    : tab==="cardnew" ? viewCardEntry()
    : tab==="set" ? viewSettings() : viewFleet();
}
function go(k){ tab=k; openRec=null; lightbox=null; editV=null; window.scrollTo(0,0); render(); }
boot();
</script>
