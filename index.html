<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#15181C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鉅誠盤點">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href='data:application/manifest+json,{"name":"鉅誠驗屋 設備盤點","short_name":"鉅誠盤點","display":"standalone","background_color":"%23E9EBEE","theme_color":"%2315181C","start_url":"."}'>
<title>鉅誠驗屋 · 設備盤點系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   設計系統 v2
   白卡片 ＋ 大圓角 ＋ 柔和底色，不用框線分隔，改用留白與層次
   深靛藍為主色，狀態色（綠／琥珀／紅）各自分明
   =================================================================== */
:root{
  /* 中性 */
  --ink:#1A1F2B;          /* 主要文字 */
  --ink2:#454D5E;         /* 次要文字 */
  --muted:#5E6676;        /* 說明文字：白底上對比 5.9:1，戶外也看得清楚 */
  --faint:#8A92A2;        /* placeholder、次要圖示 */
  --paper:#D5DCE8;        /* 頁面底色：要明顯比卡片暗，邊界才看得出來 */
  --card:#FFFFFF;
  --sunk:#EDF0F6;         /* 卡片裡再凹一層 */
  --line:#B9C3D6;         /* 卡片與按鈕的邊框，要看得見 */
  --line2:#DCE2EC;        /* 卡片內部的分隔線 */

  /* 主色 */
  --brand:#1E2B4D;        /* 深靛藍：標題列、主要按鈕 */
  --brand2:#33477A;
  --brandsoft:#DEE6F7;
  --brandline:#9FB1D8;
  --link:#1B4FC4;         /* 可點的東西 */

  /* 狀態：顏色要認得出來，不要都糊成一片 */
  --ok:#0A7A52;    --ok-bg:#D6F0E4;   --ok-line:#86CBAE;
  --warn:#9E5A00;  --warn-bg:#FDEBCB; --warn-line:#E8B765;
  --bad:#C22D20;   --bad-bg:#FBDDD8;  --bad-line:#EC9A8F;
  --blue:#1B4FC4;  --blue-bg:#DBE5FB; --blue-line:#9FB7EE;
  --purple:#6B3FA0;--purple-bg:#EBE0F7;--purple-line:#BFA3E0;
  --amber:#E89510; --amber-d:#9E5A00; --amber-bg:#FDEBCB;
  --alert:#C22D20; --alert-bg:#FBDDD8;

  /* 形狀與陰影 */
  --r:14px; --r2:10px; --r3:7px;
  --sh:0 1px 2px rgba(20,30,56,.07), 0 3px 10px rgba(20,30,56,.07);
  --sh2:0 3px 8px rgba(20,30,56,.10), 0 14px 34px rgba(20,30,56,.14);

  --tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --mono:var(--tc);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
@supports (overflow:clip){ html,body{overflow-x:clip} }   /* clip 才不會讓「固定在上方」的列失效 */
html{-webkit-text-size-adjust:100%}
body{font-family:var(--tc);background:var(--paper);color:var(--ink);
  font-size:15.5px;line-height:1.6;padding-bottom:86px;
  -webkit-font-smoothing:antialiased}
body.norole{padding-bottom:0}
button,input,select,textarea{font-family:inherit}

/* 數字一律等寬，對帳才對得齊 */
.num,.fig,.n{font-variant-numeric:tabular-nums}

/* 小標籤：不再用大寫等寬，改成好讀的淡字 */
.lbl{font-size:12.5px;color:var(--muted);letter-spacing:0;text-transform:none;line-height:1.6}

/* ---------- 版面 ---------- */
.wrap{max-width:600px;margin:0 auto;padding:16px 15px 28px}
.wide{max-width:900px}

/* ---------- 標題列 ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:13px 15px;display:flex;align-items:center;gap:10px;border-bottom:0}
header.top h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.01em}
header.top .sub{font-size:12px;color:#A9B4CE;margin-top:1px;font-weight:400}
header.top .htitle{flex:1;min-width:0}
header.top h1,header.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regsel{flex:none;max-width:128px;background:rgba(255,255,255,.12);color:#fff;
  border:1px solid rgba(255,255,255,.22);border-radius:var(--r3);height:36px;
  padding:0 8px 0 11px;font-size:13.5px;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;padding-right:24px}
.regsel option{color:var(--ink);background:#fff}
.hmenu,.hback{flex:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:var(--r3);width:36px;height:36px;font-size:17px;line-height:1;cursor:pointer}
.hmenu:active,.hback:active{background:rgba(255,255,255,.2)}
.hmpanel{position:absolute;top:calc(100% + 6px);right:12px;z-index:60;background:#fff;
  border-radius:var(--r2);box-shadow:var(--sh2);min-width:184px;overflow:hidden;padding:5px}
.hmpanel button{display:block;width:100%;text-align:left;background:none;border:0;
  border-radius:var(--r3);padding:11px 13px;font-size:14.5px;color:var(--ink);cursor:pointer}
.hmpanel button:hover,.hmpanel button:active{background:var(--sunk)}

/* ---------- 底部頁籤 ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
  display:grid;border-top:1px solid var(--line2);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 16px rgba(26,31,43,.06)}
nav.tabs.hide{display:none}
nav.tabs button{border:0;background:none;padding:9px 2px 8px;cursor:pointer;
  font-size:10.5px;font-weight:600;color:var(--faint);line-height:1.3;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:18px;line-height:1;position:relative;display:inline-block}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
nav.tabs button[aria-selected="true"] .ic{transform:translateY(-1px)}
.nbadge{position:absolute;top:-5px;right:-10px;background:var(--bad);color:#fff;font-style:normal;
  font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;padding:0 4px;
  display:flex;align-items:center;justify-content:center;line-height:1}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:9px;padding:15px 16px 0}
.card>.hd h2{margin:0;font-size:16px;font-weight:700;letter-spacing:.01em}
.card>.bd{padding:15px 16px}
.card>.bd.nopad{padding:0}
.card>.hd+.bd{padding-top:12px}
.card .foot{padding:11px 16px;background:var(--sunk);font-size:12.5px;color:var(--muted)}

/* ---------- 按鈕 ---------- */
.btn{appearance:none;border:1.5px solid var(--brand);border-radius:var(--r2);
  background:var(--brand);color:#fff;
  font-size:15px;font-weight:600;padding:12px 17px;cursor:pointer;line-height:1.3;
  transition:transform .06s ease, filter .12s ease}
.btn:active{transform:scale(.985);filter:brightness(1.12)}
.btn:disabled{background:#AEB7C8;border-color:#AEB7C8;color:#fff;cursor:not-allowed;transform:none}
.btn.block{display:block;width:100%}
.btn.ghost{background:#fff;color:var(--brand);border-color:var(--line)}
.btn.ghost:active{background:var(--brandsoft)}
.btn.ghost:disabled{color:var(--faint);border-color:var(--line2);background:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber-d);color:#3A2600}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:10px 13px;font-size:14px;border-radius:var(--r3)}
.btn.tiny{padding:7px 11px;font-size:12.5px;border-radius:var(--r3);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- 輸入 ---------- */
.f{display:block;margin-bottom:14px}
.f>.lbl{display:block;margin-bottom:6px;font-size:13px;color:var(--ink2);font-weight:600}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{
  width:100%;border:1.5px solid var(--line);border-radius:var(--r2);background:#fff;
  padding:11px 13px;font-size:15.5px;color:var(--ink);outline:0;
  transition:border-color .12s, box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);
  box-shadow:0 0 0 3px rgba(51,71,122,.18)}
input::placeholder{color:var(--faint)}
input.num,input[type=number]{text-align:center;font-weight:700}
select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2379808F' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:32px}
label.ck{display:flex;align-items:center;gap:9px;font-size:14.5px;cursor:pointer;margin-bottom:12px}
label.ck input{width:19px;height:19px;flex:none;accent-color:var(--brand)}

/* ---------- 分段控制 ---------- */
.iseg,.seg{display:flex;gap:3px;background:var(--sunk);border:1.5px solid var(--line);
  border-radius:var(--r2);padding:3px}
.iseg button,.seg button{flex:1;border:0;background:none;border-radius:var(--r3);
  padding:10px 6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.iseg button[aria-pressed="true"],.seg button[aria-pressed="true"]{
  background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(26,31,43,.10)}

/* ---------- 標籤 / 狀態點 ---------- */
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;
  margin-left:6px;vertical-align:middle;border:0}
.tag.m{background:var(--brandsoft);color:var(--brand)}
.tag.i{background:#EFEBF8;color:#5B4B8A}
.tag.v{background:var(--amber-bg);color:var(--amber-d)}
.tag.c{background:#EEF0F5;color:var(--muted)}
.ipill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.ipill.ok{background:var(--ok-bg);color:var(--ok)}
.ipill.bad{background:var(--bad-bg);color:var(--bad)}
.ipill.warn{background:var(--warn-bg);color:var(--warn)}
.ipill.grey{background:#EEF0F5;color:var(--muted)}

/* ---------- 數字磚 ---------- */
.stats,.numrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:0}
.stats>div,.numrow>div{background:var(--sunk);border:0;border-radius:var(--r2);
  padding:13px 10px;text-align:center}
.stats .lbl,.numrow i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-bottom:4px}
.stats .fig,.numrow b{display:block;font-size:26px;font-weight:700;color:var(--ink);line-height:1.1;
  font-variant-numeric:tabular-nums}

/* ---------- 清單列 ---------- */
.list{border-radius:var(--r);overflow:hidden}
.row2{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;border-bottom:1px solid var(--line2);padding:13px 16px;font-family:inherit}
.row2:last-child{border-bottom:0}
.row2:active{background:var(--sunk)}
.row2 .bd2{flex:1;min-width:0}
.row2 .t{display:block;font-size:15px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .go{flex:none;color:var(--faint);font-size:19px}
.row2 .q{flex:none;text-align:right}
.row2 .q b{display:block;font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.row2 .q i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}

/* ---------- 表格（還是需要表格的地方）---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 10px;
  background:var(--sunk);border:0;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line2);vertical-align:middle}
tr.warn td{background:var(--bad-bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 空狀態 ---------- */
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:700;margin-bottom:5px}
.emptyic{font-size:30px;line-height:1;margin-bottom:11px;opacity:.5}

/* ---------- 提示框 ---------- */
.warnbox{background:var(--warn-bg);border-radius:var(--r2);padding:12px 14px;
  font-size:13.5px;line-height:1.7;color:#6B4200}
.err{background:var(--bad-bg);border-radius:var(--r2);padding:12px 14px;
  font-size:13.5px;line-height:1.7;color:#8A2820}
.note{background:var(--brandsoft);border-radius:var(--r2);padding:12px 14px;
  font-size:13.5px;line-height:1.7;color:var(--brand)}
.krule{font-size:13px;color:var(--muted);background:var(--sunk);border:0;
  border-radius:var(--r2);padding:10px 13px;margin:-4px 0 14px}

/* ---------- 浮出視窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(18,22,31,.5);z-index:90;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:540px;z-index:91;
  background:#fff;border-radius:20px 20px 0 0;box-shadow:var(--sh2);
  padding-bottom:env(safe-area-inset-bottom)}
.sheet .shd{padding:20px 20px 8px;font-size:17px;font-weight:700}
.sheet .sbd{padding:0 20px 6px;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.sheet .sft{display:flex;gap:10px;padding:16px 20px 20px}
.sheet .sft .btn{flex:1}
@media(min-width:560px){.sheet{bottom:auto;top:10vh;border-radius:var(--r)}}

/* ---------- 吐司 ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:95;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r2);
  font-size:14px;max-width:88%;text-align:center;box-shadow:var(--sh2)}

/* ---------- 搜尋與篩選 ---------- */
.mvf{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:0 16px 13px}
.mvchip{display:inline-flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:20px;
  padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.mvchip:hover{background:var(--sunk)}
.mvchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.mvchip[aria-pressed="true"] .c{color:#B9C6E4}
.mvsearch{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:var(--r2);
  padding:10px 13px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:20px;
  padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== 既有元件樣式（沿用新變數，之後逐一改寫） ===== */
.card .hd{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card .hd h2{margin:0;font-size:14px;font-weight:900;letter-spacing:.04em}
.card .bd{padding:14px}
.note b{color:#4A3A0C}
label.f{display:block;margin-bottom:13px}
label.f .lbl{display:block;margin-bottom:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 角色選擇 */
.gate{max-width:420px;margin:0 auto;padding:34px 18px}
.gate h2{font-size:19px;font-weight:900;margin:0 0 4px}
.gate p{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.role{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);
  border-radius:3px;padding:16px 16px;margin-bottom:11px;cursor:pointer;font-family:var(--tc);color:var(--ink)}
.role.amber{border-left-color:var(--amber)}
.role b{display:block;font-size:16.5px;font-weight:900;margin-bottom:3px}
.role span{font-size:13px;color:var(--muted)}
/* 進度 */
.tape{display:flex;gap:2px;padding:10px 14px 0}
.tape i{flex:1;height:6px;background:#C9CDD3;border-radius:1px}
.tape i.done{background:var(--amber)} .tape i.flag{background:var(--alert)} .tape i.cur{box-shadow:0 0 0 2px var(--ink)}
.tapecap{display:flex;justify-content:space-between;padding:6px 14px 9px}
.pkgnav{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.pkgnav::-webkit-scrollbar{display:none}
.pkgnav button{white-space:nowrap;font-family:var(--tc);font-size:13px;font-weight:700;padding:8px 12px;
  border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;color:var(--ink)}
.pkgnav button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pkgnav button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:middle}
.pkgnav button .dot.ok{background:var(--amber)} .pkgnav button .dot.bad{background:var(--alert)}
/* 盤點列 */
.row{border-bottom:1px solid var(--line2);padding:10px 12px;display:flex;align-items:center;gap:10px}
.row:last-child{border-bottom:0}
.shotbtn{width:62px;height:62px;flex:0 0 62px;border:1px dashed var(--line);border-radius:3px;background:#F7F8FA;
  display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative}
.shotbtn.has{border-style:solid;border-color:var(--ok)}
.shotbtn img{width:100%;height:100%;object-fit:cover}
.shotbtn .cam{font-size:20px;color:var(--muted)}
.shotbtn .redo{position:absolute;right:0;bottom:0;background:rgba(21,24,28,.82);color:#fff;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;padding:2px 4px}
.row .info{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:500;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.row .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.stat{font-family:var(--tc);font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;
  border-radius:3px;padding:9px 8px;min-width:70px;cursor:pointer;color:var(--muted)}
.stat.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stat.bad{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.stat:disabled{opacity:.4}
.pick{display:flex;gap:5px;flex:0 0 auto}
.pk{width:54px;height:46px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-family:var(--tc);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;padding:0 2px}
.pk.ok.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pk.bad.on{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.pk:disabled{opacity:.35}
@media (max-width:360px){.pk{width:48px;font-size:12px}}
.panel{background:#FBFCFD;border-top:1px solid var(--line2);padding:12px 14px 14px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;font-size:22px;border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;font-family:var(--mono)}
.step input{width:76px;text-align:center;font-family:var(--mono);font-size:19px;font-weight:600}
.step.big button{width:54px;height:58px;font-size:26px}

/* 擺放位置：標籤格 */
.locgrid{display:flex;flex-wrap:wrap;gap:7px}
.lchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  background:#fff;border-radius:8px;padding:0 10px;min-height:38px;cursor:pointer;
  font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--ink)}
.lchip i{font-style:normal;font-size:11px;font-weight:400;color:var(--muted);
  background:var(--bg2);border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
.lchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lchip.on i{background:rgba(255,255,255,.22);color:#fff}
.locbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;
  padding-top:11px;border-top:1px dashed var(--line2)}
/* 用現代模式渲染，但版面緊密度維持跟原本一樣 */
table{line-height:normal}
.foot{line-height:1}
label.f>.lbl{display:block;line-height:1.5}
.upg{min-height:70vh;display:flex;flex-direction:column;align-items:center;
     justify-content:center;text-align:center;padding:0 28px;gap:14px}
.upgT{font-size:21px;font-weight:800;letter-spacing:.04em}
.upgS{font-size:15px;line-height:1.85;color:var(--mut,#667085)}
.upgS b{color:var(--ink,#15181c)}
/* ===== ISO 設備與量測儀器 ===== */
.iseg{display:flex;gap:0;margin-bottom:12px}
.iseg.am button[aria-pressed="true"]{background:var(--amber);color:#241A00;border-color:var(--amber)}
.eqrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#fff;border:0;
  border-bottom:1px solid var(--line2);padding:11px 12px;cursor:pointer;font-family:var(--tc);color:var(--ink)}
.eqrow:last-child{border-bottom:0}
.eqrow .eno{font-family:var(--mono);font-size:13.5px;font-weight:600;flex:0 0 76px}
.eqrow .enm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqrow .eloc{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.eqrow.dim{opacity:.5}
.kv{width:100%;border-collapse:collapse;font-size:13.5px}
.kv th,.kv td{border:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:top}
.kv th{background:#F4F5F7;font-weight:700;font-size:12.5px;white-space:nowrap;width:1%;color:#49505A}
.ilist{background:#fff;border:1px solid var(--line);border-radius:3px}
.ihd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2);
  font-size:12.5px;font-weight:700;color:#49505A;background:#F7F8FA}
.okbox{background:var(--ok-bg);border:1px solid var(--ok);border-radius:3px;padding:10px 12px;
  margin-bottom:12px;font-size:13px;color:#1F5A42}
/* 列印 */
.iso-form{background:#fff;border:1px solid #999;padding:14px;margin-bottom:14px;overflow-x:auto}
.iso-form .fh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:#555}
.iso-form .ft{text-align:center;font-size:15px;font-weight:900;letter-spacing:.18em;margin:6px 0 10px}
table.pf{width:100%;border-collapse:collapse;font-size:11px;min-width:580px}
table.pf th,table.pf td{border:1px solid #333;padding:4px 5px;text-align:center;vertical-align:middle;height:24px}
table.pf th{background:#EFEFEF;font-weight:700}
table.pf td.l{text-align:left}
table.pf td.hd{background:#EFEFEF;font-weight:700;white-space:nowrap}
table.pf .mo{font-family:var(--mono);white-space:nowrap}
.iso-form .sig{display:flex;gap:22px;justify-content:flex-end;font-size:11px;margin-top:9px;color:#333}
@media print{
  .noprint,header.top,nav.tabs,.toast{display:none!important}
.iso-form{border:0;padding:0;page-break-after:always}
table.pf{min-width:0}
}
/* ---- 編號管理：庫存頁的母子列 ---- */
.uexp{display:inline;padding:0 6px 0 0;margin:0;border:0;background:none;
  color:var(--muted);font-size:11px;line-height:1;cursor:pointer}
.uexp:hover{color:var(--ink)}
.unm{cursor:pointer;white-space:nowrap}
.ulbl{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.ulbl2{font-size:12px;color:var(--muted);margin-left:8px}
tr.unitrow>td{background:var(--soft,#FAFAF8);border-top:1px dashed var(--line2);padding-top:9px;padding-bottom:9px}
.uno{font-family:var(--mono);font-weight:700;font-size:13.5px}
.upill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:3px;
  border:1px solid var(--line);background:#fff;color:var(--muted)}
.upill.veh{border-color:#1F5F8B;color:#1F5F8B;background:#E7F0F7}
.upill.wh{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
/* ---- 出入庫：勾選編號 ---- */
.upk{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
  border-radius:3px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.upk.on{border-color:var(--ink);background:#F5F7FA}
.upk input{width:17px;height:17px;flex:none}
.upk .uno{flex:none}
.upk .ulbl{margin-top:0}
.isoreg{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);
  border-radius:3px;padding:9px 12px;margin-bottom:10px}
.isoreg b{color:var(--ink);font-size:14px}
.isoreg span{display:block;font-size:12px;margin-top:3px}
/* ---- 倉庫盤點 ---- */
.pgtop2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pgtop2 .pgback{background:none;border:1px solid var(--line);border-radius:3px;width:36px;height:36px;
  font-size:17px;color:var(--ink);cursor:pointer;flex:none}
.pgtop2 b{font-size:16.5px;font-weight:800;display:block}
.pgtop2 .pgsub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whprog{flex:none;font-size:11.5px;color:var(--muted);text-align:right}
.whprog b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink)}
.whgrp{display:flex;align-items:center;gap:9px;background:var(--sunk);padding:8px 12px;
  font-size:13.5px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line2)}
.whgrp .whloc,.whrow .whloc{flex:none;width:40px;font-size:12px;font-weight:700;color:var(--ink2);
  text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--r3);padding:2px 0}
.whrow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line2)}
.whrow:last-child{border-bottom:0}
.whrow.diff{background:#FFFBF0}
.whrow .whnm{flex:1;min-width:0;font-size:14px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whrow .whin{flex:none;width:62px;height:38px;text-align:center;font-family:var(--mono);
  font-size:16px;font-weight:700;border:1px solid var(--line);border-radius:3px;background:#fff}
.whrow .whin:focus{border-color:var(--ink);outline:0}
.whrow .whd{flex:none;width:58px;text-align:right;font-size:11.5px}
.whrow .whd i{font-style:normal;color:var(--muted);font-family:var(--mono)}
.whrow .whd em{font-style:normal;font-family:var(--mono);font-size:14px;font-weight:700}
.whrow .whd em.ok{color:var(--ok);font-size:11.5px;font-weight:600}
.whrow .whd em.up{color:var(--ok)}
.whrow .whd em.dn{color:var(--alert)}
.whb{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
/* ---- 產號分配表 ---- */
.planrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line2)}
.planrow.head{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em;
  border-bottom:1px solid var(--line);padding-bottom:6px}
.planrow.head span:first-child{flex:1}
.planrow.head .n{width:62px;text-align:center}
.planrow.head .n:last-child{width:118px}
.planrow.zero{opacity:.55}
.planrow.wh{background:#F7F8FA;border-bottom:0;margin-top:2px}
.planrow .pl{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink)}
.planrow .pl i{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.planrow .sg{width:62px;text-align:center;font-family:var(--mono);font-size:14px;color:var(--muted)}
.planrow .pq{width:118px;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.planrow .pin{width:46px;height:32px;text-align:center;font-family:var(--mono);font-size:15px;
  font-weight:700;border:1px solid var(--line);border-radius:3px;background:#fff}
.planrow .pin:focus{border-color:var(--ink);outline:0}
.stp{width:30px;height:32px;border:1px solid var(--line);background:#fff;border-radius:3px;
  font-size:15px;line-height:1;color:var(--ink);cursor:pointer;flex:none}
.stp:active{background:#EEF1F5}
.plantot{text-align:right;font-size:13px;color:var(--muted);padding:11px 2px 0}
.plantot b{font-family:var(--mono);font-size:19px;color:var(--ink)}
/* ---- 車輛納入開關 ---- */
tr.voff td{background:#FAFAF8;color:var(--muted)}
tr.voff td:first-child{opacity:.6}
.vsw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.vsw input{width:16px;height:16px;flex:none}
/* ---- 外勤：選編號 ---- */
.uslot{background:#F7F8FA;border-bottom:1px solid var(--line2);padding:10px 12px 11px}
.uslot .ulead{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.5}
.uslot .ulead i{display:block;font-style:normal;font-size:11.5px;font-weight:400;
  color:var(--muted);margin-top:2px}
.urow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.urow:last-child{margin-bottom:0}
.urow .un{flex:none;width:20px;font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center}
.urow select{flex:1;min-width:0;height:42px;font-size:15px;border:1px solid var(--line);
  border-radius:3px;background:#fff;padding:0 9px}
.urow.got select{border-color:var(--ok);background:var(--ok-bg)}
.urow.none select{border-color:var(--alert);background:#FFF4F3;color:var(--alert);font-weight:700}
/* ---- 編號對不上的警示 ---- */
.alertcard{border-color:var(--alert)}
.alertcard>.hd h2{color:var(--alert)}
.arow{padding:11px 13px;border-bottom:1px solid var(--line2)}
.arow:last-child{border-bottom:0}
.arow.dup{background:#FFF4F3}
.atop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.apill{font-size:11px;font-weight:700;padding:3px 7px;border-radius:3px;border:1px solid}
.apill.dup{border-color:var(--alert);color:#fff;background:var(--alert)}
.apill.moved{border-color:var(--amber-d);color:var(--amber-d);background:#FFF6E3}
.atop .aitem{font-size:13px;color:var(--muted)}
.atop .adate{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.adet{font-size:13px;color:#3C444E;line-height:1.6;margin-bottom:8px}
.aact{display:flex;gap:7px;flex-wrap:wrap}
nav.tabs .ic{position:relative;display:inline-block}

/* ---- 待補料的清單列 ---- */
.nrow{display:flex;align-items:center;gap:11px;padding:12px 16px;border-top:1px solid var(--line2)}
.nrow:first-child{border-top:0}
.nrow.lack{background:var(--bad-bg)}
.nbd{flex:1;min-width:0}
.nbd .nt{display:block;font-size:15px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbd .ns{display:block;font-size:12px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nq,.nw{flex:none;text-align:center;min-width:38px}
.nq b,.nw b{display:block;font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.nq i,.nw i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:1px}
.nw b{color:var(--muted);font-size:16px}
.nw.bad b{color:var(--bad)}
.nq.bad b{color:var(--bad)}

/* ---- 次分頁 ---- */
.subbar{display:flex;gap:4px;background:#fff;border:1.5px solid var(--line);
  border-radius:var(--r2);padding:4px;margin:0 auto 14px;max-width:600px;box-shadow:var(--sh)}
.subbar button{flex:1;border:0;background:none;border-radius:var(--r3);padding:10px 6px;
  font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.subbar button[aria-pressed="true"]{background:var(--brandsoft);color:var(--brand)}
.sbb{position:absolute;top:4px;right:6px;background:var(--bad);color:#fff;font-style:normal;
  font-size:10px;font-weight:700;min-width:15px;height:15px;border-radius:8px;padding:0 4px;
  display:inline-flex;align-items:center;justify-content:center;line-height:1}

/* ---- 全螢幕子頁 ---- */
.pgtop{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.pgback{flex:none;background:#fff;border:0;box-shadow:var(--sh);border-radius:var(--r2);
  width:38px;height:38px;font-size:18px;color:var(--ink);cursor:pointer}
.pgback:active{background:var(--sunk)}
.pgt{flex:1;min-width:0}
.pgt b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgt span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- 品項頁的小列 ---- */
.prow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line2)}
.prow:first-child{border-top:0}
.prow .pn{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .mvd{flex:none;width:48px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pq{flex:none;display:flex;align-items:center;gap:7px}
.pq b{font-size:17px;font-weight:700;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.stp{width:32px;height:32px;border:0;background:var(--sunk);border-radius:var(--r3);
  font-size:16px;line-height:1;color:var(--ink);cursor:pointer;flex:none}
.stp:active{background:var(--line)}

/* 庫存清單左邊的位置欄 */
.row2 .iloc{flex:none;width:40px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;
  font-variant-numeric:tabular-nums}
.uno{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* ---- 車輛小格 ---- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.vtile{position:relative;background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r2);
  padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.vtile b{font-size:20px;font-weight:700;line-height:1;color:var(--ink)}
.vtile .dots{display:flex;gap:4px}
.vtile em{position:absolute;top:-5px;right:-4px;background:var(--bad);color:#fff;font-style:normal;
  font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;padding:0 4px;
  display:flex;align-items:center;justify-content:center}
.vtile.bad{background:var(--bad-bg);border-color:#F3C7C1}
.vtile.miss{background:var(--warn-bg);border-color:#F0DCB4}
.vtile[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandsoft)}
/* 數字列裡的分母 */
.numrow b s{font-size:13px;font-weight:600;color:var(--faint);text-decoration:none}

.psel{border:1px solid var(--line);background:#fff;border-radius:var(--r3);padding:7px 10px;
  font-size:13.5px;font-weight:600;color:var(--ink);font-family:var(--tc);max-width:150px}
.mrtabs button .n i{font-variant-numeric:tabular-nums}

/* ---- 開關 ---- */
.sw{flex:none;position:relative;width:44px;height:26px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:background .15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;
  border-radius:50%;box-shadow:0 1px 3px rgba(26,31,43,.25);transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{transform:translateX(18px)}
.prow.voff{background:var(--sunk)}
.prow.voff>span:first-child{color:var(--faint)}

/* ---- 庫存品項一列 ---- */
.srow{border-top:1px solid var(--line2)}
.srow:first-child{border-top:0}
.srow.low{background:#FFF8F7}
.shead{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer}
.shead:hover{background:var(--sunk)}
.srow.low .shead:hover{background:#FFEFEC}
.gapt{color:var(--bad);font-weight:700}
.sx{flex:none;width:26px;height:26px;border:1.5px solid var(--line);background:#fff;
  border-radius:var(--r3);font-size:12px;color:var(--ink2);cursor:pointer;line-height:1}
.sx.ph{border:0;background:none}
.srow .iloc{flex:none;width:34px;font-size:12px;font-weight:700;color:var(--ink2);
  text-align:center;background:var(--sunk);border:1px solid var(--line2);
  border-radius:var(--r3);padding:3px 0}
.sbd{flex:1;min-width:0}
.st{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:12px;color:var(--muted);margin-top:1px}
.sn{flex:none;display:flex;gap:4px}
/* 倉庫＝實心色塊大字；安全量＝旁邊一行小字。一眼分得出哪個是現有、哪個是門檻 */
.sn{align-items:center;gap:8px}
.wh{min-width:52px;text-align:center;border-radius:var(--r2);padding:4px 6px 3px;
  background:var(--ok);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.wh.low{background:var(--bad)}
.wh.nosf{background:#6B7488}   /* 沒設安全量：不判斷夠不夠，用中性灰 */
.wh b{display:block;font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.wh i{display:block;font-style:normal;font-size:10px;opacity:.9}
.sf{min-width:40px;text-align:center;color:var(--muted);border-left:1.5px dashed var(--line);padding-left:8px}
.sf i{display:block;font-style:normal;font-size:10px}
.sf b{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.srow.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#FFF2C2}100%{background:transparent}}
.sunits{background:var(--sunk);border-top:1px solid var(--line2);padding:4px 14px 8px 48px}
.urow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line2)}
.urow:first-child{border-top:0}
.gapb{flex:none;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;
  background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.gapb.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.card.hil{border-color:var(--brandline);background:var(--brandsoft)}
.card.hil>.bd{background:var(--brandsoft)}
@media (max-width:400px){ .wh{min-width:46px} .shead{gap:7px;padding:11px 10px} }

/* ---- 盤點單一列 ---- */
.shrow{border-top:1px solid var(--line2)}
.shrow:first-child{border-top:0}
.shrow.ab{background:#FFF8F7}
.shhead{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:11px 14px;cursor:pointer}
.shhead:hover{background:var(--sunk)}
.shv{flex:none;width:30px;height:30px;border-radius:var(--r3);background:var(--brand);color:#fff;
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.shs{flex:none;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;border:1px solid}
.shs.am{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.shs.pm{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.shb{flex:1;min-width:0}
.shb .t{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===================== 資料來源：全部來自雲端 ===================== */
// 上午場清單記的是「下午盤點表上的某一列」＝某一包別裡的某一項
const AMSET=()=>new Set((S&&S.amRows)||[]);

const ALLRW=()=>(S&&S.rows)?S.rows:[];
const RW=()=>{ const all=ALLRW(); if(!amMode())return all;
  const am=AMSET(); return all.filter(r=>am.has(r.rid)); };
const PKGS=()=>{ const all=(S&&S.pkgs)?S.pkgs:[];
  if(!amMode())return all;
  const ids=new Set(RW().map(r=>r.pkg)); return all.filter(p=>ids.has(p.id)); };
/* VEH() 只給「納入驗屋盤點」的車；關掉的車（例如固定放甲醛工具的）不列入標配與車上數量。
   歷史紀錄要顯示車號時用 VEHALL()，不然舊資料會看不到。 */
const VEH=()=>(S&&S.vehicles)?S.vehicles:[];
const VEHALL=()=>(S&&S.vehiclesAll)?S.vehiclesAll:VEH();
const vehOff=c=>VEHALL().indexOf(c)>=0 && VEH().indexOf(c)<0;

const itemOf=k=>ITEMS().find(i=>i.sku===k);
// 下拉選單依儲位順序排列，方便照著貨架找東西
const ITEMS_BY_LOC=()=>ITEMS().slice().sort((a,b)=>{
  const d=locRank(a.loc)-locRank(b.loc); return d!==0?d:a.sku.localeCompare(b.sku,"zh-Hant");});
const cur=k=>k;
const needOf=k=>{const i=itemOf(k);return i?i.std:0;};
const priceOf=()=>null;
const pkgName=id=>{const p=PKGS().find(x=>x.id===id);return p?p.name:"";};

/* ===================== 照片上傳 =====================
   一張一張慢慢傳最怕的是：中途斷一次就整張單重來。
   這裡做三件事：單張有逾時與重試、多張同時傳、以及拍完就先在背景傳。  */
const BUCKET="count-photos";
const UP_TIMEOUT=30000, UP_TRIES=3, UP_CONC=4, UP_BG_CONC=2;
const upSleep=ms=>new Promise(r=>setTimeout(r,ms));
const upOnline=()=>{ try{ return navigator.onLine!==false; }catch(e){ return true; } };

async function uploadOnce(path,blob){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),UP_TIMEOUT);
  try{
    const res=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${encodeURI(path)}`,
      {method:"POST",signal:ctl.signal,
       headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,
                "x-upsert":"true","Content-Type":(blob&&blob.type)||"image/jpeg"},body:blob});
    if(!res.ok) throw new Error(`HTTP ${res.status} ${(await res.text()).slice(0,80)}`);
    return path;
  }finally{ clearTimeout(t); }
}
// 單張：逾時 30 秒，最多試 3 次，間隔 0.8s → 1.6s
async function uploadPhoto(path,dataUrl,opt){
  opt=opt||{};
  const blob=await (await fetch(dataUrl)).blob();
  const tries=opt.tries||UP_TRIES;
  let last=null;
  for(let i=0;i<tries;i++){
    if(!upOnline()){ last=new Error("目前沒有網路"); await upSleep(1500); continue; }
    try{ return await uploadOnce(path,blob); }
    catch(e){
      last=(e&&e.name==="AbortError")?new Error("上傳逾時"):e;
      if(i<tries-1) await upSleep(800*Math.pow(2,i));
    }
  }
  throw new Error("照片上傳失敗："+((last&&last.message)||""));
}
// 多張：同時 conc 張，回傳失敗的那幾張
async function uploadMany(jobs,onTick,conc){
  const list=jobs.slice(); let i=0; const fails=[];
  const n=Math.max(1,Math.min(conc||UP_CONC,list.length));
  await Promise.all(Array.from({length:n},async()=>{
    while(i<list.length){
      const j=list[i++];
      try{ j.path=await uploadPhoto(j.path,j.data); j.ok=true; }
      catch(e){ j.err=e.message||""; fails.push(j); }
      if(onTick) onTick(j);
    }
  }));
  return fails;
}

/* ---- 背景上傳：拍完就傳，人還在盤下一項 ---- */
let bgQueue=[], bgRunning=false, bgDone=0, bgFail=0;
function bgPush(key,path,data,onSaved){
  bgQueue=bgQueue.filter(j=>j.key!==key);          // 同一格重拍就換掉舊的
  bgQueue.push({key,path,data,onSaved,tries:0});
  bgPump();
}
function bgDrop(key){ bgQueue=bgQueue.filter(j=>j.key!==key); }
function bgClear(){ bgQueue=[]; bgDone=0; bgFail=0; }
const bgPending=()=>bgQueue.length;
async function bgPump(){
  if(bgRunning) return; bgRunning=true;
  try{
    while(bgQueue.length){
      if(!upOnline()){ await upSleep(5000); continue; }   // 沒訊號就安靜等，不狂重試
      const batch=bgQueue.slice(0,UP_BG_CONC);
      let okThisRound=0;
      await Promise.all(batch.map(async j=>{
        try{
          await uploadPhoto(j.path,j.data,{tries:1});
          bgQueue=bgQueue.filter(x=>x!==j); bgDone++; okThisRound++;
          if(j.onSaved) j.onSaved(j.path);
        }catch(e){
          j.tries++;
          if(j.tries>=6){ bgQueue=bgQueue.filter(x=>x!==j); bgFail++; }  // 放棄，送出時再傳
        }
      }));
      // 只有整輪都失敗才需要退讓等待，順利的時候要一張接一張傳
      if(bgQueue.length && okThisRound===0) await upSleep(4000);
    }
  }finally{ bgRunning=false; }
}
try{ window.addEventListener("online",()=>bgPump()); }catch(e){}

const DKEY=()=>"jcdraft:"+(REG||"北");
const DMAX=24*3600*1000;                       // 超過 24 小時的暫存自動作廢
let _idb=null;
function idb(){
  if(_idb) return _idb;
  _idb=new Promise(res=>{
    try{
      const q=indexedDB.open("jc_inv",1);
      q.onupgradeneeded=()=>{ try{q.result.createObjectStore("kv");}catch(e){} };
      q.onsuccess=()=>res(q.result);
      q.onerror=()=>res(null);
      q.onblocked=()=>res(null);
      setTimeout(()=>res(null),2500);          // 太久沒回應就當作不能用
    }catch(e){ res(null); }
  });
  return _idb;
}
async function kvSet(k,v){
  const db=await idb();
  if(db){ try{ await new Promise((ok,no)=>{ const t=db.transaction("kv","readwrite");
    t.objectStore("kv").put(v,k); t.oncomplete=ok; t.onerror=()=>no(t.error); t.onabort=()=>no(t.error); });
    return true; }catch(e){} }
  // IndexedDB 不能用才走這裡；照片多的時候可能塞不下，塞不下就只留盤點進度
  try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){}
  try{
    const lite=JSON.parse(JSON.stringify(v)); lite.lite=true;
    Object.values(lite.draft.items||{}).forEach(x=>{ x.photo=null; });
    lite.draft.pkgPhoto={};
    localStorage.setItem(k,JSON.stringify(lite)); return true;
  }catch(e){ return false; }
}
async function kvGet(k){
  const db=await idb();
  if(db){ try{ const v=await new Promise((ok,no)=>{ const t=db.transaction("kv","readonly");
    const r=t.objectStore("kv").get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); });
    if(v) return v; }catch(e){} }
  try{ const x=localStorage.getItem(k); return x?JSON.parse(x):null; }catch(e){ return null; }
}
async function kvDel(k){
  const db=await idb();
  if(db){ try{ await new Promise(ok=>{ const t=db.transaction("kv","readwrite");
    t.objectStore("kv").delete(k); t.oncomplete=ok; t.onerror=ok; t.onabort=ok; }); }catch(e){} }
  try{ localStorage.removeItem(k); }catch(e){}
}
let _dT=null, savedAt=null, _sig="";
// 便宜的變動指紋：沒變就不用重寫一次（照片多的時候一張單可能到 2～3MB）
function draftSig(){
  if(!draft) return "";
  let n=0,ph=0,s="";
  for(const k in (draft.items||{})){ const x=draft.items[k]; n++;
    s+=k.slice(0,4)+x.status+(x.actual??"")+(x.type||"")+(x.photo?"P"+x.photo.length:"")+"|"; }
  for(const k in (draft.pkgPhoto||{})) ph+=(draft.pkgPhoto[k]||[]).filter(Boolean).length;
  return `${draft.person}/${draft.vehicle}/${draft.date}/${draft.session}/${n}/${ph}/${s.length}/${s.slice(-120)}`;
}
function saveDraftSoon(){
  if(role!=="field"||!hasProgress()) return;
  clearTimeout(_dT); _dT=setTimeout(saveDraftNow,400);
}
function saveDraftNow(force){
  if(role!=="field"||!hasProgress()) return;
  clearTimeout(_dT);
  const sig=draftSig();
  if(!force&&sig===_sig) return;              // 沒有任何變動就不重寫
  _sig=sig;
  kvSet(DKEY(),{v:1,reg:REG,at:Date.now(),curPkg,draft}).then(ok=>{
    if(ok){ savedAt=nowHM(); const el=document.getElementById("savetag");
            if(el) el.textContent="已自動存檔 "+savedAt; }
  });
}
function clearDraft(){ clearTimeout(_dT); savedAt=null; _sig=""; bgClear(); kvDel(DKEY()); }

let resume=null;                               // 等待使用者決定要不要接續的那一張
async function checkResume(){
  resume=null;
  const p=await kvGet(DKEY());
  if(!p||!p.draft||p.reg!==REG) return;
  if(Date.now()-(p.at||0)>DMAX){ kvDel(DKEY()); return; }
  const d=p.draft;
  const n=Object.keys(d.items||{}).length;
  const ph=Object.values(d.pkgPhoto||{}).reduce((t,a)=>t+(a||[]).filter(Boolean).length,0);
  if(!n&&!ph){ kvDel(DKEY()); return; }
  resume={pack:p,n,ph};
  if(role==="field") render();
}
function resumeBox(){
  if(!resume) return "";
  const d=resume.pack.draft;
  const when=new Date(resume.pack.at);
  const hm=String(when.getHours()).padStart(2,"0")+":"+String(when.getMinutes()).padStart(2,"0");
  return `<div class="card" style="border-color:var(--amber);border-width:2px">
    <div class="hd"><h2>有一張還沒送出的盤點單</h2></div>
    <div class="bd">
      <div style="font-size:16px;font-weight:800;margin-bottom:4px">
        ${esc(d.vehicle||"未選車")} 車 · ${esc(d.date||"")} ${d.session==="am"?"上午場":"下午場"}</div>
      <div class="lbl" style="line-height:1.8">
        盤點人：${esc(d.person||"（未填）")}<br>
        已盤 ${resume.n} 項${resume.ph?`，已拍 ${resume.ph} 張本包照片`:""}<br>
        最後存檔時間：${hm}</div>
      <button class="btn block" style="margin-top:12px" onclick="doResume()">接續這張單</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="dropResume()">不要了，重新開始</button>
    </div></div>`;
}
function doResume(){
  const p=resume.pack;
  _sig="";
  draft=p.draft; draft.started=true; curPkg=p.curPkg||firstPkg();
  if(!PKGS().some(x=>x.id===curPkg)) curPkg=firstPkg();
  resume=null; window.scrollTo(0,0); render();
  toast("已接續上次的盤點單");
}
function dropResume(){
  if(!confirm("確定要丟掉上次那張未送出的盤點單？丟掉之後就要重新盤一次。")) return;
  resume=null; clearDraft(); render(); toast("已清除");
}

// 畫面上輸入的是「差幾個」，內部仍換算成實際數量
function deltaOf(r,s){
  if(s.actual===null||s.actual==="")return null;
  if(s.type==="損壞")return Number(s.actual);
  if(s.type==="多出")return Number(s.actual)-r.std;
  return r.std-Number(s.actual);   // 遺失（含舊資料的短缺）
}
function setDelta(rid,v){
  const r=RW().find(x=>x.rid===rid), s=st(rid);
  let d=Math.max(0,parseInt(v)||0);
  if(s.type==="損壞"){ s.actual=d; }
  else if(s.type==="多出"){ s.actual=r.std+d; }
  else { d=Math.min(d,r.std); s.actual=r.std-d; }   // 遺失（含舊資料的短缺）
}
function bumpDelta(rid,step){
  const s=st(rid), r=RW().find(x=>x.rid===rid);
  setDelta(rid,(deltaOf(r,s)||0)+step); render();
}
const deltaLabel=t=>t==="損壞"?"壞了幾個":t==="多出"?"多了幾個":"少了幾個";

const PXQ={640:0.62,1280:0.72,1800:0.78};
const PXNAME={640:"省流量",1280:"標準",1800:"高畫質"};

// 這張單總共要傳幾張、已經好了幾張
function upStat(){
  let need=0, done=0;
  if(!draft) return {need,done};
  if(byItem()){ RW().forEach(r=>{ const x=draft.items[r.rid]; if(x&&x.photo){ need++;
      if(draft.up&&draft.up["item:"+r.rid]) done++; } }); }
  else{
    PKGS().forEach(p=>((draft.pkgPhoto[p.id]||[]).forEach((d,i)=>{ if(d){ need++;
      if(draft.up&&draft.up[`pkg:${p.id}:${i}`]) done++; } })));
    RW().forEach(r=>{ const x=draft.items[r.rid];
      if(x&&x.status==="abnormal"&&x.photo){ need++;
        if(draft.up&&draft.up["item:"+r.rid]) done++; } });
  }
  return {need,done};

function shrink(f,cb,stamp){const fr=new FileReader();fr.onload=()=>{const img=new Image();
  img.onerror=()=>toast("讀不出這張照片（iPhone 的 HEIC 格式請改用拍照）");
  img.onload=()=>{const m=photoPx(),q=PXQ[m]||0.72,
      sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height);
    if(stamp){ // 照片左下角壓字，管理端、報表一眼看得出來
      const fs=Math.max(14,Math.round(Math.min(c.width,c.height)*0.045)), pad=Math.round(fs*0.45);
      x.font=`700 ${fs}px sans-serif`; const w=x.measureText(stamp).width;
      x.fillStyle="rgba(200,40,30,.88)"; x.fillRect(0,c.height-fs-pad*2,w+pad*2,fs+pad*2);
      x.fillStyle="#fff"; x.textBaseline="middle"; x.fillText(stamp,pad,c.height-pad-fs/2);
      window.__stamp=stamp; }
    cb(c.toDataURL("image/jpeg",q));};

/* ---------- 從相簿選照片 ----------
   拍照本來就是現場拍的；從相簿選的照片，讀它的拍攝日期（EXIF），
   不是今天拍的、或看不出拍攝日，就在照片左下角壓上紅字，管理端審核時一眼看得出來 */
function parseExifDate(v){
  if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return null;
  let o=2;
  while(o+10<v.byteLength){
    const mk=v.getUint16(o); if((mk&0xFF00)!==0xFF00) break;
    const len=v.getUint16(o+2);
    if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
      const t=o+10, le=v.getUint16(t)===0x4949;
      const u16=p=>v.getUint16(t+p,le), u32=p=>v.getUint32(t+p,le);
      const str=(p,n)=>{let r="";for(let i=0;i<n&&t+p+i<v.byteLength;i++){const c=v.getUint8(t+p+i);if(!c)break;r+=String.fromCharCode(c);}return r;};
      const find=(ifd,tag)=>{const n=u16(ifd);for(let i=0;i<n;i++){const e=ifd+2+i*12;if(u16(e)===tag)return e;}return -1;};
      const ifd0=u32(4); let dt="";
      const ex=find(ifd0,0x8769);
      if(ex>=0){const d=find(u32(ex+8),0x9003); if(d>=0) dt=str(u32(d+8),19);}
      if(!dt){const d=find(ifd0,0x0132); if(d>=0) dt=str(u32(d+8),19);}
      return /^\d{4}:\d\d:\d\d/.test(dt)?dt.slice(0,10).replace(/:/g,"-"):null;
    }
    o+=2+len;
  }
  return null;
}
function photoDay(f){ return new Promise(ok=>{
  const done=d=>{ if(!d&&f.lastModified){ const t=new Date(f.lastModified);
      const p=n=>String(n).padStart(2,"0"); d=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`; }
    ok(d||null); };
  const fr=new FileReader();
  fr.onload=()=>{ let d=null; try{ d=parseExifDate(new DataView(fr.result)); }catch(e){} done(d); };
  fr.onerror=()=>done(null);
  fr.readAsArrayBuffer(f.slice(0,262144)); }); }
async function libStamp(f){
  const d=await photoDay(f);

  if(d===`${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}`) return "";   // 手機本地的今天
  return d?`非當日照片・拍攝 ${d.slice(5).replace("-","/")}`:"相簿照片・拍攝日不明";

    if(t.done<t.total){curPkg=p.id;render();

    if(s.status==="abnormal"&&(!s.type||s.actual===null)){curPkg=r.pkg;s.open=true;render();return toast(`「${r.name}」尚未填完`);}

    const pkgPhotos=[];
    if(!byItem()){
      for(const p of PKGS()){
        const arr=draft.pkgPhoto[p.id]||[];
        for(let i=0;i<arr.length;i++){
          if(!arr[i]) continue;
          const key=`pkg:${p.id}:${i}`;
          let path=up[key];
          if(!path){ path=`${base}/pkg-${p.id}-${i}.jpg`; jobs.push({key,path,data:arr[i]}); }
          pkgPhotos.push({package_name:p.name,photo_path:path});
        }
      }
    }
    const lines=[];
    for(const r of RW()){
      const st0=draft.items[r.rid];
      const ab=st0.status==="abnormal";
      const actual=ab?Number(st0.actual):r.std;
      let path=null;
      if(st0.photo && (byItem()||ab)){
        const key="item:"+r.rid;
        path=up[key];
        if(!path){ path=`${base}/item-${r.rid}.jpg`; jobs.push({key,path,data:st0.photo}); }
      }
      lines.push({item_name:r.name,package_name:r.pkgName,std:r.std,actual,
        status:ab?st0.type:"正常",note:st0.note||"",photo_path:path});
    }

    if(jobs.length){
      jobs.forEach(j=>bgDrop(j.key));          // 別跟背景佇列搶著傳同一張
      let done=0; const total=jobs.length;
      setProgress(`上傳照片 0/${total}`);
      const fails=await uploadMany(jobs,()=>{ done++; setProgress(`上傳照片 ${done}/${total}`); });
      jobs.forEach(j=>{ if(j.ok) (draft.up||(draft.up={}))[j.key]=j.path; });
      saveDraftSoon();
      if(fails.length) throw new Error(
        `還有 ${fails.length} 張照片沒傳成功（${fails[0].err||""}）。`+
        `盤點內容已經留著，網路好一點再按一次送出就好，已經傳好的不會重傳。`);
    }
    setProgress("寫入盤點單…");
    const ses=draft.session||"pm";
    // 外勤選的編號：有選編號的項目才送
    const units=[];
    RW().forEach(r=>{
      if(!needUnit(r)) return;
      const a=(draft.units&&draft.units[r.rid])||[];
      a.forEach((v,i)=>{
        if(v==="") return;
        units.push({item_id:r.itemId,item_name:r.name,slot:i,
                    unit_id:(v==="__none")?null:v});
      });
    });
    await rpc("field_submit",{p:{region:REG,vehicle_code:veh,person:draft.person,
      time:nowHM(),photo_mode:S.photoMode,slot,lines,pkg_photos:pkgPhotos,session:ses,
      units}});
    if(units.length) markUnitChecked();
    const bad=lines.filter(l=>l.status!=="正常");
    lastSubmit={vehicle:veh,session:ses,
      bad:bad.map(l=>({name:l.item_name,std:l.std,actual:l.actual,status:l.status}))};
    clearDraft();                               // 送出成功才刪暫存；失敗會留著讓他接續再送
    draft=null; curPkg=firstPkg(); resume=null;
    setProgress(null); busy=false; render();
    toast(`${veh} 車${ses==="am"?"上午場":"下午場"}已送出，${bad.length} 項異常`);
  }catch(e){
    setProgress(null); busy=false; render();
    toast("送出失敗："+(e.message||""));
  }
}

function rangeDates(){
  const t=todayD();
  if(rng.preset==="all")return{from:"1900-01-01",to:"2999-12-31",label:"全部期間"};
  if(rng.preset==="week"){
    const a=new Date(t); a.setDate(a.getDate()-((a.getDay()+6)%7));
    const b=new Date(a); b.setDate(a.getDate()+6);
    return{from:iso(a),to:iso(b),label:"本週"};}
  if(rng.preset==="month"){
    const a=new Date(t.getFullYear(),t.getMonth(),1), b=new Date(t.getFullYear(),t.getMonth()+1,0);
    return{from:iso(a),to:iso(b),label:"本月"};}
  if(rng.preset==="last"){
    const a=new Date(t.getFullYear(),t.getMonth()-1,1), b=new Date(t.getFullYear(),t.getMonth(),0);
    return{from:iso(a),to:iso(b),label:"上個月"};}

function printReport(content){
  try{
    const f=document.createElement("iframe");
    f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(f);
    const d=f.contentWindow.document;
    d.open(); d.write(content); d.close();
    setTimeout(()=>{ f.contentWindow.focus(); f.contentWindow.print();
      setTimeout(()=>f.remove(),1000); },350);
  }catch(e){ toast("無法開啟列印，請改用匯出檔案"); }
}
function download(name,mime,content){
  try{
    const blob=new Blob(["\ufeff"+content],{type:mime+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    toast(`已匯出 ${name}`);
  }catch(e){ toast("匯出失敗，請改用瀏覽器直接開啟本檔案"); }
}

/* ===================== 月報統計 ===================== */
let mTab="lost", mCell="cnt";   // 月報：分頁、格子顯示

/* ---------- 月報期間 ----------
   上半頁（KPI、排行）用「統計期間」，下半頁（趨勢圖、逐月明細）用「趨勢期間」，
   兩個各自獨立，控制項就放在它實際影響的那張卡上。            */
const MPRESETS=[["cur","本月"],["prev","上個月"],["m3","近 3 個月"],
                ["m6","近 6 個月"],["m12","近 12 個月"],["all","全部"],["custom","自訂區間"]];
const TPRESETS=[["m6","近 6 個月"],["m12","近 12 個月"],["all","全部"],["custom","自訂區間"]];
let mPeriod={preset:"cur", from:"", to:""};
let mTrend ={preset:"m12", from:"", to:""};
function setMPeriod(k,v){ mPeriod[k]=v; if(k!=="preset") mPeriod.preset="custom"; render(); }
function setMTrend(k,v){  mTrend[k]=v;  if(k!=="preset") mTrend.preset="custom";  render(); }

// 資料涵蓋的所有月份，中間沒資料的也補齊，趨勢才不會跳月
function allMonths(){
  const set=new Set();
  S.records.forEach(r=>set.add(r.date.slice(0,7)));
  S.moves.forEach(m=>set.add(m.date.slice(0,7)));
  if(!set.size) return [];
  const all=[...set].sort();
  const [y0,m0]=all[0].split("-").map(Number);
  const [y1,m1]=all[all.length-1].split("-").map(Number);
  const seq=[];
  for(let y=y0,m=m0; y<y1||(y===y1&&m<=m1); m++){
    if(m>12){m=1;y++;}
    seq.push(`${y}-${String(m).padStart(2,"0")}`);
  }
  return seq;
}
// spec 可以是數字（最近 N 個月）或期間物件
function periodMonths(spec){
  const seq=allMonths(); if(!seq.length) return [];
  if(typeof spec==="number") return seq.slice(-spec);
  const pr=(spec&&spec.preset)||"all";
  if(pr==="cur")  return seq.slice(-1);
  if(pr==="prev") return seq.length>1?seq.slice(-2,-1):seq.slice(-1);
  if(pr==="m3")   return seq.slice(-3);
  if(pr==="m6")   return seq.slice(-6);
  if(pr==="m12")  return seq.slice(-12);
  if(pr==="custom"){
    const f=spec.from||seq[0], t=spec.to||seq[seq.length-1];
    const lo=f<=t?f:t, hi=f<=t?t:f;
    const r=seq.filter(m=>m>=lo&&m<=hi);
    return r.length?r:seq.slice(-1);
  }
  return seq;
}
// 期間的文字說明，標題上顯示用
function periodLabel(spec){
  const ms=periodMonths(spec); if(!ms.length) return "—";
  const named=(typeof spec==="object")&&(MPRESETS.find(x=>x[0]===spec.preset)||[])[1];
  if(spec&&spec.preset==="cur")  return ms[0];
  if(spec&&spec.preset==="prev") return ms[0];
  if(ms.length===1) return ms[0];
  return `${ms[0]} ~ ${ms[ms.length-1]}`+(named&&spec.preset!=="custom"?`（${named}）`:"");
}
// 期間選擇列
function periodBar(spec, setter, presets){
  const seq=allMonths();
  const f=spec.from||seq[0]||"", t=spec.to||seq[seq.length-1]||"";
  return `<div class="mvf" style="border-bottom:0;background:transparent;padding:0">
    <select class="psel" onchange="${setter}('preset',this.value)">${presets.map(([k,tt])=>
      `<option value="${k}" ${spec.preset===k?"selected":""}>${tt}</option>`).join("")}</select>
    ${spec.preset==="custom"?`<span style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)">
      <input type="month" class="mvdate" value="${f}" min="${seq[0]||""}" max="${seq[seq.length-1]||""}"
        onchange="${setter}('from',this.value)">
      <span>到</span>
      <input type="month" class="mvdate" value="${t}" min="${seq[0]||""}" max="${seq[seq.length-1]||""}"
        onchange="${setter}('to',this.value)"></span>`:""}
  </div>`;
}
const consumOf=k=>{const r=RW().find(x=>cur(x.sku)===k);return r?!!r.consum:false;};
function monthKeys(spec){
  return periodMonths(spec===undefined?mPeriod:spec);
}
function monthlyStats(n){
  // 以實際補料／出入庫為準，每筆只算一次，不會因為連續盤到同一筆而重複
  const ms=monthKeys(n), z=()=>({遺失:0,損壞:0,耗材:0,多出:0,採購:0,製作:0,個人:0});
  const agg={}, byItem={}, byLost={}, byDmg={}, byBuy={}, byCons={};
  ms.forEach(k=>agg[k]=z());
  (S.moves||[]).forEach(m=>{
    const k=(m.date||"").slice(0,7); if(!agg[k])return;
    const sk=m.sku, isC=consumOf(sk), q=m.qty||0;
    if(m.reason==="遺失"||m.reason==="損壞"||m.reason==="遺失或損壞"){
      const kind=(m.reason==="遺失或損壞")?(m.loss||"遺失"):m.reason;
      if(isC){ agg[k].耗材+=q;
        byCons[sk]=byCons[sk]||{}; byCons[sk][k]=(byCons[sk][k]||0)+q; }
      else if(kind==="損壞"){ agg[k].損壞+=q;
        byDmg[sk]=byDmg[sk]||{}; byDmg[sk][k]=(byDmg[sk][k]||0)+q;
        byItem[sk]=byItem[sk]||{}; byItem[sk][k]=(byItem[sk][k]||0)+q; }
      else { agg[k].遺失+=q;
        byLost[sk]=byLost[sk]||{}; byLost[sk][k]=(byLost[sk][k]||0)+q;
        byItem[sk]=byItem[sk]||{}; byItem[sk][k]=(byItem[sk][k]||0)+q; }
    }
    else if(m.reason==="車輛多出繳回") agg[k].多出+=q;
    else if(m.reason==="採購入庫"){ agg[k].採購+=q;
      byBuy[sk]=byBuy[sk]||{}; byBuy[sk][k]=(byBuy[sk][k]||0)+q; }
    else if(m.reason==="個人用品") agg[k].個人+=q;
    else if(m.reason.indexOf("工具製作")===0) agg[k].製作+=q;
  });
  return {ms,agg,byItem,byLost,byDmg,byBuy,byCons};
}

function trend(cur,prev,bad){
  if(prev==null||prev===cur)return {t:"—",c:"var(--muted)"};
  const up=cur>prev, worse=bad?up:false;
  return {t:`${up?"▲":"▼"}${Math.abs(cur-prev)}`,
          c: bad ? (up?"var(--alert)":"var(--ok)") : "var(--muted)"};
}

// 待補明細：盤點自動產生 ＋ 管理者手動輸入
function needList(){
  // 待補料由資料庫直接算（每個品項取「最後一張有盤到它的單」），
  // 畫面與實際扣帳用同一套規則，不會各說各話
  const out=(S.needs||[]).map(n=>({
    key:n.vehicle+"|"+n.sku, vehicle:n.vehicle, sku:n.sku, itemId:n.itemId,
    qty:n.qty, src:`盤點 ${n.kind}${n.done?`（已補 ${n.done}）`:""}${n.session==="am"?"　·　上午場":""}`,
    auto:true}));
  (S.manual||[]).forEach(m=>out.push({key:m.id,vehicle:m.vehicle,sku:m.sku,itemId:m.itemId,qty:m.qty,
    src:m.note?`手動 · ${m.note}`:"手動新增",auto:false,id:m.id}));
  // 已經關掉的車不用再補料（例如固定放甲醛工具的 B 車）
  return out.filter(n=>VEH().indexOf(n.vehicle)>=0);
}

function needByVehicle(){const g={};

   （標配說每台車帶 1 個，但實際上空著的車不該被編出假編號）
   =================================================================== */
let plan=null;   /* {d, kind, veh:{}, wh, abbr, busy} */
/* 分配表關掉（不管是確定還是取消）：回到庫存清單原本捲到的位置，剛改的那一列閃一下 */
function planClose(){
  const y=planY; plan=null; planY=null; render();

  setTimeout(()=>{lastEd=null;},50);

let planY=null;

async function planOpen(itemId, kind, abbr){
  await guard(async()=>{
    const d=await rpc("mgr_unit_plan",{p_token:token,p_item:itemId,p_kind:kind||null});
    const veh={};
    (d.vehicles||[]).forEach(v=>{
      // 已經有編號的沿用現況，沒有的用建議值
      veh[v.code] = Number(v.now)>0 ? Number(v.now) : Number(v.suggest)||0;
    });
    plan={d:d, kind:kind||d.kind, veh:veh,
          wh:Number(d.wh_now)>0?Number(d.wh_now):Number(d.warehouse)||0,
          abbr:(abbr!==undefined&&abbr!==null)?abbr:(d.abbr||""), busy:false};
    editSku=null; window.scrollTo(0,0); render();
  });
}
function planSet(code,v){ plan.veh[code]=Math.max(0,parseInt(v)||0); render(); }
function planStep(code,d){ plan.veh[code]=Math.max(0,(plan.veh[code]||0)+d); render(); }
function planWh(v){ plan.wh=Math.max(0,parseInt(v)||0); render(); }
function planWhStep(d){ plan.wh=Math.max(0,(plan.wh||0)+d); render(); }
function planTotal(){ return Object.values(plan.veh).reduce((a,b)=>a+b,0)+(plan.wh||0); }
function planSuggest(){
  (plan.d.vehicles||[]).forEach(v=>plan.veh[v.code]=Number(v.suggest)||0);
  plan.wh=Number(plan.d.warehouse)||0; render();
}
function planZero(){ Object.keys(plan.veh).forEach(k=>plan.veh[k]=0); render(); }

async function planSave(){

  if(free && !confirm(`會先刪掉 ${free} 個還沒有紀錄的編號，再照新的分配重編。\n確定嗎？`)) return;
  await guard(async()=>{

/* 一台車給誰用：'self'＝這一區自己（驗屋）、'off'＝都不用、其他＝部門區代號（例：甲醛） */
function vehUse(v){
  const L=(S.vehicleLend||{})[v]; if(L) return L;
  return (S.vehicleOn||{})[v]!==false?"self":"off";
}
async function vehAssign(v,to){
  const id=(S.vehicleIds||{})[v]; if(!id) return;
  const cur=vehUse(v); if(cur===to) return;
  const n=(S.vehicleUnits||{})[v]||0, D=DEPT();
  let msg;
  if(to==="self"){
    msg=`把 ${v} 車改回「${D}」使用？`;
    if(cur!=="off"&&cur!=="self") msg+=`\n\n${regName(cur)}那邊的 ${v} 車會收起來，`
      +`車上掛的編號收回${regName(cur)}的公司庫存並留下紀錄；${regName(cur)}的歷史紀錄照樣查得到。`;
  }else if(to==="off"){
    msg=`把 ${v} 車改成「都不用」？\n\n`
      +`· 不列入標配，也不會算車上數量\n· 外勤盤點選不到這台車\n· 不會出現在待補料\n`
      +`· 歷史紀錄照樣查得到，車輛管理系統不受影響`;
  }else{
    msg=`把 ${v} 車切換給「${regName(to)}」使用？\n\n`
      +`· ${D}這邊不列入標配、車上數量、盤點與待補料\n`
      +`· ${regName(to)}那邊會出現這台車，讓他們設定車上放哪些設備\n`
      +`· 出車紀錄、悠遊卡照常登記，車輛管理系統不受影響`;
  }
  if(n&&cur==="self") msg+=`\n\n這台車上目前掛著 ${n} 個編號，會用「車輛多出繳回」收回公司庫存並留下紀錄。`;
  if(!confirm(msg)) return render();
  const note=to==="off"?(prompt(`${v} 車不用的原因（選填，會顯示在設定頁）`,vehNote(v)||"")||""):null;
  await guard(async()=>{
    const r=await rpc("mgr_vehicle_assign",{p_token:token,p_id:id,p_to:to,p_note:note});
    ISO=null; await reload(); render();
    const back=(r&&r.back)||0;
    toast((to==="self"?`${v} 車改回${D}使用`
          :to==="off"?`${v} 車已改成都不用`
          :`${v} 車已切換給${regName(to)}${r&&r.code&&r.code!==v?`（那邊叫 ${r.code} 車）`:""}`)

             "車輛多出繳回":"back","遺失":"pick","損壞":"pick","遺失或損壞":"pick",

/* 建議的下幾個編號：接在最後一個後面，數字位數照舊 */
function mvSuggestNos(n){
  const it=itemOf(mv.sku); if(!it) return [];
  const last=mvLastNo();
  let pre, num, w;
  const m=last&&last.match(/^(.*?)(\d+)$/);
  if(m){ pre=m[1]; num=parseInt(m[2],10); w=m[2].length; }
  else { pre=(it.abbr||it.sku.slice(0,2))+"-"; num=0; w=2; }
  const used=new Set(UNITS().map(u=>u.no)), out=[];
  while(out.length<n){ num++; const s=pre+String(num).padStart(w,"0"); if(!used.has(s)) out.push(s); }
  return out;
}
function mvLastNo(){
  const it=itemOf(mv.sku); if(!it) return "";
  const us=unitsOf(it.id).slice().sort((a,b)=>a.no.localeCompare(b.no,"zh-Hant",{numeric:true}));
  return us.length?us[us.length-1].no:"";
}

  if(umPick&&!picked.length)return toast("請勾選是哪幾台要調動");
  const q=umPick?picked.length:Number(mv.qty);
  if(!um&&(S.warehouse[mv.sku]||0)+d.wh*q<0)return toast("倉庫庫存不足");
  let manual=null;
  if(um==="new"&&mv.noMode==="manual"){
    manual=(mv.nos||[]).slice(0,q).map(x=>String(x||"").trim());
    if(manual.length<q||manual.some(x=>!x)) return toast("手動編號每一台都要填");
    if(new Set(manual).size<manual.length) return toast("手動編號裡有重複的號碼");
    const taken=manual.find(x=>UNITS().some(u=>u.no===x));
    if(taken) return toast(`編號「${taken}」已經有人用了`);
  }
  await guard(async()=>{
    await rpc("mgr_move",{p_token:token,p_item:it.id,p_type:mv.type,p_reason:mv.reason,
      p_qty:q,p_vehicle:d.needV?v:null,p_note:mv.note.trim(),
      p_loss:null,p_units:umPick?picked:manual});
    const nm=mv.sku, nos=umPick?picked.map(id=>{
      const u=UNITS().find(x=>x.id===id); return u?u.no:"";}).filter(Boolean).join("、"):"";
    mv.qty=1; mv.note=""; mv.nos=null; mvClearUnits(); ISO=null;
    await reload(); render();
    toast(nos?`${nm} ${mv.reason}：${nos}，倉庫剩 ${S.warehouse[nm]}`
             :`${nm} ${mv.reason} ${q}，倉庫剩 ${S.warehouse[nm]}`);
  });
}

  /* 一台車一格，上午／下午各一個點 */

        return a.vehicle.localeCompare(b.vehicle,"zh-Hant",{numeric:true}); }
      const v=a.vehicle.localeCompare(b.vehicle,"zh-Hant",{numeric:true}); if(v) return v;
      return tkey(a).localeCompare(tkey(b));});

  let hist="";
  if(rVeh){

    hist=ds.map(d=>{

      return `<button class="row2" onclick="setRDate('${d}')">
        <span class="bd2"><span class="t">${d.slice(5).replace("-","/")}　${wdayOf(d)}</span>
          <span class="s">${rs.length} 場　·　${bad?`${bad} 項異常`:"全部正常"}</span></span>
        <span class="go">›</span></button>`;}).join("");
  }

  const yest=(()=>{const d=new Date(D);d.setDate(d.getDate()-1);

  return `<div class="wrap wide">

    </div>

    <div class="numrow" style="margin-bottom:13px">
      <div><i>上午場</i><b>${amDone}<s>/${vs.length}</s></b></div>
      <div><i>下午場</i><b>${pmDone}<s>/${vs.length}</s></b></div>
      <div><i>異常</i><b${dayAb?' style="color:var(--bad)"':''}>${dayAb}</b></div>
    </div>


    <div class="card"><div class="hd"><h2>各車狀態</h2>
      <span class="lbl" style="margin-left:auto">${
        rVeh?`只看 ${rVeh} 車`:"點一台車只看它"}</span></div>
      <div class="bd"><div class="vgrid">${tiles}</div>

    ${show.length?`<div class="card"><div class="hd"><h2>${
        rVeh?`${rVeh} 車的單子`:"每一張盤點單"}</h2>
      <span class="lbl" style="margin-left:auto">${show.length} 張${

      <div class="bd" style="padding-bottom:0"><div class="iseg" style="margin:0;max-width:260px">
        <button aria-pressed="${rSort!=="time"}" onclick="rSort='veh';render()">依車號</button>

      <div class="bd nopad" style="margin-top:12px">${show.map(r=>{

        const no=rs.filter(r=>needsNo(r.kind||"tool")).length;
        return `<button class="row2" onclick="openPage('pkg','${p.id}')">
          <span class="bd2"><span class="t">${esc(p.name)}</span>
            <span class="s">${rs.length?`每車 ${std} 件${no?`　·　${no} 項要對編號`:""}`
              :"還沒放任何東西，外勤看不到這一包"}</span></span>
          <span class="q"><b>${rs.length}</b><i>項</i></span>
          <span class="go">›</span></button>`;}).join("")
        ||`<div class="empty"><b>還沒有任何包別</b>先建一個包別，再把品項放進去。</div>`}</div>
    </div>

    ${multi.length?`<div class="card"><div class="hd"><h2>同一樣東西放在多個包別</h2>
      <span class="lbl" style="margin-left:auto">${multi.length} 項</span></div>
      <div class="bd"><span class="lbl">這不一定是錯的（例如手電筒上下層都放），
        但外勤會盤到兩次，待補料也會分開算。確認一下是不是故意的：</span>
        <div class="chips" style="margin-top:10px">${multi.map(k=>
          `<span class="chip ro">${esc(k)}</span>`).join("")}</div></div></div>`:""}

    <div class="card"><div class="hd"><h2>新增包別</h2></div><div class="bd">
      <div class="g2">
        <input type="text" value="${esc(nPkg)}" placeholder="例：空調檢測包" onchange="nPkg=this.value">
        <button class="btn" onclick="addPkg()">建立</button></div>
      <div class="lbl" style="margin-top:9px">包別就是車上的一個箱子或一袋工具，
        外勤盤點時會一包一包對。</div>
    </div></div>
    <div style="height:16px"></div>
  </div>`;
}

/* ---- 單一包別 ---- */
function viewPkgPage(id){
