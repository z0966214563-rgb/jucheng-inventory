<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
html{-webkit-text-size-adjust:100%}

header.top .sw{margin-left:auto;background:none;border:1px solid #4A525C;color:#C7CCD2;border-radius:3px;

.wrap{max-width:560px;margin:0 auto;padding:14px 14px 26px}
.wide{max-width:860px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);display:grid;

nav.tabs button[aria-selected="true"]{color:#fff;border-top-color:var(--amber)}

.card{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:12px}
.card .hd{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}

input[type=text],input[type=number],select,textarea{width:100%;font-family:var(--tc);font-size:16px;

input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:17px;font-weight:600;min-width:52px;height:48px;border:1px solid var(--line);
  background:#fff;border-radius:3px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--tc);font-weight:700;
  font-size:15px;padding:13px 18px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241A00}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.tiny{padding:5px 9px;font-size:11.5px;font-weight:500}

.btn.block{display:flex;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.gate{max-width:420px;margin:0 auto;padding:34px 18px}

.role{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);

.role.amber{border-left-color:var(--amber)}

.shotbtn{width:62px;height:62px;flex:0 0 62px;border:1px dashed var(--line);border-radius:3px;background:#F7F8FA;

.shotbtn.has{border-style:solid;border-color:var(--ok)}

.tag.c{border-color:#9AA2AC;color:#5C636D;background:#F1F3F5}
.stat{font-family:var(--tc);font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;

.stat.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stat.bad{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}

.pick{display:flex;gap:5px;flex:0 0 auto}
.pk{width:54px;height:46px;border:1px solid var(--line);background:#fff;border-radius:3px;

.pk.bad.on{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}

@media (max-width:360px){.pk{width:48px;font-size:12px}}
.panel{background:#FBFCFD;border-top:1px solid var(--line2);padding:12px 14px 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.seg button{padding:11px 4px;font-family:var(--tc);font-size:14px;font-weight:700;border:1px solid var(--line);

.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;font-size:22px;border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;font-family:var(--mono)}
.step input{width:76px;text-align:center;font-family:var(--mono);font-size:19px;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr:nth-of-type(even) td{background:#FBFCFD}
tr.warn td,tr.warn:nth-of-type(even) td{background:#FDF1EF}
tr.edit td{background:#FFFBF0!important;padding:16px 14px}
th{background:#F7F8FA;white-space:nowrap;padding:9px 12px}
th.n{text-align:right}
td{padding:10px 12px}
td.n{font-size:14px}
.tw{overflow-x:auto}
.c-name{line-height:1.35}
.c-num{font-weight:700}
.c-act{text-align:right;white-space:nowrap}
.c-act .btn{margin-left:4px}
.c-loc{font-size:12.5px;letter-spacing:.04em;color:#3A424C}
.c-loc.un{color:var(--muted)}
th.c-loc{color:var(--muted);background:#F7F8FA}
.stats{display:flex;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line2);padding:18px 16px 20px}

.stats>div .lbl{line-height:1.5}
.stats .fig{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.1;margin-top:10px}
.foot{padding:11px 14px;border-top:1px solid var(--line2);background:#FBFCFD}
.prev{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:3px;

.prevrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line2)}

.err{color:var(--alert);font-size:12.5px;font-weight:700;margin-top:7px}
.bar{height:5px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:4px;min-width:64px}

.pill{font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:2px}
.pill.in{background:var(--ok-bg);color:var(--ok)} .pill.out{background:#EEF1F4;color:#4A525C}

.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.vcard{border:1px solid var(--line);border-radius:3px;background:#fff;padding:11px 12px;border-left:4px solid var(--ok)}
.vcard.amber{border-left-color:var(--amber)} .vcard.red{border-left-color:var(--alert)}
.vcard .id{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1}
.vcard .st{font-size:12.5px;font-weight:700;margin-top:5px}
.vcard .who{font-size:11.5px;color:var(--muted);margin-top:3px}
.thumbs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px}
.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:2px;border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:99;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:3px;font-size:14px;font-weight:700;border-left:4px solid var(--amber);max-width:88%}
.rechd{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:0;border-bottom:1px solid var(--line2);
  padding:12px 14px;cursor:pointer;font-family:var(--tc);color:var(--ink)}
.rechd .caret{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.pkgblk{border-top:1px solid var(--line2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;padding:4px 14px 12px}
.cell{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff;cursor:pointer}
.cell.bad{border-color:var(--alert);border-width:2px}
.cell img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cell .nopic{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:#F1F3F5;color:var(--muted);font-size:11px}
.cell .cap{font-size:11.5px;font-weight:500;padding:4px 5px 0;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cap2{font-family:var(--mono);font-size:10px;color:var(--muted);padding:1px 5px 5px}
.cell.bad .cap2{color:var(--alert);font-weight:600}
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,12,15,.9);display:flex;align-items:center;
  justify-content:center;padding:16px}
.lbbox{background:#fff;border-radius:3px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.lbbox img{width:100%;display:block;background:#000}
.lbinfo{padding:12px 14px}
.lbbar{display:flex;gap:8px;padding:0 14px 14px;justify-content:space-between}
.req{color:var(--alert);font-size:12px;font-weight:700}
.pkgshot{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--line2);align-items:flex-start}
.bigshot{width:96px;height:96px;flex:0 0 96px;border:1px dashed var(--line);border-radius:3px;background:#F7F8FA;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative}
.bigshot.has{border-style:solid;border-color:var(--ok)}
.bigshot img{width:100%;height:100%;object-fit:cover}
.bigshot .cam{font-size:26px;color:var(--muted);line-height:1}
.bigshot .ct{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:700}
.bigshot .redo{position:absolute;right:0;bottom:0;background:rgba(21,24,28,.82);color:#fff;
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 5px}
.pkgtip{flex:1;min-width:0;font-size:13px}
.hide{display:none!important}
</style>

<script>
/* ===================== 資料來源：全部來自雲端 ===================== */
const RW=()=>(S&&S.rows)?S.rows:[];

const ALLSKU=()=>ITEMS().map(i=>i.sku);

// 下拉選單依儲位順序排列，方便照著貨架找東西
const ITEMS_BY_LOC=()=>ITEMS().slice().sort((a,b)=>{
  const d=locRank(a.loc)-locRank(b.loc); return d!==0?d:a.sku.localeCompare(b.sku,"zh-Hant");});
const cur=k=>k;

const NEEDM=()=>{const m={};RW().forEach(r=>{m[r.sku]=(m[r.sku]||0)+r.std;});return m;};
const LOCS=["未設定"].concat(Array.from({length:18},(_,i)=>String(i+1)))
  .concat(["貨架上方","陽台","廁所浴缸"]).concat("ABCDEFGHIJ".split(""));
const REGION="北區";

/* ===================== 雲端連線層 ===================== */
const SB_URL="https://tekawiwxutfpkyufooet.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRla2F3aXd4dXRmcGt5dWZvb2V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjE2OTIsImV4cCI6MjEwMjY5NzY5Mn0.cA0pXAW0K4EpErrSL2HqrndcQc07u_n0brHHh1ms1_A";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};

async function rpc(fn,args){
  const res=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,
    {method:"POST",headers:H,body:JSON.stringify(args||{})});
  const txt=await res.text();
  if(!res.ok){
    let msg=txt; try{const j=JSON.parse(txt); msg=j.message||j.hint||txt;}catch(e){}
    throw new Error(msg);
  }
  return txt?JSON.parse(txt):null;
}
async function uploadPhoto(path,dataUrl){
  const blob=await (await fetch(dataUrl)).blob();
  const res=await fetch(`${SB_URL}/storage/v1/object/count-photos/${encodeURI(path)}`,
    {method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,
      "x-upsert":"true","Content-Type":"image/jpeg"},body:blob});
  if(!res.ok) throw new Error("照片上傳失敗："+(await res.text()));
  return path;
}
async function signUrls(paths){
  const list=[...new Set(paths.filter(Boolean))];
  if(!list.length) return {};
  try{
    const res=await fetch(`${SB_URL}/storage/v1/object/sign/count-photos`,
      {method:"POST",headers:H,body:JSON.stringify({paths:list,expiresIn:3600})});
    if(!res.ok) return {};
    const arr=await res.json(), map={};
    arr.forEach(x=>{const u=x.signedURL||x.signedUrl; if(u) map[x.path]=SB_URL+"/storage/v1"+u;});
    return map;
  }catch(e){ return {}; }
}

  return {warehouse:{},safety:{},onCar:{},records:[],moves:[],manual:[],
          items:[],rows:[],pkgs:[],vehicles:[],admins:[],alias:{},price:{},photoMode:"pkg"};
}
function applyConfig(cfg){
  S=S||blankState();
  S.photoMode=cfg.photo_mode||"pkg";
  S.pkgs=(cfg.packages||[]).map(p=>({id:p.id,name:p.name}));
  S.vehicles=cfg.vehicles||[];
  S.rows=(cfg.rows||[]).map(r=>({rid:r.id,pkg:r.package_id,pkgName:r.package_name,
    name:r.name,sku:r.name,itemId:r.item_id,std:r.std,
    valuable:!!r.valuable,consum:!!r.consumable}));
}
async function applyState(st,urls){
  S=blankState();
  S.photoMode=(st.settings&&st.settings.photo_mode)||"pkg";
  KEEP=(st.settings&&st.settings.keep_sets)||4;
  S.items=(st.items||[]).map(i=>({sku:i.name,id:i.id,loc:i.loc,std:i.std,base:i.base}));
  (st.items||[]).forEach(i=>{S.warehouse[i.name]=i.warehouse;S.safety[i.name]=i.safety;});
  S.pkgs=(st.packages||[]).map(p=>({id:p.id,name:p.name}));
  S.rows=(st.rows||[]).map(r=>({rid:r.id,pkg:r.package_id,pkgName:r.package_name,
    name:r.name,sku:r.name,itemId:r.item_id,std:r.std,
    valuable:!!r.valuable,consum:!!r.consumable}));
  S.vehicles=(st.vehicles||[]).map(v=>v.code);
  S.vehicleIds={}; (st.vehicles||[]).forEach(v=>S.vehicleIds[v.code]=v.id);

  }));
  S.moves=(st.moves||[]).map(m=>({id:m.id,date:m.date,type:m.type,sku:m.item,qty:m.qty,

async function reload(){
  const st=await rpc("mgr_state",{p_token:token,p_days:400});
  const paths=[];
  (st.sheets||[]).forEach(x=>{
    (x.pkg_photos||[]).forEach(p=>paths.push(p.photo));
    (x.photo_lines||[]).forEach(l=>paths.push(l.photo));
    (x.lines||[]).forEach(l=>{if(l.photo)paths.push(l.photo);});
  });
  await applyState(st,await signUrls(paths));
}

const newDraft=()=>({person:"",vehicle:"",date:today(),items:{},pkgPhoto:{},pkgPhotoByName:{}});
function st(rid){ if(!draft.items[rid])draft.items[rid]={status:"pending",type:"",actual:null,note:"",photo:null,open:false};
  return draft.items[rid]; }
const pkgRows=id=>RW().filter(r=>r.pkg===id);

function pkgStat(id){const rs=pkgRows(id);let d=0,b=0;
  rs.forEach(r=>{const s=draft.items[r.rid];
    if(!s)return;
    const done = byItem() ? !!s.photo : s.status!=="pending";
    if(done){d++;if(s.status==="abnormal")b++;}});
  if(!rs.length) return{done:0,bad:0,total:0,photo:true,ok:true};   // 空包別直接視為完成
  const photo=byItem()?true:!!draft.pkgPhoto[id];
  return{done:d,bad:b,total:rs.length,photo,ok:(d===rs.length)&&photo};}
const doneCount=()=>PKGS().filter(p=>pkgStat(p.id).ok).length;
const allDone=()=>doneCount()===PKGS().length;

function rowHTML(r){
  const s=st(r.rid);
  const tags=(r.valuable?`<span class="tag v">貴重</span>`:"")+(r.consum?`<span class="tag c">耗材</span>`:"");
  const cls=s.status==="ok"?"ok":s.status==="abnormal"?"bad":"";
  const txt=s.status==="ok"?"正常":s.status==="abnormal"?(s.type||"異常"):(byItem()?"待拍照":"待確認");
  let panel="";
  if(s.status==="abnormal"&&s.open){
    panel=`<div class="panel">
      <div class="seg">${["短缺","損壞","多出"].map(t=>`<button aria-pressed="${s.type===t}" onclick="setType('${r.rid}','${t}')">${t}</button>`).join("")}</div>
      ${s.type?`<div class="lbl" style="margin-bottom:6px">${s.type==="損壞"?"損壞數量":"實際數量"}（標配 ${r.std}）</div>
      <div class="step"><button onclick="bump('${r.rid}',-1)">−</button>
        <input class="num" type="number" value="${s.actual===null?"":s.actual}" oninput="setActual('${r.rid}',this.value)">
        <button onclick="bump('${r.rid}',1)">＋</button>
        <span class="num" style="color:var(--alert);font-weight:600">${diffText(r,s)}</span></div>

      ${byItem()?"":`<div class="shot">
        ${s.photo?`<img src="${s.photo}">`:""}
        <label class="btn ghost sm" style="cursor:pointer">${s.photo?"重拍":"拍這一項"}
          <input type="file" accept="image/*" capture="environment" class="hide" onchange="shoot('${r.rid}',this)"></label>
        ${s.photo?"":`<span class="req">異常項目需拍照</span>`}
      </div>`}`
      :`<div class="lbl">請選擇異常類型</div>`}
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn sm" onclick="closePanel('${r.rid}')">完成這項</button>
        <button class="btn ghost sm" onclick="setOK('${r.rid}')">改回正常</button></div>
    </div>`;
  }
  const shotCell = byItem() ? `<label class="shotbtn ${s.photo?"has":""}">
      ${s.photo?`<img src="${s.photo}"><span class="redo">重拍</span>`:`<span class="cam">▣</span>`}
      <input type="file" accept="image/*" capture="environment" class="hide" onchange="shoot('${r.rid}',this)">
    </label>` : "";
  const lock = byItem() && !s.photo;
  const meta = s.status==="abnormal" && s.actual!==null
    ? `標配 ${r.std}　→　${s.type==="損壞"?`損壞 ${s.actual}`:`實有 ${s.actual}`}`

  return `<div>

          onclick="markOK('${r.rid}')">正常</button>

          onclick="markBad('${r.rid}')">${s.status==="abnormal"?(s.type||"異常"):"異常"}</button>
      </div>
    </div>${panel}</div>`;
}
function diffText(r,s){ if(s.actual===null||s.actual==="")return"";
  if(s.type==="損壞")return`損壞 ${s.actual}`;
  const d=Number(s.actual)-r.std;return d===0?"與標配相同":(d>0?`多 ${d}`:`缺 ${-d}`);}

function pickV(v){draft.vehicle=draft.vehicle===v?"":v;render();}
function firstPkg(){
  const p=PKGS().find(x=>pkgRows(x.id).length)||PKGS()[0];
  return p?p.id:null;
}
function startCount(){const n=document.getElementById("pname");if(n)draft.person=n.value.trim();
  if(!draft.person)return toast("請先填盤點人姓名");
  if(!draft.vehicle)return toast("請選擇車別");
  curPkg=firstPkg();render();}
function shrink(f,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();
  img.onload=()=>{const m=320,sc=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.5));};
  img.src=fr.result;};fr.readAsDataURL(f);}
function shoot(rid,inp){ if(!inp.files[0])return;
  shrink(inp.files[0],d=>{const x=st(rid);x.photo=d;
    if(byItem()&&x.status==="pending")x.status="ok"; render();});}
function shootPkg(inp){ if(!inp.files[0]||!pkgRows(curPkg).length)return;
  shrink(inp.files[0],d=>{ draft.pkgPhoto[curPkg]=d;
    draft.pkgPhotoByName[pkgName(curPkg)]=d; render();});}

  if(s.type==="多出"&&Number(s.actual)<=r.std)return toast("多出的實際數量要大於標配");

function resetDraft(){if(confirm("清空目前這張盤點單？")){draft=newDraft();curPkg=firstPkg();render();}}
async function submitCount(){
  if(busy)return;
  for(const p of PKGS()){
    if(!pkgRows(p.id).length) continue;
    if(!byItem()&&!draft.pkgPhoto[p.id]){curPkg=p.id;render();return toast(`「${p.name}」還沒拍本包照片`);}
    const t=pkgStat(p.id);
    if(t.done<t.total){curPkg=p.id;render();
      return toast(`「${p.name}」還有 ${t.total-t.done} 項${byItem()?"未拍照":"未確認"}`);}
  }
  for(const r of RW()){const s=draft.items[r.rid];
    if(s.status==="abnormal"&&(!s.type||s.actual===null)){curPkg=r.pkg;s.open=true;render();return toast(`「${r.name}」尚未填完`);}
    if(s.status==="abnormal"&&!s.photo){curPkg=r.pkg;s.open=true;render();return toast(`「${r.name}」缺照片`);}}

  busy=true; render();
  try{
    const veh=draft.vehicle;
    const slot=await rpc("field_next_slot",{p_vehicle:veh});
    const base=`${veh}/${slot}`;
    let done=0;
    const total=(byItem()?RW().filter(r=>draft.items[r.rid].photo).length
                        :PKGS().filter(p=>draft.pkgPhoto[p.id]).length)
               +RW().filter(r=>draft.items[r.rid].status==="abnormal"&&draft.items[r.rid].photo&&!byItem()).length;
    const tick=()=>{done++; setProgress(`上傳照片 ${done}/${total}`);};

    const pkgPhotos=[];
    if(!byItem()){
      for(const p of PKGS()){
        const img=draft.pkgPhoto[p.id]; if(!img) continue;
        const path=`${base}/pkg-${p.id}.jpg`;
        await uploadPhoto(path,img); tick();
        pkgPhotos.push({package_name:p.name,photo_path:path});
      }
    }
    const lines=[];
    for(const r of RW()){
      const st0=draft.items[r.rid];
      const ab=st0.status==="abnormal";
      const actual=ab?Number(st0.actual):r.std;
      let path=null;
      if(st0.photo && (byItem()||ab)){
        path=`${base}/item-${r.rid}.jpg`;
        await uploadPhoto(path,st0.photo); tick();
      }
      lines.push({item_name:r.name,package_name:r.pkgName,std:r.std,actual,
        status:ab?st0.type:"正常",note:st0.note||"",photo_path:path});
    }
    setProgress("寫入盤點單…");
    await rpc("field_submit",{p:{vehicle_code:veh,person:draft.person,
      time:nowHM(),photo_mode:S.photoMode,slot,lines,pkg_photos:pkgPhotos}});
    const n=lines.filter(l=>l.status!=="正常").length;
    draft=null; curPkg=firstPkg();
    setProgress(null); busy=false; render();
    toast(`${veh} 車已送出，${n} 項異常`);
  }catch(e){
    setProgress(null); busy=false; render();
    toast("送出失敗："+(e.message||""));
  }
}

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function todayD(){const [y,m,d]=today().split("-").map(Number);return new Date(y,m-1,d);}
function rangeDates(){
  const t=todayD();
  if(rng.preset==="all")return{from:"1900-01-01",to:"2999-12-31",label:"全部期間"};
  if(rng.preset==="week"){
    const a=new Date(t); a.setDate(a.getDate()-((a.getDay()+6)%7));
    const b=new Date(a); b.setDate(a.getDate()+6);
    return{from:iso(a),to:iso(b),label:"本週"};}
  if(rng.preset==="month"){
    const a=new Date(t.getFullYear(),t.getMonth(),1), b=new Date(t.getFullYear(),t.getMonth()+1,0);
    return{from:iso(a),to:iso(b),label:"本月"};}
  if(rng.preset==="last"){
    const a=new Date(t.getFullYear(),t.getMonth()-1,1), b=new Date(t.getFullYear(),t.getMonth(),0);
    return{from:iso(a),to:iso(b),label:"上個月"};}
  return{from:rng.from||"1900-01-01",to:rng.to||"2999-12-31",label:"自訂區間"};
}

function printReport(content){
  try{
    const f=document.createElement("iframe");
    f.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    document.body.appendChild(f);
    const d=f.contentWindow.document;
    d.open(); d.write(content); d.close();
    setTimeout(()=>{ f.contentWindow.focus(); f.contentWindow.print();
      setTimeout(()=>f.remove(),1000); },350);
  }catch(e){ toast("無法開啟列印，請改用匯出檔案"); }
}
function download(name,mime,content){
  try{
    const blob=new Blob(["\ufeff"+content],{type:mime+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    toast(`已匯出 ${name}`);
  }catch(e){ toast("匯出失敗，請改用瀏覽器直接開啟本檔案"); }
}

let mRange=6;   // 顯示最近幾個月
const consumOf=k=>{const r=RW().find(x=>cur(x.sku)===k);return r?!!r.consum:false;};
function monthKeys(){
  const set=new Set();
  S.records.forEach(r=>set.add(r.date.slice(0,7)));
  S.moves.forEach(m=>set.add(m.date.slice(0,7)));
  if(!set.size) return [];
  const all=[...set].sort();
  // 補齊中間沒有資料的月份，趨勢才不會跳月
  const [y0,m0]=all[0].split("-").map(Number);
  const [y1,m1]=all[all.length-1].split("-").map(Number);
  const seq=[];
  for(let y=y0,m=m0; y<y1||(y===y1&&m<=m1); m++){
    if(m>12){m=1;y++;}
    seq.push(`${y}-${String(m).padStart(2,"0")}`);
  }
  return mRange==="all"?seq:seq.slice(-mRange);
}
function monthlyStats(){
  // 以實際補料／出入庫為準，每筆只算一次，不會因為連續盤到同一筆而重複
  const ms=monthKeys(), z=()=>({遺失:0,損壞:0,耗材:0,多出:0,採購:0,製作:0,個人:0});
  const agg={}, byItem={}, byBuy={};
  ms.forEach(k=>agg[k]=z());
  (S.moves||[]).forEach(m=>{
    const k=(m.date||"").slice(0,7); if(!agg[k])return;
    const sk=m.sku, isC=consumOf(sk), q=m.qty||0;
    if(m.reason==="遺失或損壞"){
      if(isC){ agg[k].耗材+=q; }
      else if(m.loss==="損壞"){ agg[k].損壞+=q;
        byItem[sk]=byItem[sk]||{}; byItem[sk][k]=(byItem[sk][k]||0)+q; }
      else { agg[k].遺失+=q;
        byItem[sk]=byItem[sk]||{}; byItem[sk][k]=(byItem[sk][k]||0)+q; }
    }
    else if(m.reason==="車輛多出繳回") agg[k].多出+=q;
    else if(m.reason==="採購入庫"){ agg[k].採購+=q;
      byBuy[sk]=byBuy[sk]||{}; byBuy[sk][k]=(byBuy[sk][k]||0)+q; }
    else if(m.reason==="個人用品") agg[k].個人+=q;
    else if(m.reason.indexOf("工具製作")===0) agg[k].製作+=q;
  });
  return {ms,agg,byItem,byBuy};
}

function trend(cur,prev,bad){
  if(prev==null||prev===cur)return {t:"—",c:"var(--muted)"};
  const up=cur>prev, worse=bad?up:false;
  return {t:`${up?"▲":"▼"}${Math.abs(cur-prev)}`,
          c: bad ? (up?"var(--alert)":"var(--ok)") : "var(--muted)"};
}

const abLines=r=>r.lines.filter(l=>l.type!=="正常");
// 待補明細：盤點自動產生 ＋ 管理者手動輸入
function needList(){
  const out=[];
  // 每台車只看「最後一次」盤點，避免同一筆短缺被重複累加
  const latest={};
  S.records.forEach(r=>{ if(!latest[r.vehicle]||r.ts>latest[r.vehicle].ts) latest[r.vehicle]=r; });
  Object.values(latest).filter(r=>!r.fixed).forEach(r=>abLines(r).forEach(l=>{
    if(l.type==="多出")return;
    const q=l.type==="損壞"?l.actual:(l.std-l.actual); if(q<=0)return;
    out.push({key:r.id+"|"+l.sku,vehicle:r.vehicle,sku:cur(l.sku),qty:q,
              src:`${r.date} 盤點 ${l.type}`,auto:true});}));
  (S.manual||[]).forEach(m=>out.push({key:m.id,vehicle:m.vehicle,sku:m.sku,qty:m.qty,
    src:m.note?`手動 · ${m.note}`:"手動新增",auto:false,id:m.id}));
  return out;
}
function needByVehicle(){const g={};
  needList().forEach(n=>{(g[n.vehicle]=g[n.vehicle]||[]).push(n);});return g;}
function needBySku(){const m={};
  needList().forEach(n=>{if(!m[n.sku])m[n.sku]={sku:n.sku,qty:0,cars:{}};
    m[n.sku].qty+=n.qty;m[n.sku].cars[n.vehicle]=(m[n.sku].cars[n.vehicle]||0)+n.qty;});
  return Object.values(m).sort((a,b)=>b.qty-a.qty);}

async function addManual(){

/* ---- 頁面②：庫存總表 ---- */


function locRank(l){const i=LOCS.indexOf(l);return i<=0?9999:i;}
function viewStock(){
  const ni=nItem;
  const sorted=ITEMS().slice().sort((a,b)=>{
    const d=locRank(a.loc)-locRank(b.loc); return d!==0?d:a.sku.localeCompare(b.sku,"zh-Hant");});
  let rows="";
  sorted.forEach(it=>{
    const k=it.sku, h=S.warehouse[k]||0, sf=S.safety[k]||0;
    const pct=sf?Math.min(100,Math.round(h/sf*100)):100;
    if(editSku===k){
      rows+=`<tr class="edit"><td colspan="5">
        <div class="lbl" style="margin-bottom:9px">編輯品項　·　改名會同步更新盤點項目</div>
        <div class="g2">
          <label class="f"><span class="lbl">品項名稱</span><input type="text" id="e_name" value="${k}"></label>
          <label class="f"><span class="lbl">擺放位置</span>
            <select id="e_loc">${LOCS.map(l=>`<option ${l===it.loc?"selected":""}>${l}</option>`).join("")}</select></label>
        </div>
        <label class="f"><span class="lbl">安全庫存</span>
          <input type="number" min="0" id="e_safe" class="num" value="${sf}"></label>
        <div class="g2"><button class="btn" onclick="saveEdit('${k}')">儲存</button>
          <button class="btn ghost" onclick="editSku=null;render()">取消</button></div>
      </td></tr>`;
      return;
    }
    rows+=`<tr class="${h<sf?"warn":""}">
      <td class="c-name">${k}
        <div class="bar"><i class="${h<sf?"low":""}" style="width:${pct}%"></i></div></td>
      <td class="c-loc num${it.loc==="未設定"?" un":""}">${it.loc}</td>
      <td class="n c-num">${h}</td>
      <td class="n c-num" style="color:var(--muted)">${sf}</td>
      <td class="c-act">
        <button class="btn ghost tiny" onclick="editSku='${k}';render()">編輯</button>
        <button class="btn ghost tiny" onclick="delSku('${k}')">刪除</button></td></tr>`;});

  const lowN=ALLSKU().filter(k=>S.warehouse[k]<S.safety[k]).length;
  const noLoc=ITEMS().filter(i=>i.loc==="未設定").length;
  return `<div class="wrap wide">
    <div class="card"><div class="hd"><h2>庫存總表</h2>
      <span class="lbl" style="margin-left:auto">${ITEMS().length} 個品項</span></div>
      <div class="stats">
        <div><div class="lbl">品項總數</div><div class="fig">${ITEMS().length}</div></div>
        <div><div class="lbl">低於安全庫存</div><div class="fig" style="color:${lowN?"var(--alert)":"var(--ok)"}">${lowN}</div></div>
        <div><div class="lbl">未設定位置</div><div class="fig" style="color:${noLoc?"var(--amber-d)":"var(--ok)"}">${noLoc}</div></div>
      </div>
      <div class="tw"><table>
        <colgroup><col><col style="width:76px"><col style="width:78px"><col style="width:88px"><col style="width:124px"></colgroup>
        <tr><th>品項</th><th class="c-loc">位置</th><th class="n">倉庫</th><th class="n">安全庫存</th><th></th></tr>${rows}</table></div>
      <div class="bd" style="border-top:1px solid var(--line2)">
        <div class="lbl" style="margin-bottom:9px">匯出目前庫存報表（依儲位排序，含差額與低於安全庫存標示）</div>
        <div class="g3">
          <button class="btn ghost" onclick="exportStock('xls')">Excel</button>
          <button class="btn ghost" onclick="exportStock('doc')">Word</button>
          <button class="btn amber" onclick="exportStock('print')">直接列印</button></div></div>
      <div class="foot"><span class="lbl">依儲位排序　·　倉庫數量唯讀，只能透過「出入庫」變更</span></div></div>

    <div class="card"><div class="hd"><h2>新增庫存品項</h2></div><div class="bd">
      <div class="g2">
        <label class="f"><span class="lbl">品項名稱</span>
          <input type="text" value="${ni.name}" placeholder="例：打診棒" onchange="setNi('name',this.value)"></label>
        <label class="f"><span class="lbl">擺放位置</span>
          <select onchange="setNi('loc',this.value)">${LOCS.map(l=>`<option ${l===ni.loc?"selected":""}>${l}</option>`).join("")}</select></label>
      </div>
      <div class="g2">
        <label class="f"><span class="lbl">目前倉庫數量</span>
          <input type="number" min="0" class="num" value="${ni.qty}" onchange="setNi('qty',this.value)"></label>
        <label class="f"><span class="lbl">安全庫存</span>
          <input type="number" min="0" class="num" value="${ni.safe}" onchange="setNi('safe',this.value)"></label>
      </div>
      <button class="btn block" onclick="addSku()">新增品項</button>
    </div></div>
  </div>`;
}
async function setSafety(k,v){
  const it=itemOf(k); if(!it)return;
  await guard(async()=>{
    await rpc("mgr_item_update",{p_token:token,p_id:it.id,p_name:k,p_loc:it.loc,
      p_safety:Math.max(0,parseInt(v)||0)});
    await reload(); render();
  });
}
function setNi(k,v){nItem[k]=(k==="name"||k==="loc")?v:Math.max(0,parseInt(v)||0);}
async function addSku(){
  const n=(nItem.name||"").trim();
  if(!n)return toast("請填品項名稱");
  if(ALLSKU().includes(n))return toast(`「${n}」已經在庫存表裡了`);
  await guard(async()=>{
    await rpc("mgr_item_add",{p_token:token,p_name:n,p_loc:nItem.loc||"未設定",
      p_qty:Number(nItem.qty)||0,p_safety:Number(nItem.safe)||0});
    nItem={name:"",qty:0,safe:1,loc:"未設定"};
    await reload(); render();
  },`已新增品項：${n}`);
}
async function saveEdit(k){
  const g=id=>document.getElementById(id);
  const nn=(g("e_name").value||"").trim();
  if(!nn)return toast("品項名稱不能空白");
  if(nn!==k && ALLSKU().includes(nn))return toast(`「${nn}」已經存在`);
  const it=itemOf(k);
  await guard(async()=>{
    await rpc("mgr_item_update",{p_token:token,p_id:it.id,p_name:nn,
      p_loc:g("e_loc").value,p_safety:Math.max(0,parseInt(g("e_safe").value)||0)});
    editSku=null; await reload(); render();
  },nn!==k?`已改名為「${nn}」，盤點項目已同步`:"已更新");
}
async function delSku(k){
  const it=itemOf(k); if(!it)return;
  const inCount=RW().filter(r=>r.sku===k).length;
  const warn=inCount?`\n注意：盤點表有 ${inCount} 個位置會盤到它，會一併移除。`:"";
  if(!confirm(`刪除品項「${k}」？庫存與位置資料會一併移除。${warn}`))return;
  await guard(async()=>{
    await rpc("mgr_item_delete",{p_token:token,p_id:it.id});
    if(mv.sku===k)mv.sku=""; if(rs.sku===k)rs.sku="";
    editSku=null; await reload(); render();
  },`已刪除品項：${k}`);
}
/* ---- 車輛管理 ---- */
function setNv(k,v){nVeh[k]=k==="preload"?v:v.toUpperCase().trim();render();}
async function addVehicle(){
  const c=(nVeh.code||"").trim();
  if(!c)return toast("請填車輛代號");
  if(c.length>3)return toast("代號請在 3 個字以內");
  if(VEH().includes(c))return toast(`${c} 車已經存在`);
  await guard(async()=>{
    await rpc("mgr_vehicle_add",{p_token:token,p_code:c,p_preload:!!nVeh.preload});
    nVeh={code:"",preload:false}; await reload(); render();
  },`已新增 ${c} 車`);
}
async function delVehicle(v){
  if(!confirm(`刪除 ${v} 車？`))return;
  await guard(async()=>{
    await rpc("mgr_vehicle_delete",{p_token:token,p_id:S.vehicleIds[v]});
    if(rs.vehicle===v)rs.vehicle=""; if(mv.vehicle===v)mv.vehicle="";
    await reload(); render();
  },`已刪除 ${v} 車`);
}

/* 每個原因明確宣告效果：wh＝倉庫增減、car＝車上增減、needV＝是否要選車 */
const REASONS={
  in:[ {r:"採購入庫",wh:1,car:0},
       {r:"工具製作完成入庫",wh:1,car:0},
       {r:"車輛多出繳回",wh:1,car:0,needV:true,noCarQty:true},
       {r:"盤盈調整",wh:1,car:0} ],
  out:[{r:"遺失或損壞",wh:-1,car:1,needV:true},
       {r:"個人用品",wh:-1,car:0},
       {r:"工具製作領料",wh:-1,car:0},
       {r:"盤虧調整",wh:-1,car:0} ]
};
const rdef=()=>REASONS[mv.type].find(x=>x.r===mv.reason)||REASONS[mv.type][0];

function viewMove(){
  const d=rdef(), q=Number(mv.qty||0);
  const cur=S.warehouse[mv.sku]||0, after=cur+d.wh*q;

  const cCur=(S.onCar[v]||{})[mv.sku]||0, cAfter=cCur+d.car*q;
  const bad = after<0 || (d.car && cAfter<0);
  const r=rangeDates();
  const mine=movesInRange(mv.type);

    <td>${m.date}<div class="lbl">${m.person||"—"}</div></td>
    <td><span class="pill ${m.type}">${m.reason}</span> ${m.sku}
      ${m.vehicle?`<span class="tag" style="margin-left:4px">${m.vehicle} 車</span>`:""}
      ${m.loss?`<span class="tag" style="margin-left:4px">${m.loss}</span>`:""}
      ${m.fromCount?`<span class="tag c" style="margin-left:4px">來自盤點</span>`:""}

  return `<div class="wrap wide">
    <div class="card"><div class="hd"><h2>登錄出入庫</h2></div><div class="bd">
      <div class="g2" style="margin-bottom:13px">
        <button class="btn ${mv.type==="in"?"":"ghost"}" onclick="setMv('type','in')">入庫</button>

          <button class="btn ${(mv.loss||"遺失")==="遺失"?"amber":"ghost"}" onclick="setMv('loss','遺失')">遺失</button>
          <button class="btn ${mv.loss==="損壞"?"amber":"ghost"}" onclick="setMv('loss','損壞')">損壞</button>
        </div>`:""}
      ${d.needV?`<div class="lbl" style="margin-bottom:6px">
          ${d.car>0?"哪一台車（補到這台車上）":"哪一台車繳回"}</div>
        <div class="chips" style="margin-bottom:13px">${VEH().map(x=>
          `<button class="chip" aria-pressed="${v===x}" onclick="setMv('vehicle','${x}')">${x}</button>`).join("")}</div>`:""}
      <label class="f"><span class="lbl">品項</span>
        <select onchange="setMv('sku',this.value)">${ITEMS_BY_LOC().map(i=>
          `<option value="${i.sku}" ${i.sku===mv.sku?"selected":""}>${i.sku}（倉庫 ${S.warehouse[i.sku]}${i.loc!=="未設定"?" · 位置 "+i.loc:""}）</option>`).join("")}</select></label>
      <div class="g2">

function setMv(k,v){
  mv[k]=k==="qty"?Math.max(1,parseInt(v)||1):v;
  if(k==="type")mv.reason=REASONS[v][0].r;
  if(!mv.vehicle)mv.vehicle=VEH()[0]||"";
  if(!mv.sku)mv.sku=ALLSKU()[0]||"";
  render();
}
async function submitMove(){
  const d=rdef(), q=Number(mv.qty), v=mv.vehicle||VEH()[0];
  const it=itemOf(mv.sku); if(!it)return toast("請選擇品項");
  if((S.warehouse[mv.sku]||0)+d.wh*q<0)return toast("倉庫庫存不足");
  await guard(async()=>{
    await rpc("mgr_move",{p_token:token,p_item:it.id,p_type:mv.type,p_reason:mv.reason,
      p_qty:q,p_vehicle:d.needV?v:null,p_note:mv.note.trim(),
      p_loss:mv.reason==="遺失或損壞"?(mv.loss||"遺失"):null});
    const nm=mv.sku; mv.qty=1; mv.note="";
    await reload(); render();
    toast(`${nm} ${mv.reason} ${q}，倉庫剩 ${S.warehouse[nm]}`);
  });
}
async function fulfill(vehicle){
  const list=needList().filter(n=>!vehicle||n.vehicle===vehicle);
  if(!list.length)return;
  await guard(async()=>{
    await rpc("mgr_fulfill",{p_token:token,p_vehicle:vehicle||null});
    await reload(); render();
  },vehicle?`${vehicle} 車補料完成`:"全部補料完成，庫存已扣");
}

async function delSheet(id){

function zoom(rid,idx){lightbox={rid,idx};render();}
function lbClose(){lightbox=null;render();}
function lbStep(d){
  const r=S.records.find(x=>x.id===lightbox.rid); if(!r)return;
  const n=shotList(r).length; if(!n)return;
  lightbox.idx=(lightbox.idx+d+n)%n; render();
}
function shotList(r){
  const a=[];
  Object.keys(r.pkgPhotos||{}).forEach(nm=>a.push({src:r.pkgPhotos[nm],t:nm,sub:"本包整體照片",bad:false}));
  (r.photoLines||r.lines.filter(l=>l.photo)).filter(l=>l.photo).forEach(l=>a.push({src:l.photo,t:l.name,
    sub:`${l.pkg}　${l.type}　標配 ${l.std} → 實際 ${l.actual}${l.note?"　"+l.note:""}`,
    bad:l.type!=="正常"}));
  return a;
}
function lbHTML(){
  const r=S.records.find(x=>x.id===lightbox.rid); if(!r)return "";
  const arr=shotList(r), l=arr[lightbox.idx]; if(!l)return "";
  return `<div class="lb" onclick="lbClose()">
    <div class="lbbox" onclick="event.stopPropagation()">

        <div style="font-weight:900;font-size:15px">${l.t}</div>

}

async function addPkg(){

  if(PKGS().some(p=>p.name===n))return toast(`「${n}」已經存在`);
  await guard(async()=>{ await rpc("mgr_pkg_add",{p_token:token,p_name:n});
    nPkg=""; await reload(); render(); },`已新增包別：${n}`);
}
async function savePkg(id){
  const n=(document.getElementById("p_name").value||"").trim();
  if(!n)return toast("包別名稱不能空白");
  if(PKGS().some(p=>p.name===n&&p.id!==id))return toast(`「${n}」已經存在`);
  await guard(async()=>{ await rpc("mgr_pkg_rename",{p_token:token,p_id:id,p_name:n});
    editPkg=null; await reload(); render(); },`已更名為「${n}」`);
}
async function delPkg(id){
  const n=RW().filter(r=>r.pkg===id).length;
  if(n)return toast(`這個包別還有 ${n} 項，請先移除或搬到別的包別`);
  if(!confirm(`刪除包別「${pkgName(id)}」？`))return;
  await guard(async()=>{ await rpc("mgr_pkg_delete",{p_token:token,p_id:id});
    editPkg=null; await reload(); render(); },"已刪除包別");

      p_valuable:!!nRow.valuable,p_consumable:!!nRow.consum});

/* ---- 月報頁 ---- */
function viewMonthly(){
  const {ms,agg,byItem,byBuy}=monthlyStats();
  if(!ms.length) return `<div class="wrap wide"><div class="card">
    <div class="empty">還沒有資料。送出幾張盤點單、登錄一些出入庫之後，這裡就會出現月度趨勢。</div></div></div>`;
  const last=ms[ms.length-1], prev=ms.length>1?ms[ms.length-2]:null;
  const A=agg[last], P=prev?agg[prev]:null;

  const cards=[["遺失",1],["損壞",1],["耗材",0]].map(([k,bad])=>{
    const t=trend(A[k],P?P[k]:null,bad);
    return `<div><div class="lbl">${last} ${k}</div>
      <div class="fig">${A[k]}<span style="font-size:13px;margin-left:7px;color:${t.c}">${t.t}</span></div></div>`;}).join("");

  const head=`<tr><th>項目</th>${ms.map(m=>`<th class="n">${m.slice(5)}月</th>`).join("")}<th class="n">合計</th></tr>`;
  const body=METRICS.map(([k,desc,bad])=>{
    const tot=ms.reduce((t,m)=>t+agg[m][k],0);
    return `<tr class="${bad&&A[k]>(P?P[k]:0)?"warn":""}">
      <td class="c-name">${k}<div class="lbl">${desc}</div></td>
      ${ms.map((m,i)=>{
        const v=agg[m][k], pv=i>0?agg[ms[i-1]][k]:null, t=trend(v,pv,bad);
        return `<td class="n">${v}${i>0&&t.t!=="—"?`<div class="lbl" style="color:${t.c}">${t.t}</div>`:""}</td>`;}).join("")}
      <td class="n c-num">${tot}</td></tr>`;}).join("");

  const items=Object.keys(byItem).map(k=>({k,tot:ms.reduce((t,m)=>t+(byItem[k][m]||0),0)}))
    .filter(x=>x.tot>0).sort((a,b)=>b.tot-a.tot);
  const itemRows=items.slice(0,20).map(x=>`<tr>
    <td class="c-name">${x.k}</td>
    ${ms.map(m=>`<td class="n">${byItem[x.k][m]||"—"}</td>`).join("")}
    <td class="n c-num">${x.tot}</td></tr>`).join("");

  return `<div class="wrap wide">
    <div class="card"><div class="hd"><h2>月度工具狀態</h2>
      <span class="lbl" style="margin-left:auto">${ms[0]} ~ ${last}</span></div>
      <div class="stats">${cards}</div>
      <div class="bd" style="border-bottom:1px solid var(--line2)">
        <div class="lbl" style="margin-bottom:7px">統計範圍</div>
        <div class="chips">${[[3,"近 3 個月"],[6,"近 6 個月"],[12,"近 12 個月"],["all","全部"]].map(([v,t])=>
          `<button class="chip" style="min-width:auto;padding:0 13px;font-family:var(--tc);font-size:13.5px;font-weight:700"
            aria-pressed="${String(mRange)===String(v)}" onclick="setMRange('${v}')">${t}</button>`).join("")}</div>
      </div>
      <div class="tw"><table>
        <colgroup><col>${ms.map(()=>`<col style="width:72px">`).join("")}<col style="width:72px"></colgroup>
        ${head}${body}</table></div>
      <div class="foot"><span class="lbl">
        箭頭為與前一個月相比。遺失與損壞往上是壞事（紅色），往下是好事（綠色）；耗材屬正常消耗，不判好壞。<br>
        數字以<b>實際補料</b>為準（補了幾個就是損失幾個），同一筆損失不會因為連續盤到而重複計算；
        盤到但尚未補料的，會算在實際補料的那個月</span></div></div>

    <div class="card"><div class="hd"><h2>遺失與損壞品項</h2>
      <span class="lbl" style="margin-left:auto">${items.length} 項</span></div>
      ${items.length?`<div class="tw"><table>
        <colgroup><col>${ms.map(()=>`<col style="width:72px">`).join("")}<col style="width:72px"></colgroup>
        <tr><th>品項</th>${ms.map(m=>`<th class="n">${m.slice(5)}月</th>`).join("")}<th class="n">合計</th></tr>
        ${itemRows}</table></div>
        ${items.length>20?`<div class="foot"><span class="lbl">僅顯示前 20 項，匯出報表含全部</span></div>`:""}`
      :`<div class="empty">這段期間沒有工具遺失或損壞。</div>`}</div>

    <div class="card"><div class="hd"><h2>採購品項明細</h2>
      <span class="lbl" style="margin-left:auto">${Object.keys(byBuy).length} 項</span></div>
      ${Object.keys(byBuy).length?`<div class="tw"><table>
        <colgroup><col>${ms.map(()=>`<col style="width:72px">`).join("")}<col style="width:72px"></colgroup>
        <tr><th>品項</th>${ms.map(m=>`<th class="n">${m.slice(5)}月</th>`).join("")}<th class="n">合計</th></tr>
        ${Object.keys(byBuy).map(k=>({k,tot:ms.reduce((t,m)=>t+(byBuy[k][m]||0),0)}))
          .sort((a,b)=>b.tot-a.tot).slice(0,20).map(x=>`<tr>
          <td class="c-name">${x.k}</td>
          ${ms.map(m=>`<td class="n">${byBuy[x.k][m]||"—"}</td>`).join("")}
          <td class="n c-num">${x.tot}</td></tr>`).join("")}</table></div>`
      :`<div class="empty">這段期間沒有採購入庫紀錄。</div>`}</div>

    <div class="card"><div class="hd"><h2>匯出月報</h2></div><div class="bd">
      <div class="g3">
        <button class="btn ghost" onclick="exportMonthly('xls')">Excel</button>
        <button class="btn ghost" onclick="exportMonthly('doc')">Word</button>
        <button class="btn amber" onclick="exportMonthly('print')">直接列印</button></div>
      <div class="lbl" style="margin-top:9px">含月度比較表、遺失損壞品項明細、採購品項明細，可直接列印給主管</div>
    </div></div>
  </div>`;
}
function setMRange(v){mRange=(v==="all")?"all":Number(v);render();}
function exportMonthly(fmt){
  const {ms,agg,byItem,byBuy}=monthlyStats();
  if(!ms.length)return toast("還沒有可統計的資料");
  const w1=Math.max(14,Math.floor(58/Math.max(1,ms.length)));
  const cols=[{t:"項目",w:100-w1*ms.length-14,px:110}]
    .concat(ms.map(m=>({t:m.slice(5)+"月",w:w1,px:52,n:1})))
    .concat([{t:"合計",w:14,px:52,n:1}]);
  const rows=METRICS.map(([k,desc])=>({c:[k].concat(ms.map(m=>agg[m][k]))
    .concat([ms.reduce((t,m)=>t+agg[m][k],0)])}));
  const items=Object.keys(byItem).map(k=>({k,tot:ms.reduce((t,m)=>t+(byItem[k][m]||0),0)}))
    .filter(x=>x.tot>0).sort((a,b)=>b.tot-a.tot);
  const buys=Object.keys(byBuy).map(k=>({k,tot:ms.reduce((t,m)=>t+(byBuy[k][m]||0),0)}))
    .filter(x=>x.tot>0).sort((a,b)=>b.tot-a.tot);
  const extra=[
    {title:"遺失與損壞品項明細",cols,
     rows:items.map(x=>({c:[x.k].concat(ms.map(m=>byItem[x.k][m]||"")).concat([x.tot])})),
     foot:"依實際補料統計，耗材正常消耗不計入。"},
    {title:"採購品項明細",cols,
     rows:buys.map(x=>({c:[x.k].concat(ms.map(m=>byBuy[x.k][m]||"")).concat([x.tot])})),
     foot:"來源為出入庫登錄的「採購入庫」。"}
  ];
  const A=agg[ms[ms.length-1]];
  const html=reportHTML("鉅誠驗屋 · 月度工具狀態報表",
    [`統計期間：${ms[0]} ~ ${ms[ms.length-1]}`,`車輛數：${VEH().length}`,
     `本月遺失 ${A.遺失}　損壞 ${A.損壞}　耗材 ${A.耗材}　採購 ${A.採購}`,
     `列印日期：${today()}`,`製表：${me?me.name:"—"}`],
    cols,rows,
    "數字以實際補料為準：遺失與損壞為工具實際補出／汰換的數量，耗材為耗材補充量。同一筆損失只計一次。",extra);
  if(fmt==="print")return printReport(html);
  const fn=`月度工具狀態_${stamp(ms[0])}-${stamp(ms[ms.length-1])}`;
  fmt==="doc"?download(fn+".doc","application/msword",html)
             :download(fn+".xls","application/vnd.ms-excel",html);
}

/* ---- 車輛管理（獨立分頁） ---- */
function viewVehicles(){
  const vlist=VEH().map(v=>{
    const used=S.records.some(r=>r.vehicle===v);
    const last=S.records.find(r=>r.vehicle===v);
    const cnt=S.records.filter(r=>r.vehicle===v).length;
    return `<tr><td class="num" style="font-size:17px;font-weight:600">${v}</td>
      <td style="color:var(--muted);font-size:13px">${used?`${cnt} 張盤點單　最近 ${last.date}`:"尚未使用"}</td>
      <td class="n">${used?`<span class="lbl">不可刪除</span>`:`<button class="btn ghost tiny" onclick="delVehicle('${v}')">刪除</button>`}</td></tr>`;}).join("");
  return `<div class="wrap wide">
    <div class="card"><div class="hd"><h2>車輛清單</h2>
      <span class="lbl" style="margin-left:auto">目前 ${VEH().length} 台</span></div>
      <div class="tw"><table><colgroup><col style="width:70px"><col><col style="width:80px"></colgroup><tr><th>車別</th><th>使用狀況</th><th></th></tr>${vlist}</table></div>
      <div class="foot"><span class="lbl">已有盤點紀錄的車不能刪除，避免歷史資料失去對應</span></div></div>

    <div class="card"><div class="hd"><h2>盤點拍照模式</h2>
      <span class="lbl" style="margin-left:auto">${byItem()?"每項一張":"每包一張"}</span></div>
      <div class="bd">
        <div class="g2" style="margin-bottom:12px">
          <button class="btn ${byItem()?"ghost":"amber"}" onclick="setPhotoMode('pkg')">每包一張</button>
          <button class="btn ${byItem()?"amber":"ghost"}" onclick="setPhotoMode('item')">每項一張</button>
        </div>
        <div class="tw"><table>
          <colgroup><col><col style="width:76px"><col style="width:80px"><col style="width:88px"></colgroup>
          <tr><th></th><th class="n">每車每次</th><th class="n">全隊上限</th><th class="n">估算容量</th></tr>
          ${[["每包一張",PKGS().length,!byItem()],["每項一張",RW().length,byItem()]].map(([t,n,cur])=>{
            const tot=n*VEH().length*KEEP, mb=Math.round(tot*0.1);
            return `<tr class="${cur?"warn":""}"><td class="c-name">${t}${cur?"（目前）":""}</td>
              <td class="n c-num">${n} 張</td><td class="n">${tot} 張</td>
              <td class="n">${mb} MB</td></tr>`;}).join("")}
        </table></div>
        <div class="lbl" style="margin-top:9px;line-height:1.7">
          估算以每張約 100KB 計。免費雲端空間為 1024 MB，
          目前上限用量約 ${Math.round((byItem()?RW().length:PKGS().length)*VEH().length*KEEP*0.1/1024*100)}%。
          增加車輛或盤點項目時，這裡的數字會跟著變。</div>
      </div>
      <div class="foot"><span class="lbl">切換後下一張盤點單即生效，已送出的紀錄不受影響</span></div></div>

    <div class="card"><div class="hd"><h2>照片保留</h2>
      <span class="lbl" style="margin-left:auto">每車 ${KEEP} 組</span></div>
      <div class="bd">
        <div class="lbl" style="line-height:1.7">每台車只保留最新 ${KEEP} 組盤點照片，第 ${KEEP+1} 組以後的照片會自動刪除，
        盤點紀錄本身（數量、異常、盤點人）永久保留。<br>
        目前存有照片的盤點單：${S.records.filter(r=>!r.pruned).length} 組
        ／ 已清除照片：${S.records.filter(r=>r.pruned).length} 組</div>
      </div></div>

    <div class="card"><div class="hd"><h2>操作者</h2>
      <span class="lbl" style="margin-left:auto">${S.admins.length} 位</span></div>
      <div class="tw"><table><colgroup><col><col style="width:110px"><col style="width:80px"></colgroup>
        <tr><th>姓名</th><th>狀態</th><th></th></tr>
        ${S.admins.map(a=>`<tr><td class="c-name" style="font-weight:700">${a.name}</td>
          <td style="color:var(--muted);font-size:13px">${me&&me.id===a.id?"使用中":"—"}</td>
          <td class="n" style="white-space:nowrap">
            <button class="btn ghost tiny" onclick="resetPin('${a.id}')">改PIN</button>
            ${me&&me.id===a.id?"":`<button class="btn ghost tiny" onclick="delAdmin('${a.id}')">刪除</button>`}</td></tr>`).join("")}
      </table></div>
      <div class="bd" style="border-top:1px solid var(--line2)">
        <div class="lbl" style="margin-bottom:9px">新增操作者</div>
        <label class="f"><span class="lbl">姓名</span>
          <input type="text" value="${setup.name}" placeholder="例：冠揚" onchange="setup.name=this.value"></label>
        <div class="g2">
          <label class="f"><span class="lbl">設定 4 位數 PIN</span>
            <input type="password" inputmode="numeric" maxlength="4" class="num" style="text-align:center;letter-spacing:.4em"
              value="${setup.pin}" placeholder="••••" onchange="setup.pin=this.value"></label>
          <label class="f"><span class="lbl">再輸入一次</span>
            <input type="password" inputmode="numeric" maxlength="4" class="num" style="text-align:center;letter-spacing:.4em"
              value="${setup.pin2}" placeholder="••••" onchange="setup.pin2=this.value"></label></div>
        <button class="btn block" onclick="addAdmin()">新增操作者</button></div>
      <div class="foot"><span class="lbl">PIN 存在本機、用於區分操作者並擋掉隨手誤入，不是正式的資安機制；正式版接後端帳號系統時可直接沿用這份名單</span></div></div>

    <div class="card"><div class="hd"><h2>新增車輛</h2></div><div class="bd">
      <label class="f"><span class="lbl">車輛代號（3 字以內）</span>
        <input type="text" value="${nVeh.code}" placeholder="例：G、中1" maxlength="3" onchange="setNv('code',this.value)"></label>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13.5px;cursor:pointer">
        <input type="checkbox" ${nVeh.preload?"checked":""} onchange="setNv('preload',this.checked)"
          style="width:18px;height:18px"> 直接帶入整套標配數量（新車已配齊時勾選）</label>
      <button class="btn block" onclick="addVehicle()">新增車輛</button>
      <div class="lbl" style="margin-top:8px">不勾選則車上在庫從 0 起算，之後用出入庫的「遺失或損壞」逐項配上去</div>
    </div></div>
  </div>`;
}

/* ===================== 導覽 ===================== */
const TABS={field:[["count","☑","盤點"]],
  admin:[["restock","⚑","待補料"],["stock","▤","庫存"],["items","☑","項目"],
         ["move","⇅","出入庫"],["result","▦","結果"],["month","◷","月報"],["veh","⚙","設定"]]};
function render(){
  const app=document.getElementById("app"), hdr=document.getElementById("hdr"), nv=document.getElementById("nav");
  document.body.classList.toggle("norole",!role);
  if(!role){ hdr.innerHTML=`<div><h1>鉅誠驗屋 · 設備盤點系統</h1><div class="sub">${REGION}</div></div>`;
    nv.className="tabs hide"; app.innerHTML=viewGate(); return; }
  hdr.innerHTML=`<div><h1>${role==="field"?"設備盤點":`設備管理${me?" · "+me.name:""}`}</h1>
    <div class="sub">${REGION} / ${role==="field"?RW().length+" 項":VEH().join(" ")}</div></div>
    <button class="sw" onclick="switchRole()">切換身分</button>`;
  const t=TABS[role];
  if(t.length>1){ nv.className="tabs"; nv.style.gridTemplateColumns=`repeat(${t.length},1fr)`;
    nv.innerHTML=t.map(([k,i,l])=>`<button aria-selected="${tab===k}" onclick="go('${k}')"><span class="ic">${i}</span>${l}</button>`).join("");
    document.body.classList.remove("norole");
  } else { nv.className="tabs hide"; document.body.classList.add("norole"); }
  app.innerHTML = role==="field" ? viewField()
    : tab==="move" ? viewMove() : tab==="result" ? viewResult()
    : tab==="veh" ? viewVehicles() : tab==="items" ? viewItems()
    : tab==="month" ? viewMonthly()
    : tab==="stock" ? viewStock() : viewRestock();
}
function go(k){tab=k;openRec=null;lightbox=null;editSku=null;editRow=null;editPkg=null;window.scrollTo(0,0);render();}
boot();
</script>
